<script type="module">
// 모델 답변은 **여기 하나로만** 그린다 — 스트리밍 미리보기와 최종 답변이 같은 경로를 쓴다.
import { renderMarkdownInto } from '/markdown.js';
import { approvalIsActive, projectionOptions } from '/approval-state.js';
const wrap = document.getElementById('wrap');
const chip = document.getElementById('chip');
const statePanel = document.getElementById('state');
const modelinfo = document.getElementById('modelinfo');
const text = document.getElementById('text');
const send = document.getElementById('send');
const attach = document.getElementById('attach');
const filepick = document.getElementById('filepick');
const attachlist = document.getElementById('attachlist');
const sessionsEl = document.getElementById('sessions');
let currentSessionId = null;
let stagedAttachments = [];
let activeLocalTurns = 0;
const sessionActivityById = new Map();
const workRealityBySession = new Map();
let workRealityPanelTimer = 0;
let sessionListRefreshTimer = null;
const RUNTIME_RELOAD_STATE_KEY = 't5-runtime-reload-state-v1';

function rememberPageStateForReload() {
  try {
    sessionStorage.setItem(RUNTIME_RELOAD_STATE_KEY, JSON.stringify({
      sessionId: currentSessionId,
      text: text.value,
      attachments: stagedAttachments,
      savedAt: Date.now(),
    }));
  } catch { /* 저장소가 막혀도 사용자가 직접 새로고침할 수 있다 */ }
}

function savedPageState() {
  try { return JSON.parse(sessionStorage.getItem(RUNTIME_RELOAD_STATE_KEY) || 'null'); }
  catch { return null; }
}

async function restorePageStateAfterReload(saved) {
  if (!saved || saved.sessionId !== currentSessionId) return;
  text.value = typeof saved.text === 'string' ? saved.text : '';
  text.dispatchEvent(new Event('input'));
  if (Array.isArray(saved.attachments) && saved.attachments.length) {
    const wanted = new Set(saved.attachments.map((record) => record.attachmentId));
    const live = await fetch(`/attachments?sessionId=${encodeURIComponent(currentSessionId)}`)
      .then((response) => response.ok ? response.json() : ({ attachments: [] }))
      .catch(() => ({ attachments: [] }));
    stagedAttachments = (live.attachments ?? []).filter((record) => wanted.has(record.attachmentId));
    renderStagedAttachments();
  }
  try { sessionStorage.removeItem(RUNTIME_RELOAD_STATE_KEY); } catch {}
}

function runtimeNotice(message, reconnect = false) {
  let notice = document.getElementById('runtime-notice');
  if (!notice) {
    notice = document.createElement('div'); notice.id = 'runtime-notice'; notice.className = 'runtime-notice';
    notice.setAttribute('role', 'status'); notice.setAttribute('aria-live', 'polite');
    document.body.appendChild(notice);
  }
  notice.replaceChildren(el(null, message));
  if (reconnect) {
    const button = document.createElement('button'); button.type = 'button'; button.textContent = '화면 다시 연결';
    button.onclick = () => { rememberPageStateForReload(); location.reload(); };
    notice.appendChild(button);
  }
}

addEventListener('t5:runtime-connection', (event) => {
  if (event.detail?.connected) {
    const notice = document.getElementById('runtime-notice');
    if (notice && !notice.querySelector('button')) notice.remove();
    return;
  }
  runtimeNotice('T5와 다시 연결하고 있어요…');
});

addEventListener('t5:runtime-changed', () => {
  const canReloadQuietly = !text.value.trim() && stagedAttachments.length === 0 && activeLocalTurns === 0;
  workRealityBySession.clear();
  if (workRealityPanelTimer) clearTimeout(workRealityPanelTimer);
  workRealityPanelTimer = 0;
  document.getElementById('work-reality-panel')?.remove();
  rememberPageStateForReload();
  if (canReloadQuietly) { location.reload(); return; }
  runtimeNotice('T5가 새로 준비됐어요. 쓰던 내용은 그대로 보관해 두었어요.', true);
  queueMicrotask(() => { 대화다시그리기().catch(() => {}); });
});

function scheduleSessionListRefresh() {
  if (sessionListRefreshTimer) return;
  sessionListRefreshTimer = setTimeout(() => {
    sessionListRefreshTimer = null;
    loadSessions().catch(() => {});
  }, 120);
}

addEventListener('t5:session-activity', async (event) => {
  const activity = event.detail ?? {};
  if (!activity.sessionId) return;
  if (activity.done || activity.status !== 'running') sessionActivityById.delete(activity.sessionId);
  else sessionActivityById.set(activity.sessionId, activity);
  scheduleSessionListRefresh();
  if (activity.sessionId !== currentSessionId) return;
  if (!activity.done && activity.status === 'running') {
    renderSessionActivity(activity);
    return;
  }
  // 현재 탭이 직접 시작한 stream은 complete/recoverable_error가 마지막 표면을 그린다. 여기서 먼저
  // 원장만 다시 그리면 중지 안내가 나타나자마자 지워진다. 다른 탭·재진입 작업만 서버 투영을 따른다.
  if (activeLocalTurns > 0) return;
  await 대화다시그리기().catch(() => {});
});

addEventListener('t5:work-reality', (event) => {
  const reality = event.detail ?? {};
  if (!reality.sessionId) return;
  const previous = workRealityBySession.get(reality.sessionId);
  if (previous && Number(reality.version) <= Number(previous.version)) return;
  workRealityBySession.set(reality.sessionId, reality);
  scheduleSessionListRefresh();
  if (reality.sessionId === currentSessionId) renderWorkReality(reality);
});

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fileSize = (bytes) => bytes < 1024 ? `${bytes} B` : bytes < 1024 * 1024
  ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;

function attachmentChip(record, removable = false) {
  const chip = el('attach-chip');
  chip.appendChild(el(null, record.kind === 'image' ? '🖼' : record.kind === 'audio' ? '🔊'
    : record.kind === 'video' ? '🎬' : record.kind === 'archive' ? '🗜' : '📎'));
  const name = el('aname', `${record.originalName} · ${fileSize(record.bytes)}`);
  chip.appendChild(name);
  if (removable) {
    const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '✕';
    remove.setAttribute('aria-label', `${record.originalName} 첨부 취소`);
    remove.onclick = async () => {
      remove.disabled = true;
      const response = await fetch(`/attachments/${record.attachmentId}/discard`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId: currentSessionId }),
      });
      if (response.ok) {
        stagedAttachments = stagedAttachments.filter((item) => item.attachmentId !== record.attachmentId);
        renderStagedAttachments();
      } else remove.disabled = false;
    };
    chip.appendChild(remove);
  }
  return chip;
}

function renderStagedAttachments() {
  attachlist.replaceChildren(...stagedAttachments.map((record) => attachmentChip(record, true)));
}

function renderMessageAttachments(box, records = []) {
  if (!records.length) return;
  const row = el('attachment-row');
  for (const record of records) {
    const link = document.createElement('a'); link.href = record.downloadUrl; link.target = '_blank';
    link.rel = 'noopener'; link.style.textDecoration = 'none'; link.appendChild(attachmentChip(record));
    row.appendChild(link);
  }
  box.appendChild(row);
}

const artifactFrames = new Map();
const artifactLogs = new Map();
function registerArtifactFrame(record, frame) {
  const frames = artifactFrames.get(record.attachmentId) ?? new Set();
  frames.add(frame); artifactFrames.set(record.attachmentId, frames);
}
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.type !== 't5-artifact-log' || typeof data.artifactId !== 'string') return;
  const frames = artifactFrames.get(data.artifactId);
  if (!frames || ![...frames].some((frame) => frame.contentWindow === event.source)) return;
  const logs = artifactLogs.get(data.artifactId) ?? [];
  logs.push({ level: ['error', 'warn', 'log'].includes(data.level) ? data.level : 'log', text: String(data.text ?? '').slice(0, 2000) });
  artifactLogs.set(data.artifactId, logs.slice(-50));
});

function appendHumanArtifactReceipt(host, receipt) {
  if (!receipt?.detailsAvailable) return;
  const details = document.createElement('details'); details.className = 'artifact-receipt';
  const summary = document.createElement('summary'); summary.textContent = receipt.title;
  details.appendChild(summary);
  const lines = [...(receipt.confirmed ?? []), ...(receipt.changed ?? []), receipt.verification,
    receipt.delivery, receipt.recovery, ...(receipt.unknowns ?? [])].filter(Boolean);
  for (const line of [...new Set(lines)]) details.appendChild(el('meta', line));
  host.appendChild(details);
}

function renderHumanEffects(host, receipts = []) {
  for (const receipt of receipts) {
    if (!receipt?.detailsAvailable) continue;
    const details = document.createElement('details'); details.className = 'effect-receipt';
    const summary = document.createElement('summary'); summary.textContent = receipt.title;
    details.appendChild(summary);
    const lines = [receipt.confirmed?.length ? `확인한 범위: ${receipt.confirmed.join(', ')}` : null,
      receipt.rollback, ...(receipt.unknowns ?? [])].filter(Boolean);
    for (const line of [...new Set(lines)].slice(0, 12)) details.appendChild(el('meta', line));
    host.appendChild(details);
  }
}

function renderArtifacts(box, records = []) {
  if (!records.length) return;
  for (const record of records) {
    if (record.previewUrl) {
      const surface = el('artifact-surface');
      const head = el('artifact-head');
      head.appendChild(el(null, record.previewKind === 'web' || record.previewKind === 'web_app' ? '🌐'
        : record.previewKind === 'spreadsheet' ? '▦' : record.previewKind === 'document' ? '▤'
          : record.previewKind === 'image' || record.previewKind === 'vector' ? '🖼' : '📄'));
      const title = el('artifact-title');
      title.appendChild(el('artifact-name', record.originalName));
      title.appendChild(el('meta', `${fileSize(record.bytes)} · 결과물${record.artifactVersion ? ` · 버전 ${record.artifactVersion}` : ''}${record.createdAt ? ` · ${formatCanonicalTime(record.createdAt)}` : ''}`));
      head.appendChild(title); surface.appendChild(head);

      let preview;
      if (record.previewKind === 'image') {
        preview = document.createElement('img'); preview.alt = `${record.originalName} 미리보기`;
      } else {
        preview = document.createElement('iframe');
        preview.title = `${record.originalName} 미리보기`;
        // 생성된 문서는 T5 DOM·쿠키와 다른 opaque origin에서만 실행한다. 웹 결과의 로컬 JavaScript만
        // 허용하고 form·popup·download·same-origin·network는 서버 CSP가 막는다.
        if (record.previewKind !== 'pdf') {
          preview.setAttribute('sandbox', ['web', 'web_app'].includes(record.previewKind) ? 'allow-scripts' : '');
        }
        preview.loading = 'lazy';
      }
      preview.className = 'artifact-preview'; preview.src = record.previewUrl;
      surface.appendChild(preview);
      if (preview.tagName === 'IFRAME') registerArtifactFrame(record, preview);

      const actions = el('artifact-actions');
      const larger = document.createElement('button'); larger.type = 'button'; larger.textContent = '크게 보기';
      larger.onclick = () => openArtifactDetail(record, 'preview'); actions.appendChild(larger);
      const download = document.createElement('a'); download.href = record.downloadUrl;
      download.download = record.originalName; download.textContent = '파일 받기'; actions.appendChild(download);
      if (record.sourceUrl) {
        const source = document.createElement('button'); source.type = 'button';
        source.textContent = record.previewKind === 'web_app' ? '파일 보기' : '원문 보기';
        source.onclick = () => openArtifactDetail(record, 'source'); actions.appendChild(source);
      }
      if (['web', 'web_app'].includes(record.previewKind)) {
        const logs = document.createElement('button'); logs.type = 'button'; logs.textContent = '실행 기록';
        logs.onclick = () => openArtifactDetail(record, 'logs'); actions.appendChild(logs);
      }
      if (record.versionsUrl) {
        const versions = document.createElement('button'); versions.type = 'button'; versions.textContent = '버전';
        versions.onclick = () => openArtifactDetail(record, 'versions'); actions.appendChild(versions);
      }
      surface.appendChild(actions);
      appendHumanArtifactReceipt(surface, record.humanReceipt);
      box.appendChild(surface); continue;
    }
    const row = el('attachment-row');
    const card = document.createElement('a'); card.className = 'artifact-card';
    card.href = record.downloadUrl; card.download = record.originalName;
    card.appendChild(el(null, '📄'));
    const info = document.createElement('div');
    info.appendChild(el(null, record.originalName));
    info.appendChild(el('meta', `${fileSize(record.bytes)} · 다운로드${record.createdAt ? ` · ${formatCanonicalTime(record.createdAt)}` : ''}`));
    card.appendChild(info); row.appendChild(card);
    appendHumanArtifactReceipt(row, record.humanReceipt);
    box.appendChild(row);
  }
}

async function openArtifactDetail(record, mode = 'preview') {
  const dialog = document.createElement('dialog'); dialog.className = 'artifact-dialog';
  const shell = el('artifact-dialog-shell');
  const head = el('artifact-dialog-head'); head.appendChild(el('strong', record.originalName));
  const close = document.createElement('button'); close.type = 'button'; close.textContent = '×';
  close.setAttribute('aria-label', '결과물 닫기'); close.onclick = () => dialog.close();
  head.appendChild(close); shell.appendChild(head);
  const body = el('artifact-dialog-body'); shell.appendChild(body); dialog.appendChild(shell);
  dialog.addEventListener('close', () => dialog.remove(), { once: true });
  document.body.appendChild(dialog); dialog.showModal();
  if (mode === 'source') {
    try {
      const response = await fetch(record.sourceUrl);
      if (!response.ok) throw new Error('원문을 불러오지 못했어요.');
      if (record.previewKind === 'web_app') {
        const manifest = await response.json();
        const list = el('artifact-files');
        for (const file of manifest.files ?? []) {
          const item = document.createElement('li');
          const show = document.createElement('button'); show.type = 'button';
          show.appendChild(el('code', file.path));
          show.onclick = async () => {
            const encoded = file.path.split('/').map(encodeURIComponent).join('/');
            const sourceUrl = record.previewUrl.replace(/index\.html(?:\?.*)?$/u, encoded);
            const sourceResponse = await fetch(`${sourceUrl}?source=1`);
            if (!sourceResponse.ok) { toast('이 파일은 화면에서 원문을 볼 수 없어요.'); return; }
            const pre = el('artifact-source'); pre.textContent = await sourceResponse.text();
            body.replaceChildren(pre);
          };
          item.appendChild(show);
          item.appendChild(el('meta', fileSize(file.bytes))); list.appendChild(item);
        }
        body.appendChild(list);
      } else {
        const source = el('artifact-source'); source.textContent = await response.text(); body.appendChild(source);
      }
    } catch (error) { body.appendChild(el('msg bot error', error?.message ?? '원문을 불러오지 못했어요.')); }
    return;
  }
  if (mode === 'logs') {
    const logs = artifactLogs.get(record.attachmentId) ?? [];
    if (!logs.length) { body.appendChild(el('msg bot', '현재 미리보기에서 실행 오류가 발견되지 않았어요.')); return; }
    const list = el('artifact-log');
    for (const log of logs) list.appendChild(el(log.level, `[${log.level}] ${log.text}`));
    body.appendChild(list); return;
  }
  if (mode === 'versions') {
    try {
      const response = await fetch(record.versionsUrl);
      if (!response.ok) throw new Error('버전 기록을 불러오지 못했어요.');
      const payload = await response.json();
      const list = el('artifact-files');
      for (const version of payload.versions ?? []) {
        const item = document.createElement('li');
        const show = document.createElement('button'); show.type = 'button';
        show.textContent = `버전 ${version.artifactVersion} · ${version.originalName}`;
        show.onclick = () => { dialog.close(); openArtifactDetail(version, 'preview'); };
        item.appendChild(show); item.appendChild(el('meta', `${fileSize(version.bytes)}${version.createdAt ? ` · ${formatCanonicalTime(version.createdAt)}` : ''}`)); list.appendChild(item);
      }
      body.appendChild(list);
    } catch (error) { body.appendChild(el('msg bot error', error?.message ?? '버전 기록을 불러오지 못했어요.')); }
    return;
  }
  let preview;
  if (record.previewKind === 'image') {
    preview = document.createElement('img'); preview.alt = `${record.originalName} 원본 크기`;
  } else {
    preview = document.createElement('iframe'); preview.title = `${record.originalName} 크게 보기`;
    if (record.previewKind !== 'pdf') {
      preview.setAttribute('sandbox', ['web', 'web_app'].includes(record.previewKind) ? 'allow-scripts' : '');
    }
  }
  preview.src = record.previewUrl; body.appendChild(preview);
  if (preview.tagName === 'IFRAME') registerArtifactFrame(record, preview);
}

async function uploadFiles(files) {
  if (!files.length) return;
  if (!currentSessionId) await newSession();
  const remaining = 10 - stagedAttachments.length;
  if (remaining <= 0) { sysline('한 번에 첨부할 수 있는 파일은 10개까지예요.'); return; }
  attach.disabled = true;
  try {
    for (const file of [...files].slice(0, remaining)) {
      if (file.size > 128 * 1024 * 1024) { sysline(`${file.name}은 128MB를 넘어 첨부하지 않았어요.`); continue; }
      const response = await fetch(`/attachments?sessionId=${encodeURIComponent(currentSessionId)}&filename=${encodeURIComponent(file.name)}`, {
        method: 'POST', headers: { 'content-type': file.type || 'application/octet-stream' }, body: file,
      });
      const record = await response.json();
      if (!response.ok) { sysline(record.error || `${file.name}을 첨부하지 못했어요.`); continue; }
      stagedAttachments.push(record);
      renderStagedAttachments();
    }
  } finally {
    attach.disabled = false; filepick.value = '';
  }
}

document.querySelectorAll('[data-soon]').forEach((n) => {
  n.addEventListener('click', () => sysline(`${n.dataset.soon} 화면은 다음 단계에서 준비됩니다. 지금은 채팅으로 이어가 주세요.`));
});
document.getElementById('hb').onclick = () => document.body.classList.toggle('nav-open');
const THEME_STORAGE_KEY = 'gpao-t5.theme-mode';
function currentThemeMode() {
  const explicit = document.documentElement.getAttribute('data-theme');
  return explicit === 'light' || explicit === 'dark' ? explicit : 'system';
}
function applyThemeMode(mode, persist = true) {
  if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
  else document.documentElement.removeAttribute('data-theme');
  if (persist) {
    try { localStorage.setItem(THEME_STORAGE_KEY, mode); } catch { /* 현재 화면에는 적용을 유지한다. */ }
  }
  const label = mode === 'dark' ? '어둡게' : mode === 'light' ? '밝게' : '시스템 설정 따름';
  const button = document.getElementById('theme');
  button.title = `테마: ${label}`;
  button.setAttribute('aria-label', `테마: ${label}`);
}
function toggleTheme() {
  const cur = currentThemeMode();
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'system' : 'dark';
  applyThemeMode(next);
}
document.getElementById('theme').onclick = toggleTheme;
applyThemeMode(currentThemeMode(), false);
document.getElementById('newchat').onclick = () => newSession();
chip.onclick = async () => {
  const open = statePanel.style.display !== 'block';
  statePanel.style.display = open ? 'block' : 'none';
  // 열 때만 요약을 채운다(안티 대시보드). 모델 연결 **관리**는 설정 허브 한 곳에서만 —
  // 같은 기능을 두 화면에서 따로 관리하지 않는다(Pre-P-OP-7 UX Closure).
  if (open) { await refreshOverview(); renderModelSettingsLink(); }
};
function renderModelSettingsLink() {
  let l = document.getElementById('mcLink');
  if (l) return;
  l = document.createElement('div'); l.id = 'mcLink'; l.className = 'ov';
  l.innerHTML = '모델·메신저·연결·스킬 관리는 <a style="cursor:pointer; text-decoration:underline;">설정</a>에서 해요.';
  l.querySelector('a').onclick = () => { statePanel.style.display = 'none'; openSettings('model'); };
  statePanel.appendChild(l);
}

async function endpointJson(url, options) {
  try {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));
    return { ok: response.ok, data, status: response.status };
  } catch {
    return { ok: false, data: {}, status: 0 };
  }
}
function endpointError(result, fallback) {
  return result?.data?.error ?? result?.data?.userSafeSummary ?? fallback;
}
const MODEL_PROVIDER_LABEL = {
  openai: 'OpenAI', anthropic: 'Claude', gemini: 'Gemini', upstage: 'Upstage',
  chatgpt_oauth: 'ChatGPT 계정',
};

// ── 모델 연결 (P-RT-4 → P-ONB-2) ── 칩 패널에서 키를 연결한다. 서버가 "확실한 무효만 거절"을
//   보장한다: 확인된 것은 검증됨으로, 도달 못 한 것은 저장하되 "모델 확인 필요"로 표시한다.
//   응답엔 마스킹 키·사용자 언어만 온다(원본 키·원문 진단 없음). 안티 대시보드: 열 때만.
async function renderModelConnect(target) {
  let box = document.getElementById('modelConnect');
  if (!box) {
    box = document.createElement('div'); box.id = 'modelConnect'; box.className = 'ov';
    box.innerHTML = `
      <b>모델 연결</b>
      <div id="mcStatus" style="margin:4px 0;"></div>
      <div id="mcCapabilities" class="tb-hint"></div>
      <div class="connection-fields">
        <select id="mcProvider" aria-label="API 제공자"></select>
        <input id="mcKey" type="password" placeholder="API 키" aria-label="API 키" autocomplete="off">
        <input id="mcModel" type="text" placeholder="모델(비우면 기본)" aria-label="모델 이름">
      </div>
      <div class="tb-hint">API 키는 대화가 아닌 이 입력칸에서만 받아요. 검증된 키는 이 Mac의 T5 전용
        저장소에 다른 계정이 읽지 못하도록 보관하고, 화면에는 연결 이름과 저장 상태만 표시해요.</div>
      <div class="connection-actions">
        <button id="mcConnect" class="connection-button primary">API 키로 연결</button>
        <button id="mcDisconnect" class="connection-button">현재 연결 해제</button>
      </div>
      <div class="connection-alt">
        <button id="mcChatgpt" class="connection-button primary">ChatGPT 계정으로 연결</button>
        <span class="tb-hint">API 키 대신 계정 연결을 선택할 수 있어요.</span>
      </div>
      <div id="mcList" style="margin:4px 0;"></div>
      <div id="mcResult" role="status" aria-live="polite"></div>`;
    (target ?? statePanel).appendChild(box);
    box.querySelector('#mcConnect').onclick = async () => {
      const body = {
        provider: box.querySelector('#mcProvider').value,
        key: box.querySelector('#mcKey').value,
        modelId: box.querySelector('#mcModel').value || undefined,
      };
      const providerLabel = MODEL_PROVIDER_LABEL[body.provider] ?? body.provider;
      setModelConnectBusy(box, true, '#mcConnect', '연결 중…', 'API 키로 연결');
      showModelConnectionResult(box, `${providerLabel} 연결 작업 중…`, 'working');
      try {
        const result = await endpointJson('/model/connect', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
        });
        if (result.ok && result.data?.connected) {
          box.querySelector('#mcKey').value = ''; // 성공한 키는 화면에 남기지 않는다
          const model = result.data.modelId ? ` · ${result.data.modelId}` : '';
          showModelConnectionResult(
            box, `${providerLabel}${model} 연결이 완료됐어요. 지금 사용할 모델로 적용됐어요.`, 'success',
          );
        } else {
          showModelConnectionResult(
            box, endpointError(result, '연결하지 못했어요. 키와 제공자를 확인해 주세요.'), 'error',
          );
        }
      } finally {
        setModelConnectBusy(box, false, '#mcConnect', '연결 중…', 'API 키로 연결');
        refreshApiConnectState();
        await refreshModelConnect();
      }
    };
    box.querySelector('#mcChatgpt').onclick = async () => {
      setModelConnectBusy(box, true, '#mcChatgpt', '연결 중…', 'ChatGPT 계정으로 연결');
      showModelConnectionResult(box, 'ChatGPT 계정 연결 작업 중…', 'working');
      try {
        const login = await endpointJson('/model/chatgpt/login', { method: 'POST' });
        if (!login.ok || !login.data?.authorizeUrl) {
          showModelConnectionResult(
            box, endpointError(login, 'ChatGPT 계정 연결을 시작하지 못했어요.'), 'error',
          ); return;
        }
        showModelConnectionResult(box, '브라우저에서 ChatGPT 연결을 승인해 주세요.', 'working');
        window.open(login.data.authorizeUrl, '_blank', 'noopener'); // 로그인은 사용자가 직접 한다
        const done = await endpointJson('/model/chatgpt/await', { method: 'POST' });
        showModelConnectionResult(box, done.ok
          ? 'ChatGPT 계정 연결이 완료됐어요. 지금 사용할 모델로 적용됐어요.'
          : endpointError(done, 'ChatGPT 계정 연결을 완료하지 못했어요.'), done.ok ? 'success' : 'error');
      } finally {
        setModelConnectBusy(box, false, '#mcChatgpt', '연결 중…', 'ChatGPT 계정으로 연결');
        refreshApiConnectState();
        await refreshModelConnect();
      }
    };
    box.querySelector('#mcDisconnect').onclick = async () => {
      const result = await endpointJson('/model/disconnect', { method: 'POST' });
      showModelConnectionResult(box, result.ok
        ? '연결을 해제했어요.' : endpointError(result, '연결을 해제하지 못했어요.'),
      result.ok ? 'success' : 'error');
      await refreshModelConnect();
    };
  }
  if (target && box.parentNode !== target) target.appendChild(box); // 설정 허브로 이동(한 곳 관리)
  const providerResult = await endpointJson('/model/providers');
  const select = box.querySelector('#mcProvider');
  const previouslySelected = select.value;
  select.replaceChildren();
  const listed = Array.isArray(providerResult.data?.providers) ? providerResult.data.providers : [];
  const oauthList = [providerResult.data?.oauth].flat().filter(Boolean);
  const oauthAvailable = [...listed, ...oauthList].some((provider) => {
    const id = typeof provider === 'string' ? provider : provider?.id ?? provider?.provider;
    return id === 'chatgpt_oauth' || id === 'chatgpt' || provider?.kind === 'oauth';
  }) || providerResult.data?.chatgptOAuth === true;
  const apiProviders = listed.filter((provider) => {
    const id = provider?.id ?? provider?.provider;
    return id && id !== 'chatgpt_oauth' && provider?.kind !== 'oauth';
  });
  for (const provider of apiProviders) {
    const option = document.createElement('option');
    option.value = provider.id ?? provider.provider;
    option.textContent = provider.label ?? option.value;
    option.dataset.defaultModel = provider.defaultModel ?? '';
    select.appendChild(option);
  }
  if ([...select.options].some((option) => option.value === previouslySelected)) {
    select.value = previouslySelected;
  }
  const refreshModelPlaceholder = () => {
    const defaultModel = select.selectedOptions[0]?.dataset.defaultModel;
    box.querySelector('#mcModel').placeholder = defaultModel ? `모델 (기본: ${defaultModel})` : '모델(비우면 기본)';
  };
  select.disabled = !providerResult.ok || !apiProviders.length;
  const refreshApiConnectState = () => {
    box.querySelector('#mcConnect').disabled = select.disabled || !box.querySelector('#mcKey').value.trim();
  };
  box.querySelector('#mcKey').oninput = refreshApiConnectState;
  select.onchange = () => { refreshModelPlaceholder(); refreshApiConnectState(); };
  refreshModelPlaceholder();
  refreshApiConnectState();
  box.querySelector('#mcChatgpt').hidden = !oauthAvailable;
  if (!providerResult.ok) box.querySelector('#mcResult').textContent = endpointError(providerResult, '연결 방법을 불러오지 못했어요.');
  await refreshModelConnect();
}

function showModelConnectionResult(box, message, state = '') {
  const result = box.querySelector('#mcResult');
  result.textContent = message;
  result.dataset.state = state;
}

function setModelConnectBusy(box, busy, buttonSelector, busyLabel, idleLabel) {
  box.setAttribute('aria-busy', busy ? 'true' : 'false');
  box.dataset.busy = busy ? 'true' : '';
  for (const control of box.querySelectorAll(
    '#mcProvider, #mcKey, #mcModel, #mcConnect, #mcDisconnect, #mcChatgpt, #mcList input, #mcList button',
  )) control.disabled = busy;
  const button = box.querySelector(buttonSelector);
  if (button) button.textContent = busy ? busyLabel : idleLabel;
}

// 보관 중인 연결 목록(P-ONB-1). 라디오=기본으로 쓸 모델, 각 항목에 해제. 여러 개일 때만 보인다.
async function renderConnectionList() {
  const box = document.getElementById('mcList');
  if (!box) return;
  const result = await endpointJson('/model/connections');
  if (!result.ok) {
    box.textContent = endpointError(result, '저장된 모델 연결을 불러오지 못했어요.');
    return;
  }
  const list = result.data?.connections ?? [];
  if (list.length < 2) { box.innerHTML = ''; return; } // 하나뿐이면 상태 줄로 충분(안티 대시보드)
  box.innerHTML = '<div style="opacity:.7; font-size:11px; margin-bottom:2px;">사용할 모델 선택</div>';
  const active = list.find((connection) => connection.active) ?? null;
  for (const c of list) {
    const row = document.createElement('div');
    row.className = `connection-row${c.active ? ' is-active' : ''}`;
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'mcActive'; radio.value = c.id; radio.checked = !!c.active;
    radio.id = `mc-choice-${c.id.replace(/[^a-zA-Z0-9_-]/gu, '-')}`;
    const label = document.createElement('label'); label.htmlFor = radio.id;
    label.className = 'connection-label';
    label.textContent = `${c.label ?? c.provider ?? '모델 연결'}${c.modelId ? ` · ${c.modelId}` : ''}${c.keyMasked ? ` · ${c.keyMasked}` : ''}${c.unofficial ? ' · 공식 지원 아님' : ''}`;
    const current = document.createElement('span'); current.className = 'connection-current';
    current.textContent = c.active ? '현재 사용 중' : '';
    const del = document.createElement('button');
    del.textContent = '해제'; del.className = 'connection-button';
    del.onclick = async () => {
      const result = await endpointJson('/model/connections/remove', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id }),
      });
      if (!result.ok) document.getElementById('mcResult').textContent = endpointError(result, '연결을 해제하지 못했어요.');
      await refreshModelConnect();
    };
    row.append(radio, label, current, del);
    box.appendChild(row);
  }
  const applyArea = document.createElement('div'); applyArea.className = 'connection-apply';
  const hint = document.createElement('span'); hint.className = 'connection-selection-hint';
  const apply = document.createElement('button'); apply.id = 'mcApply';
  apply.className = 'connection-button primary'; apply.textContent = '선택한 모델 적용';
  const updateSelection = () => {
    const selected = list.find((item) => item.id === box.querySelector('input[name="mcActive"]:checked')?.value);
    const changed = Boolean(selected && selected.id !== active?.id);
    apply.disabled = !changed;
    hint.textContent = changed
      ? `${selected.label ?? selected.provider} · ${selected.modelId} 선택됨 — 적용 전`
      : `${active?.label ?? active?.provider} · ${active?.modelId} 사용 중`;
  };
  for (const radio of box.querySelectorAll('input[name="mcActive"]')) radio.onchange = updateSelection;
  apply.onclick = async () => {
    const selected = list.find((item) => item.id === box.querySelector('input[name="mcActive"]:checked')?.value);
    if (!selected || selected.id === active?.id) return;
    box.setAttribute('aria-busy', 'true');
    for (const control of box.querySelectorAll('input, button')) control.disabled = true;
    apply.textContent = '적용 중…';
    showModelConnectionResult(document.getElementById('modelConnect'), '모델을 변경하는 중…', 'working');
    modelinfo.textContent = '모델 변경 중…';
    const changed = await endpointJson('/model/connections/activate', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: selected.id }),
    });
    if (!changed.ok) {
      showModelConnectionResult(
        document.getElementById('modelConnect'), endpointError(changed, '모델을 바꾸지 못했어요.'), 'error',
      );
      box.removeAttribute('aria-busy');
      await refreshInitialModelStatus();
      await renderConnectionList();
      return;
    }
    showModelConnectionResult(
      document.getElementById('modelConnect'),
      `${selected.label ?? selected.provider} · ${selected.modelId} 모델로 변경했어요.`, 'success',
    );
    box.removeAttribute('aria-busy');
    await refreshModelConnect();
  };
  applyArea.append(hint, apply); box.appendChild(applyArea); updateSelection();
  const continuity = document.createElement('label'); continuity.className = 'settings-item';
  const continuityToggle = document.createElement('input'); continuityToggle.type = 'checkbox';
  continuityToggle.checked = result.data?.continuityPolicy?.enabled === true;
  const continuityText = document.createElement('span');
  continuityText.textContent = '주 모델 연결이 끊기면 다른 연결로 같은 작업 이어가기';
  continuity.append(continuityToggle, continuityText);
  const continuityHint = document.createElement('div'); continuityHint.className = 'settings-item-desc';
  continuityHint.textContent = '전송·인증·필수 능력 장애에만 사용해요. 답 품질 때문에 모델을 자동 순회하지 않아요.';
  continuityToggle.onchange = async () => {
    continuityToggle.disabled = true;
    const saved = await endpointJson('/model/continuity', { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify({
        enabled: continuityToggle.checked,
        allowedConnectionIds: list.map((item) => item.id),
      }) });
    if (!saved.ok) {
      continuityToggle.checked = !continuityToggle.checked;
      showModelConnectionResult(document.getElementById('modelConnect'),
        endpointError(saved, '모델 이어가기 설정을 바꾸지 못했어요.'), 'error');
    }
    continuityToggle.disabled = false;
  };
  box.append(continuity, continuityHint);
}

async function refreshModelConnect() {
  const result = await endpointJson('/model/connection');
  const st = result.ok ? result.data : null;
  await renderConnectionList();
  refreshActiveModelSurface(st);
  const el = document.getElementById('mcStatus');
  const capabilities = document.getElementById('mcCapabilities');
  if (!el) return;
  document.getElementById('mcDisconnect').disabled = !result.ok || !st?.connected;
  if (!result.ok) { el.textContent = endpointError(result, '모델 연결 상태를 불러오지 못했어요.'); if (capabilities) capabilities.textContent = ''; return; }
  if (!st?.connected) { el.textContent = '연결된 모델 없음 — 모델 하나를 연결하면 대화를 시작할 수 있어요'; if (capabilities) capabilities.textContent = ''; return; }
  const src = st.source
    ? ({ user: '화면에서 연결', saved: '저장된 연결', env: '환경 설정', chatgpt_oauth: 'ChatGPT 계정' }[st.source] ?? st.source)
    : null;
  el.textContent = `현재 사용 중 · ${MODEL_PROVIDER_LABEL[st.provider] ?? st.provider} · ${st.modelId}${st.keyMasked ? ` · ${st.keyMasked}` : ''}${src ? ` (${src})` : ''}`
    + (st.unofficial ? ' · 공식 지원 아님' : '');
  if (capabilities) {
    const facts = st.capabilityManifest?.capabilities ?? {};
    const stateText = { supported: '가능', unsupported: '지원 안 함', unknown: '확인 필요' };
    capabilities.textContent = [
      `도구 사용 ${stateText[facts.tools] ?? '확인 필요'}`,
      `이미지 입력 ${stateText[facts.visionInput] ?? '확인 필요'}`,
      `스트리밍 ${stateText[facts.streaming] ?? '확인 필요'}`,
    ].join(' · ');
  }
}

function refreshActiveModelSurface(st) {
  if (!st?.connected) {
    modelinfo.textContent = '연결된 모델 없음';
    chip.textContent = '연결 필요';
    chip.classList.add('warn');
    return;
  }
  const provider = MODEL_PROVIDER_LABEL[st.provider] ?? st.provider;
  modelinfo.textContent = `${provider} · ${st.modelId} · 사용 중`;
  chip.textContent = '연결됨';
  chip.classList.remove('warn');
}

// 첫 모델 응답을 기다리는 동안에도 저장된 연결 사실은 바로 보인다. 정적 stub 를 "준비됨"으로
// 그리면 실제 OAuth 모델이 연결된 제품이 몇 초 동안 데모처럼 보인다. 여기서는 연결만 말하고,
// usable/health 기반의 "준비됨" 판정은 기존 renderSelfState 가 첫 실제 턴 뒤에 맡는다.
async function refreshInitialModelStatus() {
  const st = await (await fetch('/model/connection')).json().catch(() => null);
  refreshActiveModelSurface(st);
}

// 전체 대화 검색. 검색은 기억 반영과 다른 읽기 행동이다. 결과를 찾았다는 이유로 현재 모델 Context나
// Memory를 바꾸지 않고, 사용자가 누르면 원본 대화만 연다.
const searchPanel = document.getElementById('search');
const qInput = document.getElementById('q');
const qResults = document.getElementById('qresults');
const sbText = document.querySelector('#searchbtn .sb-t');
function toggleSearch(force) {
  const open = force ?? (searchPanel.style.display !== 'block');
  if (open) clearSessionSelection();
  searchPanel.style.display = open ? 'block' : 'none';
  if (sbText) sbText.textContent = open ? ' 닫기' : ' 대화 찾기';
  document.getElementById('searchbtn').title = open ? '닫기' : '지난 대화 찾기';
  if (open) qInput.focus();
}
document.getElementById('searchbtn').onclick = () => toggleSearch();
document.getElementById('brandSearch').onclick = () => { document.body.classList.remove('nav-open'); toggleSearch(true); };
async function doSearch() {
  const query = qInput.value.trim();
  if (!query) return;
  qResults.textContent = '찾는 중…';
  try {
    const response = await fetch('/search', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query }) });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error ?? '검색에 실패했어요.');
    renderQResults(result.results || []);
  } catch { qResults.textContent = '검색에 실패했어요.'; }
}
document.getElementById('qgo').onclick = doSearch;
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

function renderQResults(results) {
  qResults.replaceChildren();
  if (!results.length) { qResults.textContent = '찾은 대화가 없어요. 다른 말로 다시 찾아볼까요?'; return; }
  for (const r of results) {
    const card = el('qhit');
    card.setAttribute('role', 'button'); card.tabIndex = 0;
    const role = r.role === 'user' ? '내 말' : r.role === 'assistant' ? 'T5' : '대화';
    card.appendChild(el('qh-tag', `${r.archived ? '보관함 · ' : ''}${role}`));
    card.appendChild(el('qh-src', r.title || '새 대화'));
    card.appendChild(el('qh-body', r.snippet || ''));
    const 이동 = async () => {
      if (!r.sessionId) return;
      const ok = await fetch('/sessions/' + encodeURIComponent(r.sessionId)).then((x) => x.ok).catch(() => false);
      if (!ok) { toast('그 대화를 지금 열 수 없어요.'); return; }
      await selectSession(r.sessionId);
      toggleSearch(false);
    };
    card.title = '이 대화로 이동'; card.onclick = 이동;
    card.onkeydown = (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); 이동(); } };
    qResults.appendChild(card);
  }
}

// ── 도구함 (2.0-A) — 실제 /toolbox 상태만 보여준다(없는 도구 안 만듦, 죽은 버튼 없음). ──
const tbov = document.getElementById('tbov');
const tbBody = document.getElementById('tb-body');
const tbSearch = document.getElementById('tb-search');
let tbTools = [];
const mk = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

async function openToolbox(focusId) {
  tbov.classList.add('open');
  document.body.classList.remove('nav-open');
  tbBody.replaceChildren(mk('div', 'tb-empty', '불러오는 중…'));
  try {
    const r = await (await fetch('/toolbox')).json();
    tbTools = r.tools || [];
    renderToolbox('', focusId);
    await renderTelegramOwner();
    if (!focusId) tbSearch.focus();
  } catch { tbBody.replaceChildren(mk('div', 'tb-empty', '도구 목록을 불러오지 못했어요.')); }
}
function closeToolbox() { tbov.classList.remove('open'); }

// ╔══ 조각 E 투영 시작 ═══════════════════════════════════════════════════════════
// **자동화 목록 투영 한 벌**(기획서 §2 조각 E · §5 · §6-2). 화면이 상태를 제 손으로 다시
// 계산하면 서버와 화면이 두 진실이 된다 — 판단은 전부 여기 모은다.
//
// ⚠️ **왜 별도 모듈 파일이 아닌가.** `markdown.js`·`approval-state.js` 는 각각 서버에
// 손으로 쓴 라우트가 하나씩 있다(`server.js:2529-2540`). 번들러가 없어 **화면 모듈 하나 =
// 서버 라우트 한 줄**이다. 조각 E 의 규율은 **서버 수정 0** 이므로 새 파일을 만들지 않고
// 여기 둔다. (기획서 §5 의 *"조각 E 가 첫 소비자이므로 한 벌로 모으고 F 가 그것을 껍데기에
// 넣는다"* 는 살아 있다 — **F 가 서버를 만질 때** 이 블록을 파일로 들어내면 된다.)
// 검사는 이 블록을 **여기서 그대로 떼어다 돌린다**(`test/automation-door.test.js`) —
// 두 벌로 살지 않게.
//
// ── 정의역 — 쓸 수 있는 사실 (서버 수정 0) ───────────────────────────────────
// `GET /automation`(`server.js:2897-2932`)이 실제로 싣는 것만 쓴다:
//   jobs[]  id · name · state · trigger · nextRunAt · authorityEnvelope …
//   runs[]  status · deliveryStatus · finishedAt (+실패·미상일 때 userSafeSummary·nextSafeAction)
//   candidates[]  아직 승인 안 된 후보
// **여기 없는 것은 지어내지 않는다.** 특히 `tickIntervalMs`(몇 초마다 확인하나)는 이 GET 에
// 없다 — 켜는 손 반환값(`notRunning`)에만 있다. 그래서 「N초마다」라고 적지 않는다.
// 반면 `requiresAppRunning` 은 값이 아니라 **구조 사실**이다: 커널이 무조건 true 로 낸다
// (`automation-contracts.js:349-351` — `schedulerKind:'in_process_interval'`, 데몬 없음).
// 그래서 목록 머리에 한 줄로 먼저 말한다.
//
// ── 가져온 규칙 (기획서 §6-2 E 행) ──────────────────────────────────────────
//   한 줄에 상태·다음 실행·마지막 결과·배달 실패를 다 적는다   헤르메스 cron.py:145-190
//   「안 뜰 상황」을 목록 조회 시점에 **먼저** 경고한다          같은 파일 :64-95
//   0개일 때 빈 목록 대신 **다음 행동**을 준다                  같은 파일 :105-108
//   삭제와 멈춤을 분리한다                                     cli-commands.md:563-572
//   해당 없는 진단은 통째로 숨긴다                              cron.py:223-243
//   다가올 실행과 지난 실행을 같은 화면에                        claude.com/blog/cowork-web-mobile
const AE_STATE_LABEL = {
  proposed: '아직 안 켜졌어요', approved: '켜지기 직전이에요', scheduled: '켜져 있어요',
  paused: '멈춰 뒀어요', needs_review: '확인이 필요해요',
  cancelled: '껐어요', expired: '기한이 끝났어요',
};
/** 지난 것 — 되돌릴 전이가 하나도 없는 상태(`TRANSITIONS.automationJob` 의 막다른 칸). */
const AE_ENDED = new Set(['cancelled', 'expired']);
const AE_RUN_LABEL = {
  succeeded: '성공', failed: '실패', cancelled: '취소됨', unknown: '확인 못 함',
  skipped: '건너뜀', queued: '대기 중', claimed: '시작하는 중', running: '도는 중', waiting_approval: '승인 대기',
};

/**
 * **버튼은 실제로 무언가를 바꿀 때만 낸다.**
 *
 * 서버 정의역(`server.js:2992-3020`)을 그대로 옮긴 것이 아니라 **한 겹 더 좁혔다.**
 * 서버는 이미 paused 인 job 에 pause 를 보내도 200 을 준다(무변화 통과). 200 은 「살아
 * 있다」는 증거가 아니다 — 눌러도 아무 일이 없으면 그것이 죽은 버튼이다(715·990 원칙).
 *
 * `retry` 를 안 내는 이유도 같다. 서버의 retry 는 paused/approved → scheduled 로만 실제
 * 전이를 만들고(= resume 과 같은 일), scheduled/needs_review 에는 **200 무변화**다.
 * 그러니 「다시 시도」 버튼은 이름만 다른 resume 이거나 죽은 버튼이다 — 둘 다 안 만든다.
 * (지금 강제로 한 번 돌릴 길은 T5 에 없다. `POST /automation/tick` 은 런타임 토큰이
 *  있어야 하고 서버 주석이 *"사용자 버튼이 아니다"* 라고 못박았다.)
 */
function automationJobActions(job) {
  const state = job?.state;
  if (state === 'scheduled') return [
    { id: 'run', label: '실행', path: '/automation/run' },
    { id: 'pause', label: '끄기', path: '/automation/pause' },
  ];
  if (state === 'paused' || state === 'approved') {
    return [
      { id: 'run', label: '실행', path: '/automation/run' },
      { id: 'resume', label: '켜기', path: '/automation/resume' },
      { id: 'archive', label: '보관', path: '/automation/archive' },
      { id: 'delete', label: '삭제', path: '/automation/delete' },
    ];
  }
  if (state === 'needs_review') return [
    { id: 'run', label: '실행', path: '/automation/run' },
    { id: 'archive', label: '보관', path: '/automation/archive' },
    { id: 'delete', label: '삭제', path: '/automation/delete' },
  ];
  if (state === 'cancelled' || state === 'expired') return [
    { id: 'archive', label: '보관', path: '/automation/archive' },
    { id: 'delete', label: '삭제', path: '/automation/delete' },
  ];
  return [];
}

/** 버튼이 없을 때 **그 자리에 놓는 말**. 아무것도 없는 칸을 남기지 않는다. */
function aeNoActionReason(state) {
  return {
    proposed: '아직 켜지지 않았어요 — 대화에서 무엇을·언제·어디로 보낼지 확인해야 켜져요.',
    needs_review: '확인이 필요해요 — T5 가 스스로 멈춰 세웠어요. 대화에서 이 자동화를 다시 확인해 주세요.',
    cancelled: '껐어요. 기록은 남지만 다시 돌지 않아요.',
    expired: '기한이 끝났어요. 다시 쓰려면 대화에서 새로 켜 주세요.',
  }[state] ?? null;
}

const ae2 = (n) => String(n).padStart(2, '0');
function aeWhen(ms) {
  if (!Number.isFinite(ms) || ms <= 0) return null;
  const d = new Date(ms);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${ae2(d.getHours())}:${ae2(d.getMinutes())}`;
}
function aeDay(ms) {
  if (!Number.isFinite(ms) || ms <= 0) return null;
  const d = new Date(ms);
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}

/**
 * **다음 실행** — 도는 상태에서만 시각을 적는다.
 *
 * 멈춘 job 에도 `nextRunAt` 은 옛 값이 남아 있다. 그것을 그대로 「다음 실행 8월 15일」로
 * 적으면 **안 도는 것을 돈다고 말하는 것**이다. 상태가 그 값의 의미를 정한다.
 */
function aeNextRun(job) {
  if (job.state !== 'scheduled') {
    if (job.state === 'paused') return '다음 실행 없음(멈춤)';
    if (AE_ENDED.has(job.state)) return null;
    return '다음 실행 없음';
  }
  const 시각 = aeWhen(job.nextRunAt);
  return 시각 ? `다음 실행 ${시각}` : '다음 실행 시각 미정';
}

/** 이 job 의 **가장 최근 실행** 하나. 지난 실행과 다가올 실행을 같은 줄에 둔다. */
function aeLastRun(job, runs) {
  return runs
    .filter((run) => run.jobId === job.id)
    .slice()
    .sort((a, b) => (b.finishedAt ?? b.scheduledFor ?? 0) - (a.finishedAt ?? a.scheduledFor ?? 0))[0] ?? null;
}

/** **안 도는 조건 — 페이로드에 실린 것만.** 해당 없는 칸은 통째로 뺀다(cron.py:223-243). */
function aeNotRunning(job) {
  const 줄 = [];
  const misfire = job?.trigger?.misfirePolicy ?? null;
  if (misfire === 'catch_up_once') 줄.push('T5 가 꺼져 있어 놓친 회차는 다음에 켤 때 따라잡아요.');
  else if (misfire === 'skip') 줄.push('T5 가 꺼져 있어 놓친 회차는 따라잡지 않고 버려요.');
  const 만료 = job?.authorityEnvelope?.expiresAt;
  if (Number.isFinite(만료) && aeDay(만료)) 줄.push(`권한은 ${aeDay(만료)}까지예요 — 그 뒤에는 안 돌아요.`);
  const 최대 = job?.authorityEnvelope?.maxRuns;
  if (Number.isFinite(최대)) 줄.push(`최대 ${최대}회까지만 돌아요.`);
  return 줄;
}

function aeSummaryLine(job, run) {
  const 조각 = [job.name || job.id, AE_STATE_LABEL[job.state] ?? job.state];
  const 다음 = aeNextRun(job);
  if (다음) 조각.push(다음);
  if (run) {
    const 때 = aeWhen(run.finishedAt ?? run.scheduledFor);
    조각.push(`마지막 ${AE_RUN_LABEL[run.status] ?? run.status}${때 ? ` · ${때}` : ''}`);
    // 돌긴 돌았는데 **못 전한 것**은 성공과 전혀 다른 사건이다 — 한 줄에서 갈라 보인다.
    if (run.deliveryStatus === 'failed') 조각.push('배달 실패');
  } else if (!AE_ENDED.has(job.state)) {
    조각.push('아직 한 번도 안 돌았어요');
  }
  return 조각.join(' · ');
}

function aeRow(job, runs) {
  const run = aeLastRun(job, runs);
  const actions = automationJobActions(job);
  return {
    id: job.id,
    name: job.name || job.id,
    state: job.state,
    stateLabel: AE_STATE_LABEL[job.state] ?? job.state,
    tone: job.state === 'scheduled' ? 'on' : 'off',
    summaryLine: aeSummaryLine(job, run),
    notRunning: AE_ENDED.has(job.state) ? [] : aeNotRunning(job),
    actions,
    noActionReason: actions.length ? null : aeNoActionReason(job.state),
    // 멈춤이 삭제가 아니라는 것을 **그 자리에서** 말한다(cli-commands.md:563-572).
    keptHint: job.state === 'paused' ? '멈춰도 지워지지 않아요 — 다시 켜면 그대로 이어져요.' : null,
    // 실패·미상일 때 서버가 이미 사람 말로 준다. 화면이 다시 지어내지 않는다.
    trouble: run && (run.userSafeSummary || run.nextSafeAction)
      ? { summary: run.userSafeSummary ?? null, nextAction: run.nextSafeAction ?? null } : null,
  };
}

/** 0개일 때 **다음 행동**. 빈 목록은 답이 아니다(cron.py:105-108). */
function aeGuide(candidates) {
  if (candidates.length) {
    return {
      title: `켜기를 기다리는 후보가 ${candidates.length}개 있어요`,
      steps: [
        '대화 화면의 자동화 카드에서 무엇을·언제·어디로 보낼지 확인하면 켜져요.',
        '확인 전에는 아무것도 돌지 않아요 — 후보는 영향이 없어요.',
      ],
    };
  }
  return {
    title: '아직 켜 둔 자동화가 없어요',
    steps: [
      '대화에서 「매일 아침 9시에 …해 줘」처럼 시점을 넣어 말해 보세요.',
      '예약되면 이 화면에서 다음 실행과 지난 결과를 함께 볼 수 있어요.',
      '켜진 뒤에는 여기서 한 번 실행하거나, 멈추고, 다시 켜고, 취소할 수 있어요.',
    ],
  };
}

/**
 * **목록을 못 불러온 것도 「안 뜰 상황」이다**(§6-2 — 고칠 길을 그 자리에 붙인다).
 *
 * 라이브에서 밟았다(2026-08-12): 신분 쿠키가 식으면 `/automation` 이 403 을 준다. 그때
 * 그냥 터지면 설정 허브 바깥 catch 가 **패널 전체**를 갈아 버리고, 남는 말은 「잠시 후 다시」
 * 뿐이다. 그건 다음 행동이 아니다 — 실제로 듣는 약은 **새로 고침**이다(신분을 다시 받는다).
 */
function automationLoadFailure() {
  return {
    title: '자동화 목록을 지금 불러오지 못했어요',
    steps: [
      '화면을 새로 고치면 다시 보여요 — 오래 열어 둔 창은 신분이 식을 수 있어요.',
      '켜 둔 자동화는 그대로예요. 목록이 안 보이는 것과 안 도는 것은 달라요.',
    ],
  };
}

/**
 * `GET /automation` 응답 한 벌 → 화면이 그대로 그릴 수 있는 모양.
 * `now` 는 후보 만료 판정에만 쓴다(서버도 같은 잣대를 쓴다 — `server.js:2926`).
 */
function projectAutomationDoor(payload = {}, { now = Date.now() } = {}) {
  const jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
  const runs = Array.isArray(payload.runs) ? payload.runs : [];
  const raw = Array.isArray(payload.candidates) ? payload.candidates : [];

  const live = jobs.filter((job) => !AE_ENDED.has(job.state)).map((job) => aeRow(job, runs));
  const ended = jobs.filter((job) => AE_ENDED.has(job.state)).map((job) => aeRow(job, runs));
  const candidates = raw
    .filter((c) => !Number.isFinite(c.expiresAt) || c.expiresAt >= now)
    .map((c) => ({
      id: c.candidateId ?? c.candidateRef ?? null,
      statement: c.statement ?? '',
      expiresAt: Number.isFinite(c.expiresAt) ? c.expiresAt : null,
    }));

  // ★ 「안 뜰 상황」을 목록 조회 시점에 **먼저** 말한다. 다만 도는 예약이 하나도 없으면
  //   해당 없는 진단이므로 통째로 숨긴다(cron.py:223-243).
  return {
    appRunning: {
      applies: jobs.some((job) => job.state === 'scheduled'),
      text: 'T5가 실행 중일 때 예약이 돌아요. 꺼져 있던 동안의 회차는 건너뛰고, 다시 켜면 다음 회차부터 이어져요.',
    },
    jobs: live,
    ended,
    candidates,
    empty: live.length === 0,
    guide: live.length === 0 ? aeGuide(candidates) : null,
  };
}
// ╚══ 조각 E 투영 끝 ═══════════════════════════════════════════════════════════

function messengerFieldName(field) { return field?.name ?? field?.id ?? ''; }
function renderMessengerFields(box, provider) {
  const host = box.querySelector('#msgFields');
  host.replaceChildren();
  for (const field of provider?.fields ?? []) {
    const name = messengerFieldName(field);
    if (!name || ['token', 'botToken', 'bot_token'].includes(name)) continue;
    const input = document.createElement(field.type === 'select' ? 'select' : 'input');
    input.dataset.channelField = name;
    if (input.tagName === 'SELECT') {
      for (const choice of field.options ?? []) {
        const option = document.createElement('option');
        option.value = typeof choice === 'string' ? choice : choice.value;
        option.textContent = typeof choice === 'string' ? choice : (choice.label ?? choice.value);
        input.appendChild(option);
      }
      input.setAttribute('aria-label', field.label ?? name);
    } else {
      input.type = field.type === 'password' || field.secret ? 'password' : (field.type ?? 'text');
      input.placeholder = field.placeholder ?? field.label ?? name;
      input.autocomplete = 'off';
      input.setAttribute('aria-label', field.label ?? name);
    }
    input.required = field.required !== false;
    host.appendChild(input);
  }
  box.querySelector('#msgToken').placeholder = provider?.tokenPlaceholder ?? '봇 토큰';
}

async function refreshMessengerStatus(box, target) {
  const result = await endpointJson('/channels');
  const selected = box.querySelector('#msgProvider').value;
  const channels = Array.isArray(result.data?.channels) ? result.data.channels : [];
  const current = channels.find((channel) => (channel.id ?? channel.provider) === selected);
  box.querySelector('#msgStatus').textContent = result.ok
    ? (current?.userSafe ?? (current?.connected ? '연결됨' : '연결되지 않음'))
    : endpointError(result, '메신저 상태를 불러오지 못했어요.');
  box.querySelector('#msgDisconnectBtn').disabled = !current?.connected;
  box.querySelector('#msgRestartBtn').hidden = !current?.needsAttention;
  const old = document.getElementById('telegramOwner');
  if (old) old.remove();
  if (result.ok && current?.ready && selected === 'telegram') await renderTelegramOwner(target, false);
  return current ?? null;
}

async function watchMessengerReady(box, target) {
  for (let attempt = 0; attempt < 60 && setov.classList.contains('open'); attempt += 1) {
    const current = await refreshMessengerStatus(box, target);
    if (!current?.connected || current?.ready || current?.needsAttention) return;
    await new Promise((resolve) => setTimeout(resolve, 1500));
  }
}

async function renderMessengerConnect(target) {
  const providerResult = await endpointJson('/channels/providers');
  const providers = Array.isArray(providerResult.data?.providers) ? providerResult.data.providers : [];
  const box = mk('div', 'tb-card'); box.id = 'msgConnect';
  box.innerHTML = `
    <div class="tb-name">메신저 연결</div>
    <div class="tb-hint">쓰는 메신저를 고르고 봇 토큰을 연결하면 같은 T5와 대화할 수 있어요.</div>
    <div id="msgStatus" class="tb-hint"></div>
    <div class="connection-fields">
      <select id="msgProvider" aria-label="메신저"></select>
      <input id="msgToken" type="password" placeholder="봇 토큰" aria-label="봇 토큰" autocomplete="off">
      <span id="msgFields" class="connection-fields" style="margin:0;"></span>
    </div>
    <div class="connection-actions">
      <button id="msgConnectBtn" class="connection-button primary">연결</button>
      <button id="msgRestartBtn" class="connection-button" hidden>다시 시작</button>
      <button id="msgDisconnectBtn" class="connection-button">해제</button>
    </div>
    <div id="msgResult" class="tb-hint"></div>`;
  target.appendChild(box);
  const select = box.querySelector('#msgProvider');
  for (const provider of providers) {
    const option = document.createElement('option');
    option.value = provider.id ?? provider.provider;
    option.textContent = provider.label ?? option.value;
    select.appendChild(option);
  }
  select.disabled = !providerResult.ok || !providers.length;
  const refreshMessengerConnectState = () => {
    const requiredMissing = [...box.querySelectorAll('[data-channel-field][required]')].some((input) => !input.value.trim());
    box.querySelector('#msgConnectBtn').disabled = select.disabled || !box.querySelector('#msgToken').value.trim() || requiredMissing;
  };
  box.querySelector('#msgToken').oninput = refreshMessengerConnectState;
  box.querySelector('#msgFields').addEventListener('input', refreshMessengerConnectState);
  box.querySelector('#msgFields').addEventListener('change', refreshMessengerConnectState);
  refreshMessengerConnectState();
  if (!providerResult.ok) box.querySelector('#msgResult').textContent = endpointError(providerResult, '연결할 메신저를 불러오지 못했어요.');
  select.onchange = async () => {
    const provider = providers.find((candidate) => (candidate.id ?? candidate.provider) === select.value);
    renderMessengerFields(box, provider);
    refreshMessengerConnectState();
    const current = await refreshMessengerStatus(box, target);
    if (current?.connected && !current?.ready && !current?.needsAttention) {
      watchMessengerReady(box, target).catch(() => {});
    }
  };
  box.querySelector('#msgConnectBtn').onclick = async () => {
    const fields = {};
    for (const input of box.querySelectorAll('[data-channel-field]')) fields[input.dataset.channelField] = input.value;
    const payload = { provider: select.value, token: box.querySelector('#msgToken').value, ...fields, fields };
    box.querySelector('#msgResult').textContent = '확인 중…';
    const result = await endpointJson('/channels/connect', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
    });
    box.querySelector('#msgResult').textContent = result.ok
      ? (result.data?.userSafeSummary ?? '연결됐어요.')
      : endpointError(result, '연결하지 못했어요. 봇 토큰을 확인해 주세요.');
    if (result.ok) {
      box.querySelector('#msgToken').value = '';
      for (const input of box.querySelectorAll('[data-channel-field]')) if (input.type === 'password') input.value = '';
    }
    refreshMessengerConnectState();
    await refreshMessengerStatus(box, target);
  };
  box.querySelector('#msgDisconnectBtn').onclick = async () => {
    const result = await endpointJson('/channels/disconnect', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ provider: select.value }),
    });
    box.querySelector('#msgResult').textContent = result.ok
      ? (result.data?.userSafeSummary ?? '연결을 해제했어요.')
      : endpointError(result, '연결을 해제하지 못했어요.');
    await refreshMessengerStatus(box, target);
  };
  box.querySelector('#msgRestartBtn').onclick = async () => {
    const restart = box.querySelector('#msgRestartBtn');
    restart.disabled = true;
    box.querySelector('#msgResult').textContent = '메시지 받기를 다시 시작하고 있어요…';
    const result = await endpointJson('/channels/restart', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ provider: select.value }),
    });
    box.querySelector('#msgResult').textContent = result.ok
      ? (result.data?.userSafeSummary ?? '메시지 받기를 다시 시작했어요.')
      : endpointError(result, '메시지 받기를 다시 시작하지 못했어요.');
    restart.disabled = false;
    const current = await refreshMessengerStatus(box, target);
    if (current?.connected && !current?.ready && !current?.needsAttention) {
      watchMessengerReady(box, target).catch(() => {});
    }
  };
  if (providers[0]) renderMessengerFields(box, providers[0]);
  refreshMessengerConnectState();
  const current = await refreshMessengerStatus(box, target);
  if (current?.connected && !current?.ready) watchMessengerReady(box, target).catch(() => {});
}

// ── 설정 허브 (Pre-P-OP-7 UX Closure) ── 새 관리 콘솔이 아니라 **이미 있는 기능의 정리**다.
// 각 영역은 지금 실제로 조회·관리할 수 있는 범위만 보여준다 — 없는 기능을 약속하지 않는다.
const setov = document.getElementById('setov');
const setBody = document.getElementById('set-body');
const setTabs = document.getElementById('set-tabs');
const setTitle = document.getElementById('set-title');
const setBack = document.getElementById('set-back');
const SET_SECTIONS = [
  ['model', '모델'], ['ownership', '내 T5와 자료'], ['messenger', '메신저'], ['tools', '도구와 연결'],
  ['skills', '스킬'], ['automation', '자동화'], ['memory', '기억과 개인정보'], ['looks', '모양'],
  ['about', 'T5에 대하여'],
];
const SETTINGS_PATH = Object.fromEntries(SET_SECTIONS.map(([id]) => [id, id === 'model' ? '/settings' : `/settings/${id}`]));
function settingsSectionFromPath(pathname) {
  if (pathname === '/settings') return 'model';
  const match = pathname.match(/^\/settings\/([a-z0-9-]+)$/u);
  return SET_SECTIONS.some(([id]) => id === match?.[1]) ? match[1] : null;
}
function hideSettingsPage() { setov.classList.remove('open'); setov.setAttribute('aria-hidden', 'true'); }
function closeSettings() {
  hideSettingsPage();
  if (window.location.pathname.startsWith('/settings')) {
    history.pushState({ t5View: 'chat' }, '', '/');
  }
}
async function openSettings(section = 'model', { updateHistory = true } = {}) {
  clearSessionSelection();
  setov.classList.add('open');
  setov.setAttribute('aria-hidden', 'false');
  document.body.classList.remove('nav-open');
  const path = SETTINGS_PATH[section] ?? SETTINGS_PATH.model;
  if (updateHistory && window.location.pathname !== path) {
    history.pushState({ t5View: 'settings', section }, '', path);
  }
  const currentLabel = SET_SECTIONS.find(([id]) => id === section)?.[1] ?? '설정';
  setTitle.textContent = section === 'model' ? '설정' : `설정 › ${currentLabel}`;
  setBack.textContent = section === 'model' ? '← 대화로 돌아가기' : '← 설정으로 돌아가기';
  setBack.onclick = section === 'model' ? closeSettings : () => openSettings('model');
  setTabs.replaceChildren(...SET_SECTIONS.map(([id, label]) => {
    const b = document.createElement('button'); b.className = 'tb-badge'; b.textContent = label;
    b.style.cursor = 'pointer';
    if (id === section) { b.style.borderColor = 'var(--accent)'; b.style.color = 'var(--fg-strong)'; }
    b.onclick = () => openSettings(id);
    return b;
  }));
  setBody.replaceChildren(mk('div', 'tb-empty', '불러오는 중…'));
  try { await SET_RENDER[section](); }
  catch { setBody.replaceChildren(mk('div', 'tb-empty', '이 영역을 지금 불러오지 못했어요. 잠시 후 다시 열어 볼까요?')); }
}

  image.onload = () => fallback.remove(); image.onerror = () => image.remove();

async function renderConnectionDoctor(target, { excludeIds = new Set() } = {}) {
  const card = mk('div', 'tb-card'); card.id = 'connectionDoctor';
  const head = mk('div', 'connection-row');
  head.appendChild(mk('div', 'tb-name connection-label', '연결 상태 확인'));
  const refresh = document.createElement('button'); refresh.className = 'connection-button';
  refresh.textContent = '다시 확인'; head.appendChild(refresh); card.appendChild(head);
  const result = mk('div', 'tb-hint', '현재 연결 상태를 확인하고 있어요…'); card.appendChild(result);
  const stateLabel = {
    connected: '연결됨', ready: '사용 가능', connecting: '연결 중', needs_connection: '연결 필요',
    needs_attention: '확인 필요', unavailable: '지금은 사용 불가',
  };
  const load = async () => {
    refresh.disabled = true; refresh.textContent = '확인 중…';
    const response = await fetch('/connections/doctor').catch(() => null);
    const report = response?.ok ? await response.json().catch(() => null) : null;
    result.replaceChildren();
    if (!report?.connections) result.textContent = '연결 상태를 불러오지 못했어요. 잠시 후 다시 확인해 주세요.';
    else {
      result.appendChild(mk('div', 'tb-hint', report.userSafeSummary ?? '현재 연결 상태를 확인했어요.'));
      for (const connection of report.connections.filter((item) => !excludeIds.has(item.id))) {
        const row = mk('div', `connection-catalog-item connection-${connection.state}`);
        const text = mk('div', 'connection-label');
        text.classList.add('settings-item-main');
        text.appendChild(mk('div', 'settings-item-title', connection.label));
        text.appendChild(mk('div', 'settings-item-desc', connection.userSafeSummary));
        if (connection.actions?.length) {
          const actionRow = mk('div', 'connection-actions');
          const actionStatus = mk('div', 'tb-hint');
          for (const action of connection.actions) {
            const button = document.createElement('button'); button.className = 'connection-button';
            button.textContent = action.label;
            button.onclick = async () => {
              button.disabled = true;
              if (action.kind === 'credentials') {
                actionStatus.replaceChildren();
                const form = mk('div', 'connection-fields'); const inputs = new Map();
                for (const field of connection.credentialRequest?.fields ?? []) {
                  const label = document.createElement('label'); label.textContent = field.label;
                  const input = document.createElement('input'); input.type = field.secret ? 'password' : 'text';
                  input.autocomplete = 'off'; input.maxLength = field.maxLength; label.appendChild(input);
                  inputs.set(field.id, input); form.appendChild(label);
                }
                const connect = document.createElement('button'); connect.className = 'connection-button primary';
                connect.textContent = '확인하고 연결'; form.appendChild(connect); actionStatus.appendChild(form);
                connect.onclick = async () => {
                  connect.disabled = true; const credentials = Object.fromEntries([...inputs].map(([id, input]) => [id, input.value]));
                  const verified = await endpointJson(action.endpoint, { method: 'POST',
                    headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credentials }) });
                  for (const input of inputs.values()) input.value = '';
                  actionStatus.textContent = verified.ok
                    ? (verified.data?.userSafeSummary ?? '계정을 연결했어요.')
                    : endpointError(verified, '연결 정보를 확인하지 못했어요.');
                  if (verified.ok) await load(); else { connect.disabled = false; button.disabled = false; }
                };
                return;
              }
              if (action.kind === 'oauth') {
                const popup = window.open('about:blank', '_blank');
                if (popup) popup.opener = null;
                actionStatus.textContent = '계정 연결을 준비하고 있어요…';
                const started = await endpointJson(action.startEndpoint, { method: 'POST' });
                if (!started.ok || !started.data?.authorizeUrl) {
                  popup?.close(); actionStatus.textContent = endpointError(started, '계정 연결을 시작하지 못했어요.');
                  button.disabled = false; return;
                }
                if (popup) popup.location.href = started.data.authorizeUrl;
                else window.open(started.data.authorizeUrl, '_blank', 'noopener');
                actionStatus.textContent = '열린 화면에서 계정을 선택하고 허용해 주세요…';
                const cancel = document.createElement('button'); cancel.className = 'connection-button';
                cancel.textContent = '연결 취소'; actionRow.appendChild(cancel);
                let userCancelled = false;
                cancel.onclick = async () => {
                  cancel.disabled = true;
                  userCancelled = true;
                  const stopped = await endpointJson(action.startEndpoint.replace(/\/start$/u, '/cancel'), {
                    method: 'POST',
                  });
                  actionStatus.textContent = stopped.ok
                    ? (stopped.data?.userSafeSummary ?? '계정 연결을 취소했어요.')
                    : endpointError(stopped, '계정 연결을 취소하지 못했어요.');
                  if (!stopped.ok) userCancelled = false;
                  popup?.close();
                };
                const finished = await endpointJson(action.awaitEndpoint, { method: 'POST' });
                cancel.remove();
                if (userCancelled) { button.disabled = false; return; }
                actionStatus.textContent = finished.ok
                  ? (finished.data?.userSafeSummary ?? '연결했어요.')
                  : endpointError(finished, '계정 연결을 완료하지 못했어요.');
                if (finished.ok) await load(); else button.disabled = false;
                return;
              }
              if (action.kind === 'user_action') {
                actionStatus.textContent = '필요한 화면을 열고 있어요…';
                const performed = await endpointJson(action.endpoint, {
                  method: 'POST', headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ actionId: action.id }),
                });
                actionStatus.textContent = performed.ok
                  ? (performed.data?.userSafeSummary ?? '필요한 화면을 열었어요.')
                  : endpointError(performed, '필요한 화면을 열지 못했어요.');
                button.disabled = false;
                return;
              }
              actionStatus.textContent = '연결을 해제하고 있어요…';
              const disconnected = await endpointJson(action.endpoint, { method: 'POST' });
              actionStatus.textContent = disconnected.ok
                ? (disconnected.data?.userSafeSummary ?? '연결을 해제했어요.')
                : endpointError(disconnected, '연결을 해제하지 못했어요.');
              if (disconnected.ok) await load(); else button.disabled = false;
            };
            actionRow.appendChild(button);
          }
          text.append(actionRow, actionStatus);
        }
        row.appendChild(connectionIcon(connection.id, connection.label));
        row.appendChild(text);
        row.appendChild(mk('div', `settings-item-state ${['connected', 'ready'].includes(connection.state) ? 'ready' : ''}`,
          stateLabel[connection.state] ?? '확인 필요'));
        result.appendChild(row);
      }
    }
    refresh.disabled = false; refresh.textContent = '다시 확인';
    return report;
  };
  refresh.onclick = load;
  target.appendChild(card);
  await load();
}

function reflectionReviewRequestId() {
  return globalThis.crypto?.randomUUID?.()
    ?? `review-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

async function renderReflectionReview(target) {
  const section = mk('section', 'settings-section');
  const head = mk('div', 'settings-section-head');
  const titles = document.createElement('div');
  titles.appendChild(mk('h3', null, '배운 점 검토'));
  titles.appendChild(mk('p', null, '과거 작업에서 찾은 제안의 근거와 반례를 살펴봐요. 아직 어떤 작업에도 사용하지 않아요.'));
  head.appendChild(titles); section.appendChild(head);
  const list = mk('div', 'settings-list'); section.appendChild(list); target.appendChild(section);

  const sourceButton = (reviewHandle, source, destination) => {
    const button = document.createElement('button'); button.className = 'connection-button';
    button.textContent = '출처 보기';
    button.onclick = async () => {
      button.disabled = true;
      try {
        const response = await fetch('/reflection/review/source', { method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ reviewHandle, sourceHandle: source.sourceHandle }) });
        const result = await response.json().catch(() => ({}));
        destination.textContent = response.ok
          ? (result.source?.content ?? result.source?.stateLabel ?? '지금 원본을 열 수 없어요.')
          : '지금 원본을 열 수 없어요.';
      } catch { destination.textContent = '지금 원본을 열 수 없어요.'; }
      finally { button.disabled = false; }
    };
    return button;
  };
  const renderSources = (reviewHandle, sources, parent) => {
    for (const source of sources ?? []) {
      const row = mk('div', 'settings-item'); const main = mk('div', 'settings-item-main');
      main.appendChild(mk('div', 'settings-item-title', source.label));
      const description = mk('div', 'settings-item-desc', source.availabilityLabel ?? '현재 확인 상태를 알 수 없음');
      main.appendChild(description); row.append(main, sourceButton(reviewHandle, source, description));
      parent.appendChild(row);
    }
  };
  const detailGroup = (title, description) => {
    const group = mk('div', 'settings-list');
    group.appendChild(mk('div', 'settings-item-title', title));
    if (description) group.appendChild(mk('div', 'settings-item-desc', description));
    return group;
  };
  const loadDetail = async (item, destination) => {
    destination.replaceChildren(mk('div', 'settings-item-desc', '검토 내용을 확인하고 있어요…'));
    let response; let detail;
    try {
      response = await fetch('/reflection/review/detail', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ reviewHandle: item.reviewHandle }) });
      const result = await response.json().catch(() => ({})); detail = result.item;
    } catch { response = null; }
    if (!response?.ok || !detail) {
      destination.replaceChildren(mk('div', 'settings-item-desc', '검토 내용을 불러오지 못했어요.'));
      return;
    }
    destination.replaceChildren();
    destination.appendChild(mk('div', 'settings-item-title', detail.hypothesis));
    destination.appendChild(mk('div', 'settings-item-desc', detail.statusLabel));
    for (const notice of detail.notices ?? []) destination.appendChild(mk('div', 'settings-item-desc', notice));

    const support = detailGroup('근거', '서로 다른 과업에서 확인한 내용이에요.');
    for (const episode of detail.support ?? []) {
      support.appendChild(mk('div', 'settings-item-title', episode.label));
      for (const group of episode.sourceGroups ?? []) {
        support.appendChild(mk('div', 'settings-item-desc', group.label));
        renderSources(detail.reviewHandle, group.sources, support);
      }
    }
    if (!(detail.support ?? []).length) support.appendChild(mk('div', 'settings-item-desc', '표시할 근거가 없어요.'));
    destination.appendChild(support);

    const counterexamples = detailGroup('반례', '이 제안이 맞지 않을 수 있음을 보여주는 내용이에요.');
    for (const counterexample of detail.counterexamples ?? []) {
      counterexamples.appendChild(mk('div', 'settings-item-title', counterexample.label));
      renderSources(detail.reviewHandle, counterexample.sources, counterexamples);
    }
    if (!(detail.counterexamples ?? []).length) counterexamples.appendChild(mk('div', 'settings-item-desc', '찾은 반례가 없어요.'));
    destination.appendChild(counterexamples);

    const uncertainties = detailGroup('확실하지 않은 점');
    for (const uncertainty of detail.uncertainties ?? []) {
      uncertainties.appendChild(mk('div', 'settings-item-desc', uncertainty));
    }
    if (!(detail.uncertainties ?? []).length) uncertainties.appendChild(mk('div', 'settings-item-desc', '따로 적힌 내용이 없어요.'));
    destination.appendChild(uncertainties);

    const corrections = detailGroup('현재 교정');
    for (const correction of detail.currentCorrections ?? []) {
      corrections.appendChild(mk('div', 'settings-item-title', correction.label));
      corrections.appendChild(mk('div', 'settings-item-desc', correction.relationLabel));
      renderSources(detail.reviewHandle, correction.sources, corrections);
    }
    if (!(detail.currentCorrections ?? []).length) corrections.appendChild(mk('div', 'settings-item-desc', '현재 교정과 연결된 내용이 없어요.'));
    destination.appendChild(corrections);

    const actions = mk('div', 'connection-actions'); const actionState = mk('div', 'settings-item-desc', '');
    const requestIds = new Map();
    const decide = async (decision) => {
      for (const button of actions.querySelectorAll('button')) button.disabled = true;
      const requestId = requestIds.get(decision) ?? reflectionReviewRequestId(); requestIds.set(decision, requestId);
      let actionResponse = null;
      try {
        actionResponse = await fetch('/reflection/review/action', { method: 'POST',
          headers: { 'content-type': 'application/json' }, body: JSON.stringify({
            requestId, reviewHandle: detail.reviewHandle, revisionHandle: detail.revisionHandle, decision,
          }) });
      } catch { /* show the same safe retry state below */ }
      if (actionResponse?.ok) await SET_RENDER.memory();
      else {
        actionState.textContent = '검토 상태가 바뀌었어요. 다시 확인해 주세요.';
        for (const button of actions.querySelectorAll('button')) button.disabled = false;
      }
    };
    if (detail.actions?.retain) {
      const retain = document.createElement('button'); retain.className = 'connection-button';
      retain.textContent = '검토용으로 남기기'; retain.onclick = () => decide('retain'); actions.appendChild(retain);
    }
    if (detail.actions?.reject) {
      const reject = document.createElement('button'); reject.className = 'connection-button';
      reject.textContent = '사용하지 않기'; reject.onclick = () => decide('reject'); actions.appendChild(reject);
    }
    if (detail.status === 'needs_review') {
      const later = document.createElement('button'); later.className = 'connection-button';
      later.textContent = '나중에'; later.onclick = () => decide('later'); actions.appendChild(later);
    }
    destination.append(actions, actionState);
  };

  try {
    const response = await fetch('/reflection/review/state');
    const state = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error('review state unavailable');
    if (state.available === false) {
      list.appendChild(mk('div', 'tb-empty', '배운 점 검토가 아직 연결되지 않아 현재 상태를 확인할 수 없어요.'));
      return;
    }
    if (!(state.items ?? []).length) {
      list.appendChild(mk('div', 'tb-empty', '지금 검토할 배운 점이 없어요.')); return;
    }
    for (const item of state.items) {
      const card = mk('div', 'settings-item'); const main = mk('div', 'settings-item-main');
      main.appendChild(mk('div', 'settings-item-title', item.hypothesis));
      main.appendChild(mk('div', 'settings-item-desc', `${item.statusLabel} · 근거 ${item.counts?.supportingExperiences ?? 0}건 · 반례 ${item.counts?.counterexamples ?? 0}건`));
      const open = document.createElement('button'); open.className = 'connection-button'; open.textContent = '내용 보기';
      const detail = mk('div', 'settings-item-main'); detail.hidden = true;
      open.onclick = async () => { detail.hidden = false; open.disabled = true; await loadDetail(item, detail); open.disabled = false; };
      card.append(main, open); list.append(card, detail);
    }
  } catch {
    list.appendChild(mk('div', 'tb-empty', '배운 점 검토 상태를 불러오지 못했어요. 기억과 기록은 그대로 확인할 수 있어요.'));
  }
}

let fileActivityActionNotice = null;
