  // ── 조각 E · 백엔드가 이미 답하는 것에 문을 낸다 ──────────────────────────
  // 서버 수정 0. `GET /automation` 이 이미 내는 것을 사람 문장으로 옮긴다. 판단(어떤 버튼을
  // 낼지·무엇이 안 도는 조건인지)은 전부 `automation-view.js` 한 자리에 있다.
  async automation() {
    setBody.replaceChildren();
    // 못 불러온 것도 「안 뜰 상황」이다 — 여기서 잡아 **고칠 길을 그 자리에** 놓는다.
    // 안 잡으면 바깥 catch 가 패널을 통째로 갈아 버린다(형제 6섹션은 카드를 지킨다).
    let 답;
    try {
      const res = await fetch('/automation');
      if (!res.ok) throw new Error(String(res.status));
      답 = await res.json();
    } catch {
      const f = automationLoadFailure();
      const card = mk('div', 'tb-card');
      card.appendChild(mk('div', 'tb-name', f.title));
      for (const step of f.steps) card.appendChild(mk('div', 'tb-hint', step));
      setBody.appendChild(card);
      return;
    }
    const 문 = projectAutomationDoor(답, { now: Date.now() });

    // ★ 「안 뜰 상황」을 **목록을 보는 순간 먼저** 말한다(헤르메스 cron.py:64-95).
    //    도는 예약이 하나도 없으면 해당 없는 진단이므로 통째로 숨긴다(같은 파일 :223-243).
    if (문.appRunning.applies) setBody.appendChild(mk('div', 'ae-notice', 문.appRunning.text));

    // 0개일 때 **빈 목록을 주지 않는다** — 다음 행동을 준다(같은 파일 :105-108).
    if (문.guide) {
      const g = mk('div', 'tb-card');
      g.appendChild(mk('div', 'tb-name', 문.guide.title));
      for (const step of 문.guide.steps) g.appendChild(mk('div', 'tb-hint', step));
      setBody.appendChild(g);
    }

    for (const row of 문.jobs) {
      const card = mk('div', 'tb-card');
      // 한 줄에 상태·다음 실행·마지막 결과·배달 실패가 다 있다(cron.py:145-190).
      const 머리 = mk('div', 'ae-row');
      머리.appendChild(mk('span', `ae-dot ae-${row.tone}`, '●'));
      머리.appendChild(mk('span', 'tb-name', row.summaryLine));
      card.appendChild(머리);

      const acts = mk('div', 'ae-acts');
      for (const a of row.actions) {
        const b = document.createElement('button');
        b.className = 'tb-test'; b.textContent = a.label;
        b.onclick = async () => {
          b.disabled = true;
          await fetch(a.path, {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ jobId: row.id }),
          });
          SET_RENDER.automation();      // 서버가 낸 새 사실로 다시 그린다
        };
        acts.appendChild(b);
      }
      // 못 하는 상황에는 **버튼 대신 텍스트**를 놓는다(715·990 원칙 · 죽은 버튼 금지).
      if (!row.actions.length && row.noActionReason) acts.appendChild(mk('div', 'tb-hint', row.noActionReason));
      card.appendChild(acts);

      if (row.keptHint) card.appendChild(mk('div', 'tb-hint', row.keptHint));
      if (row.trouble) {
        if (row.trouble.summary) card.appendChild(mk('div', 'tb-hint', row.trouble.summary));
        if (row.trouble.nextAction) card.appendChild(mk('div', 'tb-hint', row.trouble.nextAction));
      }
      // 판단에 꼭 필요한 최소치만 1차 화면에(§6-1) — 나머지 조건은 펼쳐야 나온다.
      if (row.notRunning.length) {
        const d = document.createElement('details'); d.className = 'ae-why';
        d.appendChild(mk('summary', null, '안 돌 수 있는 조건'));
        for (const 줄 of row.notRunning) d.appendChild(mk('div', 'tb-hint', 줄));
        card.appendChild(d);
      }
      setBody.appendChild(card);
    }

    // 켜기를 기다리는 것 — 여기서 승인을 흉내 내지 않는다(무엇을·언제·어디로는 대화에서 정한다).
    if (문.candidates.length) {
      const c = mk('div', 'tb-card');
      c.appendChild(mk('div', 'tb-name', `켜기를 기다리는 후보 ${문.candidates.length}개`));
      for (const cand of 문.candidates) c.appendChild(mk('div', 'tb-hint', cand.statement));
      setBody.appendChild(c);
    }

    // 다가올 것과 **지난 것을 같은 화면에**(claude.com/blog/cowork-web-mobile).
    if (문.ended.length) {
      const e = mk('div', 'tb-card');
      e.appendChild(mk('div', 'tb-name', '지난 자동화'));
      for (const row of 문.ended) {
        e.appendChild(mk('div', 'tb-hint', row.summaryLine));
        if (row.noActionReason) e.appendChild(mk('div', 'tb-hint', row.noActionReason));
      }
      setBody.appendChild(e);
    }
    if (답.archivedJobs?.length) {
      const section = mk('section', 'settings-section'); const head = mk('div', 'settings-section-head');
      const titles = document.createElement('div'); titles.appendChild(mk('h3', null, '보관한 자동화'));
      titles.appendChild(mk('p', null, '다시 목록으로 되돌리거나 삭제할 수 있어요.')); head.appendChild(titles); section.appendChild(head);
      const list = mk('div', 'settings-list');
      for (const job of 답.archivedJobs) {
        const row = mk('div', 'settings-item'); const main = mk('div', 'settings-item-main');
        main.appendChild(mk('div', 'settings-item-title', job.name)); main.appendChild(mk('div', 'settings-item-desc', '보관됨'));
        const actions = mk('div', 'connection-actions');
        for (const [label, path] of [['되돌리기', '/automation/archive/restore'], ['삭제', '/automation/delete']]) {
          const button = document.createElement('button'); button.className = 'connection-button'; button.textContent = label;
          button.onclick = async () => { button.disabled = true; await fetch(path, { method: 'POST',
            headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jobId: job.id }) }); SET_RENDER.automation(); };
          actions.appendChild(button);
        }
        row.append(main, actions); list.appendChild(row);
      }
      section.appendChild(list); setBody.appendChild(section);
    }
    if (답.trashedJobs?.length) {
      const section = mk('section', 'settings-section'); const head = mk('div', 'settings-section-head');
      const titles = document.createElement('div'); titles.appendChild(mk('h3', null, '삭제한 자동화'));
      titles.appendChild(mk('p', null, '실수로 삭제했다면 되돌릴 수 있어요.')); head.appendChild(titles); section.appendChild(head);
      const list = mk('div', 'settings-list');
      for (const job of 답.trashedJobs) {
        const row = mk('div', 'settings-item'); const main = mk('div', 'settings-item-main');
        main.appendChild(mk('div', 'settings-item-title', job.name)); main.appendChild(mk('div', 'settings-item-desc', '삭제됨'));
        const button = document.createElement('button'); button.className = 'connection-button'; button.textContent = '되돌리기';
        button.onclick = async () => { button.disabled = true; await fetch('/automation/delete/restore', { method: 'POST',
          headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jobId: job.id }) }); SET_RENDER.automation(); };
        row.append(main, button); list.appendChild(row);
      }
      section.appendChild(list); setBody.appendChild(section);
    }
  },

const logEl = document.getElementById('log');

// ── 조각 A · 따라가기는 **문턱이 아니라 사람의 뜻**으로 정한다 (UX 기획 §2 A · 2026-08-12) ──
//
// 격리 서버 실측이 문턱 120px 규칙을 양쪽으로 다 깼다.
//   · 조각이 잘면(토큰 크기) 100px 올려 읽는 사람을 **여덟 번 중 일곱 번 도로 끌어내렸다**(최대 399px)
//   · 조각이 굵으면(12줄) 한 조각에 문턱을 넘겨 **따라가기가 즉사**해 답 끝에서 2,406px 뒤에 남았다
// 같은 한 줄이 정반대 두 증상을 만든 것은, 그 줄이 재는 것이 **거리**이지 **사람의 뜻**이 아니어서다.
// 그래서 규칙을 바꾼다: **한 번 올리면 그 답이 끝날 때까지 안 끌어내린다.** 다시 켜지는 자리는
// 셋뿐이다 — 새 발화 · 다른 대화 열기 · 사용자가 스스로 바닥까지 내려온 때.
let 따라간다 = true;
let 우리가옮긴자리 = null;   // 우리가 옮긴 것과 사용자가 올린 것을 가르는 유일한 표식
let 예약된따라가기 = 0;

/** 우리가 자리를 옮길 때는 **옮긴 값을 남긴다** — 안 남기면 우리 스크롤을 사용자 것으로 오해한다. */
function 자리옮김(y) {

  logEl.scrollTop = Math.max(0, y);
  우리가옮긴자리 = logEl.scrollTop;
}

logEl.addEventListener('scroll', () => {
  if (우리가옮긴자리 != null && Math.abs(logEl.scrollTop - 우리가옮긴자리) < 2) return; // 우리가 옮긴 것
  우리가옮긴자리 = null;
  따라간다 = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 8; // 스스로 바닥에 닿으면 다시 따라간다
  맨아래버튼갱신();
}, { passive: true });

/**
 * **조각마다 재고 쓰지 않는다.** 조사가 낸 값: 조각당 3.82ms 중 마크다운 파싱은 0.024ms —
 * 나머지는 그린 직후 `scrollHeight` 를 읽어 브라우저에게 레이아웃을 강제로 다시 시킨 값이다.
 * 그래서 한 프레임에 **한 번만**, 그리고 **읽기를 다 한 뒤에 쓴다**.
 */
function scrollToBottom(force = false) {
  if (force) { 따라간다 = true; 맨아래버튼갱신(); }
  if (!따라간다 || 예약된따라가기) return;
  예약된따라가기 = requestAnimationFrame(() => {
    예약된따라가기 = 0;
    if (!따라간다) return;
    const 목표 = Math.max(0, logEl.scrollHeight - logEl.clientHeight); // 읽기
    우리가옮긴자리 = 목표;
    logEl.scrollTop = 목표;                                            // 쓰기
  });
}

// 주면 그게 죽은 버튼이다(*"죽은 버튼 대신 텍스트"*). 스크롤 상자 안에 높이 0 으로 붙어 있어
// 대화 높이(scrollHeight)를 바꾸지 않는다 — 바꾸면 따라가기 계산이 자기 꼬리를 문다.
const 맨아래집 = document.createElement('div');

/**
 * 대화를 **통째로 갈아끼울 때** 보던 자리를 지킨다.
 *
 * 실측(2026-08-03, 팀원): 답이 하나 끝날 때마다 화면이 맨 위 대화로 튀었다. `대화투영` 이
 * `wrap.innerHTML = ''` 로 전부 새로 그리면 스크롤이 0 이 되는데, 그 뒤에 부르는
 * `scrollToBottom()` 은 **새 DOM 을 재서** "사용자가 위쪽을 보고 있다"고 판정해 버린다.
 * 그래서 아무 것도 안 하고, 사용자는 맨 위에 남는다.
 *
 * 그러니 "따라 보고 있었는가"는 **갈아끼우기 전에** 재야 한다. 위로 올려 읽던 중이었다면
 * 그 자리를 되돌려 준다 — 읽던 곳을 잃는 것도 맨 위로 튀는 것만큼 나쁘다.
 */
async function 자리지키며(그리기) {
  const 따라보고있었다 = nearBottom();
  const 보던자리 = logEl.scrollTop;
  const r = await 그리기();
  // 통째로 갈아끼웠으니 「따라가는 중인가」도 여기서 다시 세운다(조각 A). 안 세우면 갈아끼우기
  // 전의 판정이 남아, 위로 올려 읽던 사람이 다음 조각에 도로 끌려 내려간다.
  따라간다 = 따라보고있었다;
  맨아래버튼갱신();
  if (따라보고있었다) 자리옮김(logEl.scrollHeight);

function relAge(ts) {
  if (!Number.isFinite(ts)) return '';   // 방어: 세션 아닌 파일이 섞여도 NaN 표시 안 함
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '지금'; if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}시간`;
  return `${Math.floor(h / 24)}일`;
}

async function sessionAction(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { const message = out.error ?? '대화 목록을 바꾸지 못했어요.'; toast(message); throw new Error(message); }
  if (out.userSafeSummary) toast(out.userSafeSummary);
  return out;
}

async function recoverConversation(sessionId, mode, recoveryId = null) {
  const response = await fetch('/sessions/recover', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, mode, recoveryId }),
  });
  const result = await response.json().catch(() => ({}));
  toast(result.userSafeSummary ?? result.error ?? '대화 상태를 다시 준비하지 못했어요.');
  if (!response.ok) return result;
  if (result.newSessionId) await selectSession(result.newSessionId);
  else if (sessionId === currentSessionId) await 대화다시그리기();
  await loadSessions();
  return result;
}

async function loadSessions() {

  const loadingTimer = scheduleSessionSkeleton(sequence);
  let payload;
  try { payload = await (await fetch(listQuery())).json(); }
  finally { clearTimeout(loadingTimer); }
  if (sequence !== sessionLoadSequence) return;
  const sessions = payload.sessions ?? [];
  for (const session of sessions) {
    if (session.activity?.status === 'running') sessionActivityById.set(session.id, session.activity);
    else sessionActivityById.delete(session.id);
  }

  // 보관함·휴지통은 정리용 보기라 구역을 나누지 않는다(그 안에서 또 접으면 되레 헷갈린다).

  if (fav.length) {

    if (!isFolded('fav')) for (const s of fav) sessionsEl.appendChild(sessionRow(s));
  }
  if (rest.length) {
    // 즐겨찾기가 없으면 굳이 "대화" 머리글로 한 줄 더 쓰지 않는다(빈 구역·군더더기 금지).
    if (fav.length) sessionsEl.appendChild(sectionHeader('rest', '대화', rest.length, loadSessions));
    if (!fav.length || !isFolded('rest')) for (const s of rest) sessionsEl.appendChild(sessionRow(s));
  }
}

// 대화 한 벌을 **한 함수로만** 그린다.
//
// 실측(오너 라이브 2026-07-28, G-1B): 승인 없이 재시작한 뒤 `이어줘` 하면 서버는 유효한 승인을
// 하나만 들고 있는데, 화면에는 승인 버튼이 둘 보였다. 실시간으로 받은 결과를 그 자리에 덧붙이기만
// 해서 **이미 지난 카드가 계속 살아 보였다**(새로고침하면 맞게 나왔다 — 같은 화면에서만 틀렸다).
// 누르면 "찾지 못했어요"로 끝나 실행은 안 되지만, 누르기 전까지 사용자는 어느 버튼이 유효한지
// 알 수 없다. 죽은 버튼이다.

// 화면이 승인 상태를 따로 추측하지 않는다. **서버의 유효 승인 목록(activePendingIds)이 단일
// 진실**이고, 턴·승인·거절이 끝나면 그 사실로 대화를 다시 투영한다.
// 다만 **마지막 결과만 현재**로 그린다 — `historical` 은 비밀 입력면·기억 제안 같은 지금 필요한
// 자리까지 숨기므로, 전부 과거로 그리면 방금 열린 입력창이 사라진다.
async function 대화투영(s) {

  const activeRecoveryIds = s.activeRecoveryIds || [];
  const activeConnectionHandoffIds = s.activeConnectionHandoffIds || [];
  const 마지막 = (s.transcript || []).map((e, i) => (e.role === 'assistant' ? i : -1)).filter((i) => i >= 0).at(-1);
  wrap.innerHTML = '';
  (s.transcript || []).forEach((e, i) => {
    if (e.role === 'user') {
      const box = turnBox(); const who = el('who right', '사용자'); appendMessageTime(who, e.recordedAt);
      box.appendChild(who); box.appendChild(el('msg me', e.text));
      renderMessageAttachments(box, e.attachments);
      appendMessageActions(box, e.text, { editable: true, align: 'right' });
    }
    else if (e.role === 'assistant') renderResult(e.result, {

      recordedAt: e.recordedAt,

  renderSessionActivity(s.activity ?? sessionActivityById.get(s.id));
  renderWorkReality(s.workReality, { reconnect: true, sessionId: s.id });

let activityClockTimer = 0;
function formatActivityElapsed(elapsedMs) {
  const totalSeconds = Math.max(0, Math.floor(elapsedMs / 1000));
  if (totalSeconds < 60) return `${totalSeconds}초`;
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return seconds ? `${minutes}분 ${seconds}초` : `${minutes}분`;
}
function formatCanonicalTime(recordedAt) {
  const value = new Date(recordedAt);
  if (!Number.isFinite(value.getTime())) return '';
  return value.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function appendMessageTime(who, recordedAt) {

  const time = document.createElement('time'); time.className = 'meta';

  time.textContent = text; who.appendChild(time);
}
async function copyMessageText(value) {

  catch {
    const helper = document.createElement('textarea'); helper.value = raw; helper.setAttribute('readonly', '');
    helper.style.position = 'fixed'; helper.style.opacity = '0'; document.body.appendChild(helper);
    helper.select(); document.execCommand('copy'); helper.remove();

}
function appendMessageActions(box, raw, { editable = false, align = 'left' } = {}) {

function paintActivityTrace(trace) {
  const text = trace.dataset.activityText ?? '';
  const startedAt = Number(trace.dataset.activityStartedAt);
  const elapsed = Number.isFinite(startedAt) && startedAt > 1_000_000_000_000
    ? Math.max(0, Date.now() - startedAt) : 0;
  const rendered = `${text}${text ? '…' : ''}${elapsed >= 3000 ? ` · ${formatActivityElapsed(elapsed)}` : ''}`;
  const current = trace.querySelector('.activity-current-label');
  if (current) current.textContent = rendered;
  else trace.textContent = rendered;
}
function ensureActivityClock() {

    paintActivityTrace(trace);

}
function setActivityTrace(trace, text, startedAt = null) {

  }
  else if (!trace.dataset.activityStartedAt) trace.dataset.activityStartedAt = String(Date.now());

function ensureActivityFeed(trace) {

function renderWorkReality(reality, { reconnect = false, sessionId = null } = {}) {
  if (!reality) return;

  if (!realitySessionId) return;
  const previous = workRealityBySession.get(realitySessionId);
  if (previous && Number(reality.version) < Number(previous.version)) return;
  workRealityBySession.set(realitySessionId, reality);
  if (realitySessionId !== currentSessionId) return;
  if (reality.showPanel !== true) { clearWorkRealityPanel(); return; }
  // 현재 탭이 직접 따라가는 작업에는 더 구체적인 stream 진행줄·경과 시간·중지 버튼이 있다.
  // 같은 Run의 일반 Work Reality까지 함께 그리면 사용자는 두 작업이 돈다고 느낀다.
  // 재접속·다른 탭처럼 stream 진행줄이 없는 경우에만 canonical panel을 복구 표면으로 쓴다.
  const liveTrace = document.getElementById('session-activity-trace');
  if (!reconnect && activeLocalTurns > 0 && liveTrace) {
    document.getElementById('work-reality-panel')?.remove();
    liveTrace.hidden = liveTrace.dataset.hasToolActivity !== 'true';
    const stop = document.querySelector('[data-session-activity-stop]'); if (stop) stop.hidden = false;
    return;
  }
  const paint = () => {
    if (workRealityBySession.get(realitySessionId) !== reality || realitySessionId !== currentSessionId) return;
    document.getElementById('work-reality-panel')?.remove();
    const turns = wrap.querySelectorAll('.turn');
    const host = turns.length ? turns[turns.length - 1] : turnBox();
    const panel = el('trace'); panel.id = 'work-reality-panel';
    panel.setAttribute('role', 'status'); panel.setAttribute('aria-live', 'polite');
    const line = reality.userActionNeeded ? '계속하려면 사용자 확인이 필요해요.'
      : reality.result?.deliveryText
        ?? (reality.inputs ?? []).at(-1)?.text
        ?? reality.activity?.text
        ?? reality.milestone?.text
        ?? reality.statusText
        ?? (reconnect ? (reality.recap ?? []).at(-1) : null);
    if (line) panel.appendChild(el(null, line));
    host.appendChild(panel);
    const trace = document.getElementById('session-activity-trace');
    if (trace) trace.hidden = true;
    const stop = document.querySelector('[data-session-activity-stop]');
    if (stop) stop.hidden = false;
    scrollToBottom();
  };
  if (reconnect) { paint(); return; }
  if (workRealityPanelTimer) clearTimeout(workRealityPanelTimer);
  workRealityPanelTimer = setTimeout(() => { workRealityPanelTimer = 0; paint(); }, 400);
}

/** 서버에서 현재 대화를 다시 받아 통째로 투영한다(턴·승인·거절이 끝난 뒤). */
async function 대화다시그리기() {
  if (!currentSessionId) return;
  await 자리지키며(async () => 대화투영(await (await fetch('/sessions/' + currentSessionId)).json()));
}

async function selectSession(id) {
  if (currentSessionId && currentSessionId !== id) { stagedAttachments = []; renderStagedAttachments(); }
  currentSessionId = id;
  await 대화투영(await (await fetch('/sessions/' + id)).json());
  await loadSessions();
  scrollToBottom(true); // 대화를 열면 마지막 대목부터 보인다(위에서부터 읽게 두지 않는다)
  document.body.classList.remove('nav-open');
}

function renderSelfState(s) {
  if (!s) return;
  // P-RT-2 감사 B1: 자격이 usable 이어도 doctor 가 model_missing/unreachable 을 보고했으면
  // "준비됨"이라 말하지 않는다(보이는 것=되는 것).
  const healthIssue = s.modelHealthState === 'model_missing' || s.modelHealthState === 'unreachable';
  const label = s.modelAuthState !== 'usable' ? s.modelAuthState : (healthIssue ? '모델 확인 필요' : '준비됨');
  const warn = s.modelAuthState !== 'usable' || healthIssue || (s.limits && s.limits.length);
  chip.textContent = label;
  chip.classList.toggle('warn', !!warn);
  modelinfo.textContent = `${s.model} · ${label}`;
  let self = document.getElementById('stateSelf');
  if (!self) { self = document.createElement('div'); self.id = 'stateSelf'; statePanel.prepend(self); }
  self.textContent = [
    `모델: ${s.model} (${s.modelAuthState})`,
    `바로 쓰는 연결: ${s.ready.length ? s.ready.join(', ') : '없음'}`,   // 라벨만(내부 id 비노출)
    s.limits && s.limits.length ? `막힌 것: ${s.limits.join(' · ')}` : null,
    s.nextSafeAction ? `다음: ${s.nextSafeAction}` : null,
  ].filter(Boolean).join('\n');
}

// P6-18: 조용한 상태 요약. **누적된 "반드시 구분"을 라벨로 못 박는다** — 추정≠반영, 추천≠활성, 연결≠가능,
//   실패≠완료. 읽기 전용(실행/승격 버튼 없음). 안티 대시보드: 칩을 열 때만 채운다.
function renderOverview(o) {
  let el = document.getElementById('stateOv');
  if (!el) {
    el = document.createElement('div'); el.id = 'stateOv'; el.className = 'ov'; statePanel.appendChild(el);
    el.addEventListener('click', onOverviewAction); // 액션은 위임(재렌더돼도 유지)
  }
  const list = (items, fmt) => items && items.length ? esc(items.map(fmt).join(', ')) : '없음';
  // 액션 달린 항목 — 누르면 '아직 아님'에서 '완료'로 이동(구분 유지: 누르기 전엔 계속 아직 아님).
  const acts = (items, act, fmt, label) => items && items.length
    ? items.map((it) => `${esc(fmt(it))} <button class="ov-act" data-act="${esc(act)}" data-id="${esc(it.id)}">${esc(label)}</button>`).join(' · ')
    : '없음';
  // 두 갈래 결정(확인/지우기)이 있는 항목 — 승인 대기는 어느 턴에서도 정리할 수 있어야
  // 죽은 후보가 쌓이지 않는다(H 감사 2026-07-29).
  const acts2 = (items, pairs, fmt) => items && items.length
    ? items.map((it) => `${esc(fmt(it))} ${pairs.map(([act, label]) => `<button class="ov-act" data-act="${esc(act)}" data-id="${esc(it.id)}">${esc(label)}</button>`).join('')}`).join(' · ')
    : '없음';
  const row = (cls, label, body) => `<div class="ov-row"><span class="${cls}">${esc(label)}</span> <span class="ov-k">${body}</span></div>`;
  const sec = (title, rows) => `<div class="ov-sec"><div class="ov-h">${esc(title)}</div>${rows}</div>`;
  el.innerHTML = [
    sec('연결', row('ov-on', '받을 준비됨', list(o.connections.ready, (c) => c.label)) + row('ov-off', '연결/로그인 필요', list(o.connections.notReady, (c) => c.label))),
    sec('스킬', row('ov-on', '활성화됨', list(o.skills.active, (s) => s.label)) + row('ov-off', '추천됨(아직 아님)', acts(o.skills.recommended, 'approve-skill', (s) => s.label, '승인'))),
    sec('선호', row('ov-on', '반영 중', acts(o.preferences.reflected, 'rollback-memory', (x) => x.statement, '잊기'))
      + row('ov-off', '확인 대기', acts2(o.preferences.pending, [['confirm-pref', '확인(반영)'], ['reject-memory', '지우기']], (x) => x.statement))
      + row('ov-off', '추정됨(반영 안 함)', list(o.preferences.inferred, (x) => x.statement))), // 추정은 액션 없음(읽기 전용)
    sec('전달', row('ov-on', `보냄 ${o.deliveries.deliveredCount}건`, '') + row('ov-off', '전달 실패(다시 보낼 수 있어요)', acts(o.deliveries.failed, 'retry-delivery', (d) => d.target || d.label, '다시 보내기'))),
    // 검색으로 반영한 기억도 같은 자리서 되돌린다(선호 되돌리기와 같은 수준).
    sec('기억', row('ov-on', '반영 중', acts(o.memories.reflected, 'rollback-memory', (m) => m.statement, '잊기'))),
  ].join('');
}

async function refreshOverview() {
  try {
    const o = await (await fetch(`/overview?sessionId=${encodeURIComponent(currentSessionId || '')}`)).json();
    renderOverview(o);
  } catch { /* 요약 실패해도 자기상태 텍스트는 남는다 */ }
}

// 요약의 조용한 액션 — 이미 만든(게이트 있는) 엔드포인트를 그대로 부른다(우회 없음). 후 재조회로 이동을 보여준다.
async function onOverviewAction(e) {
  const btn = e.target.closest('.ov-act'); if (!btn) return;
  const { act, id } = btn.dataset;
  btn.disabled = true;
  try {
    if (act === 'retry-delivery') await fetch(`/deliveries/${id}/retry`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId }) });
    else if (act === 'approve-skill') await fetch(`/skills/${id}/approve`, { method: 'POST' });
    // 확인은 종류 공통 통로(/memory/confirm) 하나로 — 운영 원리는 거기서 replay 게이트를 탄다.
    // 기억 변경은 전부 memAction — 영수증 누락 표시가 표면마다 갈라지지 않게.
    else if (act === 'confirm-pref') await memAction('/memory/confirm', { candidateId: id });
    else if (act === 'reject-memory') await memAction('/memory/reject', { candidateId: id });
    else if (act === 'rollback-memory') await memAction('/memory/rollback', { candidateId: id });
    // S5-5 · 성장 표면. 붙들기·치우기·되돌리기 — 카드도 승인도 만들지 않는다.
    else if (act === 'pin-memory') await memAction('/memory/pin', { id, pinned: true });
    else if (act === 'unpin-memory') await memAction('/memory/pin', { id, pinned: false });
    else if (act === 'archive-memory') await memAction('/memory/archive', { id });
    else if (act === 'restore-memory') await memAction('/memory/restore', { id });
    await refreshOverview();
  } catch { btn.disabled = false; }
}

// P-OP-4 · **기억 변경은 화면 어디서든 이 함수 하나로.** 응답 해석(영수증 누락 표시)이 표면마다
// 흩어지면, 서버만 정직하고 화면은 다른 결론을 내는 자리가 다시 생긴다(감사 지적).
async function memAction(path, body) {
  const j = await (await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) })).json().catch(() => null);
  if (j && j.receiptWritten === false) receiptNote();
  return j;
}

// 영수증 누락 알림 — 표면과 무관하게 화면 상단 한 곳. 동작(반영·철회)은 성공했다는 사실과 분리해 말한다.
function receiptNote() {
  let n = document.getElementById('receiptNote');
  if (!n) {
    n = document.createElement('div'); n.id = 'receiptNote';
    n.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--panel,#fff);border:1px solid #a15c00;color:#a15c00;padding:6px 12px;border-radius:8px;z-index:999;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08)';
    document.body.appendChild(n);
  }
  n.textContent = '반영은 됐지만 기록을 남기지 못했어요. 기록 상태를 확인해 주세요.';
  clearTimeout(n._t); n._t = setTimeout(() => n.remove(), 8000);
}

/**
 * 접힌 라벨은 **숫자가 아니라 사실**을 말한다(오너 결정 2026-08-03).
 *
 * 실측: 턴이 끝나면 진행 표시(`steps`)는 제거되고 복원되지 않는다. 그때 화면에 남는 것은
 * 최종 답 한 줄과 이 접힌 머리뿐인데, 그 머리가 **"도구 1개"** 라고 말했다. 참이지만
 * 사용자가 알고 싶은 것이 아니다 — 대리지표를 결과 자리에 세운 것이고, 팀원이 "진행을 본 적
 * 없다"고 한 이유다. 정보가 사라진 게 아니라 **접혀 있었고, 접힌 이름이 아무것도 안 말했다.**
 *
 * 바로 아래 `body` 에 이미 정확한 문장이 있으므로 새 데이터도 새 UI도 만들지 않는다.
 * **확인된 사실이 있을 때만 그것을 라벨로 올린다** — 미확인·추정을 라벨에 올리면 접힌 줄만
 * 보고 "됐구나" 하고 넘어간다. 그건 숫자보다 나쁘다(거짓을 짧게 말하는 것).
 */
function 기록라벨(ledger) {
  const 확인 = ledger?.confirmed ?? [];
  const 미확인 = ledger?.unconfirmed ?? [];
  const 전체 = 확인.length + 미확인.length + (ledger?.estimated?.length || 0);
  // **못 한 것도 사실이다.** 확인된 것이 없을 때 "도구 N개"로 떨어지면, 막힌 턴에서 화면에
  // 남는 것은 모델의 산문 한 줄뿐이고 기계 사실은 접힌 채 숨는다(2026-08-03 실측: 연결이
  // 막혔는데 답은 "확인했어요."였고 접힌 이름은 "도구 1개"였다).
  // 다만 **확인처럼 적지는 않는다** — `미확인:` 표를 달아 그대로 올린다. 표 없이 올리면
  // 펼치지 않는 사용자가 됐다고 믿는다(그건 숫자보다 나쁘다).
  const 고른것 = 확인.length ? { 말: 확인[0], 표: '' } : 미확인.length ? { 말: 미확인[0], 표: '미확인: ' } : null;
  if (!고른것) return `작업 기록 · 도구 ${전체}개`;
  const 첫 = `${고른것.표}${String(고른것.말).replace(/[.\s]+$/, '')}`;
  const 나머지 = 전체 - 1;
  return 나머지 > 0 ? `${첫} 외 ${나머지}건` : 첫;
}

function renderRecord(box, ledger) {
  const n = (ledger?.confirmed.length || 0) + (ledger?.unconfirmed.length || 0) + (ledger?.estimated.length || 0);
  if (!n) return;
  const rec = el('record');
  const head = el('head');
  const tw = document.createElement('span'); tw.className = 'tw'; tw.textContent = '▸';
  head.appendChild(tw);
  head.appendChild(document.createTextNode(` ${기록라벨(ledger)}`)); // OS 가 만든 문장 — HTML 로 해석하지 않는다
  const body = el('body');
  body.textContent = [
    ledger.confirmed.length ? '확인: ' + ledger.confirmed.join('; ') : '',
    ledger.unconfirmed.length ? '미확인: ' + ledger.unconfirmed.join('; ') : '',
    ledger.estimated.length ? '추정: ' + ledger.estimated.join('; ') : '',
  ].filter(Boolean).join('\n');
  head.onclick = () => { const o = body.style.display === 'block'; body.style.display = o ? 'none' : 'block'; head.classList.toggle('open', !o); };
  rec.appendChild(head); rec.appendChild(body); box.appendChild(rec);
}

async function turn(payload) {
  const res = await fetch('/turn', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...payload, sessionId: currentSessionId }) });
  return res.json();
}

function renderConversationRecovery(box, result, { historical, activeRecoveryIds = [] } = {}) {
  const recovery = result?.recovery;
  if (historical || recovery?.kind !== 'repeated_no_progress'
    || !activeRecoveryIds.includes(recovery.recoveryId)) return;
  const card = el('suggest conversation-recovery');
  card.appendChild(el('sug-t', '같은 자리에서 진행되지 않고 있어요'));
  card.appendChild(el('sug-line', '대화 내용은 지우지 않고, 막힌 진행 상태만 다시 준비할 수 있어요.'));
  const actions = el('btns');
  const reset = document.createElement('button'); reset.className = 'act primary';
  reset.textContent = '이 대화 상태 다시 준비';
  const continued = document.createElement('button'); continued.className = 'act no';
  continued.textContent = '새 대화에서 이어가기';
  const run = async (mode) => {
    reset.disabled = true; continued.disabled = true;
    await recoverConversation(currentSessionId, mode, recovery.recoveryId);
  };
  reset.onclick = () => run('reset');
  continued.onclick = () => run('continue');
  actions.append(reset, continued); card.appendChild(actions); box.appendChild(card);
}

function renderConnectionHandoff(box, result, { historical, activeConnectionHandoffIds = [] } = {}) {
  const handoff = result?.connectionHandoff;
  if (historical || !handoff?.active || !activeConnectionHandoffIds.includes(handoff.handoffId)) return;
  const card = el('suggest connection-handoff');
  card.appendChild(el('sug-t', handoff.mode === 'user_action'
    ? `${handoff.label || '업무공간'} 준비 중` : `${handoff.label || '업무공간'} 계정 연결`));
  card.appendChild(el('sug-line', handoff.mode === 'user_action'
    ? '열린 앱이나 설정에서 준비를 마치면 T5가 확인한 뒤 원래 부탁을 자동으로 이어갈게요.'
    : '계정 연결은 열린 서비스 화면에서만 진행돼요. 비밀번호나 인증코드는 대화에 입력하지 마세요.'));
  const status = el('sug-line');
  const button = document.createElement('button'); button.className = 'act primary';
  button.textContent = handoff.mode === 'user_action' ? '지금 상태 확인' : '계정 연결 계속하기';
  const cancel = document.createElement('button'); cancel.className = 'act no';
  cancel.textContent = '연결 취소';
  cancel.onclick = async () => {
    button.disabled = true; cancel.disabled = true;
    const cancelEndpoint = handoff.mode === 'user_action' ? handoff.cancelEndpoint
      : handoff.awaitEndpoint?.replace(/\/await$/u, '/cancel');
    const cancelled = await endpointJson(cancelEndpoint, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, handoffId: handoff.handoffId }),
    });
    status.textContent = cancelled.ok
      ? (cancelled.data?.userSafeSummary ?? '계정 연결을 취소했어요.')
      : endpointError(cancelled, '계정 연결을 취소하지 못했어요.');
    if (cancelled.ok) { await 대화다시그리기(); await loadSessions(); }
    else { button.disabled = false; cancel.disabled = false; }
  };
  button.onclick = async () => {
    button.disabled = true; cancel.disabled = true;
    if (handoff.mode === 'user_action') {
      const checked = await endpointJson(handoff.checkEndpoint, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId: currentSessionId, handoffId: handoff.handoffId }),
      });
      status.textContent = checked.ok
        ? (checked.data?.userSafeSummary ?? '현재 준비 상태를 확인했어요.')
        : endpointError(checked, '준비 상태를 확인하지 못했어요.');
      if (checked.ok && checked.data?.completed) {
        await 대화다시그리기(); await loadSessions(); return;
      }
      button.disabled = false; cancel.disabled = false; return;
    }
    let authorize;
    try { authorize = new URL(handoff.authorizeUrl); } catch { authorize = null; }
    if (!authorize || authorize.protocol !== 'https:' || !/^\/connections\/[a-z0-9-]+\/await$/u.test(handoff.awaitEndpoint ?? '')) {
      status.textContent = '연결 주소를 확인하지 못했어요. 다시 연결을 요청해 주세요.';
      cancel.disabled = false; return;
    }
    const popup = window.open('about:blank', '_blank');
    if (popup) { popup.opener = null; popup.location.href = authorize.href; }
    else window.open(authorize.href, '_blank', 'noopener');
    status.textContent = '열린 화면에서 계정을 선택하고 허용해 주세요…';
    const finished = await endpointJson(handoff.awaitEndpoint, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, handoffId: handoff.handoffId }),
    });
    status.textContent = finished.ok
      ? (finished.data?.userSafeSummary ?? '계정을 연결했어요.')
      : endpointError(finished, '계정 연결을 완료하지 못했어요.');
    if (finished.ok) {
      toast(status.textContent); await 대화다시그리기(); await loadSessions();
    } else { button.disabled = false; cancel.disabled = false; }
  };
  card.append(button, cancel, status); box.appendChild(card);
}

function renderResult(r, opts = {}) {
  const { historical, activePendingIds } = opts;
  renderSelfState(r.selfStateSummary);
  if (r.followUp?.decision === 'interrupt') sysline(r.followUp.userNotice);
  if (r.kind === 'clarify') { sysline(r.question); return; }
  if (r.kind === 'gated') { return; }   // 조용히 무시된 외부 이벤트 — 사용자 화면에 남기지 않음
  if (r.kind === 'error') {
    const box = turnBox(); const who = el('who', 'GPAO-T5'); appendMessageTime(who, opts.recordedAt);
    box.appendChild(who);
    const message = failureMessage(r);
    box.appendChild(message); renderConversationRecovery(box, r, opts); return;
  }

  if (r.kind === 'approval') {
    const box = turnBox();
    // 승인은 카드 자체가 현재 상태다. 같은 내용을 별도 말풍선으로 반복하지 않는다.
    const card = el('card');
    card.appendChild(el('h4', '실행 전 승인이 필요해요'));
    // 승인 모드 표시는 제거했다(오너 결정 2026-08-03) — 세 모드가 같은 답을 내게 되면서
    // 사용자가 고를 수 있다고 믿는 죽은 버튼이 됐다. 마찰의 강도는 이제 헌장의 넷이 정한다.
    for (const p of r.pending) {
      const row = el('row');
      const cls = p.tier === 'A3' ? 'a3' : 'a2';
      // 내부 계약어(safetyFloor)는 화면에 그대로 노출하지 않는다 — 사용자 언어로 "꼭 확인"(감사 blocker).
      const floor = p.safetyFloor ? ' <span class="badge floor">꼭 확인</span>' : '';
      row.innerHTML = `· ${esc(p.label ?? p.action)} <span class="badge ${cls}">${esc(p.tier)}</span>${floor} — ${esc(p.preview?.impact ?? '')}`;
      card.appendChild(row);
      // P6-15: 왜 확인하는지 사용자 언어로. 개발자식 설명 금지.
      if (p.reason?.why) {
        const w = el('why'); w.innerHTML = `<b>왜 확인하나요</b> ${esc(p.reason.why)}`; card.appendChild(w);
      }
      // P6-7: send류는 어디에/무엇을을 사용자 언어로 분명히 보여준다(문장 전체가 아니라 분리된 내용).
      //
      // 2026-07-27 정정: 여기가 **도구 미리보기 계약(previewOf)의 `scope`·`duration` 을 안 그렸다.**
      // 계약도 데이터도 맞았는데 화면만 빠져서, 실측에서 모델이 작업 루트 이름을 경로에 또 넣어
      // `~/GPAO-T5/GPAO-T5/메모5.md` 에 파일이 생겼는데도 카드에는 `메모5.md 에 저장해요`만 떴다 —
      // 누르기 전에 알 길이 없었다. `local.process` 의 "끌 때까지 계속 돌아요(이 대화를 닫아도
      // 남아 있어요)" 도 같은 이유로 한 번도 화면에 못 나왔다. **소스가 아니라 산출물을 봐야 한다.**
      const 자리 = p.preview?.where ?? p.preview?.scope;
      const 기간 = p.preview?.duration;
      if (p.preview?.what != null || 자리 != null || 기간 != null) {
        const d = el('why');
        // 어디에 일어나는가 + 얼마나 지속되는가를 한 줄로. 승인 카드가 길어지면 기계적으로 누르게 된다.
        if (자리 != null) d.appendChild(el(null, `어디에: ${자리}${기간 != null ? ` · ${기간}` : ''}`));
        else if (기간 != null) d.appendChild(el(null, `얼마나: ${기간}`));
        if (p.preview.what != null) d.appendChild(el('pre', `무엇을: ${p.preview.what}`));
        card.appendChild(d);
      } else if (p.reason?.whatChanges) {
        const c = el('why'); c.innerHTML = `<b>무엇이 바뀌나요</b> ${esc(p.reason.whatChanges)}`; card.appendChild(c);
      }
      // 되돌릴 수 있는지 — reason 우선, 없으면 preview.cancel.
      const rev = p.reason?.reversible ?? p.preview?.cancel;
      if (rev) { const rv = el('why'); rv.innerHTML = `<b>되돌리기</b> ${esc(rev)}`; card.appendChild(rv); }
    }
    // 현재 결과인지와 승인이 살아 있는지는 다른 사실이다. 마지막 결과라도 서버의 활성 목록에서
    // 빠졌으면 만료·해소된 요청이다. historical은 비밀 입력면·제안의 현재성만 판단한다.
    const stillActive = approvalIsActive(r.pendingId, activePendingIds, historical);
    if (!stillActive) { card.appendChild(el('row hist', '지난 승인 요청')); box.appendChild(card); return; }
    const btns = el('btns');
    const yes = document.createElement('button'); yes.className = 'act primary'; yes.textContent = '승인';
    const no = document.createElement('button'); no.className = 'act no';
    // **모든 거절이 전송은 아니다.** 파일 저장·연결·실행에도 같은 버튼이 뜬다 —
    // '보내지 마' 는 보내는 일에만 맞는 말이다(실측 2026-07-28: 파일 저장 카드에 이 말이 떴다).
    no.textContent = '하지 마';
    // 승인·거절 뒤에도 **서버 사실로 다시 투영한다** — 부분적으로 DOM 카드만 고치면
    // 이번 턴이 무효화한 옛 카드가 화면에 그대로 남는다(G-1B 실측).
    yes.onclick = async () => { card.remove(); await turn({ approve: r.pendingId }); await 대화다시그리기(); await loadSessions(); };
    no.onclick = async () => { card.remove(); await turn({ reject: r.pendingId }); await 대화다시그리기(); await loadSessions(); };
    btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
    box.appendChild(card); return;
  }

  const box = turnBox();
  const who = el('who', 'GPAO-T5'); appendMessageTime(who, opts.recordedAt); box.appendChild(who);
  // 답변은 마크다운으로 그린다(원문 기호가 화면에 찍히지 않게). 안전은 renderMarkdown 이 진다 —
  // 먼저 전부 escape 하고 우리가 만든 태그만 넣는다(수집한 페이지의 HTML 이 섞여도 글자로 보인다).
  const 답문 = r.reply?.trim() ? r.reply : (r.nextSafeAction ?? '');
  // 모델이 구조화 후보만 제출한 턴은 제안 카드가 곧 응답이다. 빈 답 말풍선을 먼저 만들지 않는다.
  if (답문.trim()) {
    const bot = el('msg bot');
    if (Array.isArray(r.fileReferences) && r.fileReferences.length) {
      bot.dataset.t5FileReferences = JSON.stringify(r.fileReferences);
    }
    renderMarkdownInto(bot, 답문);
    box.appendChild(bot);
    appendMessageActions(box, 답문);
  }
  renderConversationRecovery(box, r, opts);
  renderConnectionHandoff(box, r, opts);
  renderArtifacts(box, r.artifacts);
  renderHumanEffects(box, r.humanEffects);
  renderRecord(box, r.ledger);
}

const CHAT_SECRET_PATTERNS = [
  /\bsk-(?:proj-|ant-)?[A-Za-z0-9_-]{16,}\b/u,
  /\bAIza[A-Za-z0-9_-]{20,}\b/u,
  /\b(?:ghp_|github_pat_)[A-Za-z0-9_]{16,}\b/u,
  /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/u,
];
function containsCredentialLikeText(value) {
  const textValue = String(value ?? '');
  return CHAT_SECRET_PATTERNS.some((pattern) => pattern.test(textValue));
}
function renderChatSecretBoundary() {
  document.getElementById('chat-secret-boundary')?.closest('.turn')?.remove();
  const box = turnBox(); box.appendChild(el('who', 'GPAO-T5'));
  const card = el('suggest'); card.id = 'chat-secret-boundary';
  card.appendChild(el('sug-t', '비밀값은 대화로 보내지 않았어요'));
  card.appendChild(el('sug-line', '내용은 저장하거나 모델에 전달하지 않았어요. 사용할 곳의 전용 연결 입력칸에 붙여 넣어 주세요.'));
  const buttons = el('btns');
  const model = document.createElement('button'); model.className = 'act primary'; model.textContent = '모델 연결 열기';
  model.onclick = () => openSettings('model');
  const messenger = document.createElement('button'); messenger.className = 'act no'; messenger.textContent = '메신저 연결 열기';
  messenger.onclick = () => openSettings('messenger');
  buttons.append(model, messenger); card.appendChild(buttons); box.appendChild(card);
}

let submitAdmissionInFlight = false;
async function submit() {
  if (submitAdmissionInFlight) return;
  const typed = text.value.trim();
  const t = typed || (stagedAttachments.length ? '첨부한 파일을 확인해줘.' : '');
  if (!t) return;
  if (containsCredentialLikeText(t)) {
    text.value = ''; text.style.height = 'auto';
    renderChatSecretBoundary();
    return;
  }
  submitAdmissionInFlight = true;
  const surfaceStartedAt = performance.now();
  let submittedSessionId;
  let sentAttachments;
  let turnStart;
  try {
    if (!currentSessionId) await newSession();
    submittedSessionId = currentSessionId;
    sentAttachments = [...stagedAttachments];
    turnStart = await startTurn(submittedSessionId, t, sentAttachments.map((record) => record.attachmentId));
  } catch (error) {
    submitAdmissionInFlight = false;
    if (error?.code === 'session_running') {
      toast('앞선 작업을 진행 중이에요. 입력한 내용은 그대로 두었습니다.');
      text.focus();
      return;
    }
    sysline('요청을 접수하지 못했어요. 입력한 내용은 그대로 두었습니다.');
    return;
  }
  const box = turnBox(); box.appendChild(el('who right', '사용자')); box.appendChild(el('msg me', t));
  renderMessageAttachments(box, sentAttachments);
  text.value = ''; text.style.height = 'auto'; document.body.classList.remove('nav-open');
  stagedAttachments = []; renderStagedAttachments();
  submitAdmissionInFlight = false;
  if (turnStart.admitted) {
    box.appendChild(el('trace', '진행 중인 작업에 반영하도록 받았어요.'));
    await loadSessions();
    return;
  }
  // P6-12: 스트림으로 조용한 작업 흐름을 보여주고, complete 시 지속된 결과를 렌더한다(끊겨도 진실은 세션에 남음).
  const trace = el('trace', '요청을 이해하고 있어요…');
  trace.id = 'session-activity-trace'; trace.dataset.sessionActivity = submittedSessionId;
  setActivityTrace(trace, '요청을 이해하고 있어요', Date.now());
  trace.hidden = true;
  box.appendChild(trace);
  // **멈춤**(F-5) — 한 턴이 수백 번 손을 쓸 수 있게 된 뒤로, 멈출 데가 없으면 사용자는
  // 자기 컴퓨터에서 벌어지는 일을 못 세운다. 문만 있고 누를 데가 없으면 없는 것과 같다.
  // 이미 한 일은 되돌리지 않는다 — 되돌리기는 사용자가 따로 말하는 별개의 일이다.
  const 멈춤 = makeSessionStopButton(submittedSessionId, trace);
  멈춤.hidden = false;
  box.appendChild(멈춤);
  const 멈춤치우기 = () => 멈춤.remove();
  const firstFeedbackPaint = afterVisiblePaint(surfaceStartedAt);
  scrollToBottom(true); // 내가 방금 보냈으니 무조건 따라간다(내용이 다 붙은 뒤에 스크롤)
  activeLocalTurns += 1;
  try {
    const streamed = await streamTurn(submittedSessionId, t, trace, {
      surfaceStartedAt, firstFeedbackPaint,
      start: turnStart,
    });
    const recovery = streamed.recovery;
    trace.remove();
    if (recovery) {
      renderRecovery(box, recovery);
      await streamed.reportComplete();
      await loadSessions();
      return;
    }
    // 스트림이 실행·지속한 그 결과를 **서버 사실로** 다시 투영한다(중복 실행 없음).
    // 덧붙이기만 하면 이번 턴이 무효화한 옛 승인 카드가 화면에 살아 남는다(G-1B 실측).
    // 통째로 갈아끼우므로 "따라 보고 있었는가"를 **미리** 재야 한다(아래 자리지키며 주석).
    if (currentSessionId === submittedSessionId) {
      await 자리지키며(async () => 대화투영(
        await (await fetch(`/sessions/${submittedSessionId}`)).json(),
      ));
    }
    await streamed.reportComplete();
    await loadSessions();
  } catch {
    trace.remove();
    sysline('연결에 문제가 있었어요. 잠시 후 다시 시도해 주세요.');
  } finally {
    activeLocalTurns = Math.max(0, activeLocalTurns - 1);
    멈춤치우기(); // 오류로 끝나도 버튼이 남지 않는다
  }
}

function renderRecovery(box, r) {
  box.appendChild(el('who', 'GPAO-T5'));
  box.appendChild(failureMessage({ reply: r.text || '처리 중 잠시 멈췄어요.', nextSafeAction: r.nextSafeAction }));
}

function failureMessage(result = {}) {
  const message = el('msg bot');
  message.appendChild(el('failure-reason', result.reply ?? '처리 중 문제가 생겼어요.'));
  if (result.nextSafeAction) {
    message.appendChild(el('failure-next', result.nextSafeAction));
  }
  return message;
}

// 진행 상태를 조용히 표시. 모델 사고 원문이 아니라 trace_status/tool_progress 등 사용자 언어 상태만.
// 사용자 원문은 POST 본문으로만 보내고(URL 노출 금지), streamId로만 구독한다(프라이버시).
function afterVisiblePaint(startedAt) {
  return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => resolve({
    elapsedMs: performance.now() - startedAt,
    visibilityState: ['visible', 'hidden', 'prerender'].includes(document.visibilityState)
      ? document.visibilityState : 'hidden',
  }))));
}

async function reportVisibleTiming(measurementId, event, sample) {
  if (!measurementId || !sample) return;
  await fetch('/turn/metrics/visible', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    keepalive: true,
    body: JSON.stringify({ measurementId, event, ...sample }),
  }).catch(() => {}); // 계측 실패가 대화 흐름을 막지 않는다
}

async function startTurn(sessionId, t, attachmentIds = []) {
  const response = await fetch('/turn/stream-start', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, text: t, attachmentIds }),
  });
  const result = await response.json();
  if (!response.ok || (!result.streamId && !result.admitted)) throw Object.assign(new Error('stream-start'), {
    code: result.code ?? 'stream_start_failed', status: response.status,
  });
  return result;
}

async function streamTurn(sessionId, t, trace, { surfaceStartedAt, firstFeedbackPaint, start }) {
  firstFeedbackPaint.then((sample) => reportVisibleTiming(start.measurementId, 'first_feedback_visible', sample));
  return new Promise((resolve, reject) => {
    const url = `/turn/stream?sessionId=${encodeURIComponent(sessionId)}&streamId=${encodeURIComponent(start.streamId)}`;
    const es = new EventSource(url);
    let done = false;
    let recovery = null;
    const showCurrent = (e, force = false) => { try {
      if (!force && trace.hidden) return;
      ensureActivityFeed(trace); setActivityTrace(trace, JSON.parse(e.data).text || '작업 중');
      if (force) trace.dataset.hasToolActivity = 'true';
      trace.hidden = false;
    } catch {} };
    es.addEventListener('trace_status', (e) => showCurrent(e, false));
    es.addEventListener('tool_progress', (e) => showCurrent(e, true));
    es.addEventListener('activity_event', (e) => { try {
      const fact = JSON.parse(e.data); appendActivityFact(trace, fact); markGrounded(); scrollToBottom();
    } catch {} });
    es.addEventListener('work_reality', (e) => {
      try { const reality = JSON.parse(e.data);
        if (reality.sessionId === sessionId) renderWorkReality(reality, { sessionId }); } catch {}
    });
    es.addEventListener('evidence_added', () => { if (!trace.hidden) setActivityTrace(trace, '근거를 정리하고 있어요'); });
    es.addEventListener('approval_required', () => { if (!trace.hidden) setActivityTrace(trace, '승인이 필요해요'); });
    es.addEventListener('capability_needed', () => { if (!trace.hidden) setActivityTrace(trace, '연결/준비가 필요해요'); });
    es.addEventListener('recoverable_error', (e) => {
      try {
        recovery = JSON.parse(e.data);
        setActivityTrace(trace, recovery.text || '처리 중 잠시 멈췄어요');
      } catch {
        recovery = { text: '처리 중 잠시 멈췄어요.', nextSafeAction: '잠시 후 다시 시도할까요?' };
      }
    });
    // P-STR-1: 답변 조각을 오는 대로 그린다(미리보기). 완료되면 지속된 결과로 **교체**한다 —
    // 미리보기는 진실이 아니다. 조각이 안 와도 동작은 같다(스트림 미지원 provider 등).
    let preview = null;
    let previewText = '';
    let firstGroundedReported = false;
    // P90-2: 확인된 중간 결과. 기다리는 동안 화면이 비어 있지 않게, **이미 일어난 사실만**
    // 쌓는다(성공 영수증의 사용자 문장 — 커널이 실행 뒤에만 내보낸다). 미리보기와 같은
    // 계약이다: 진행 중엔 보이고 완료되면 지속된 결과가 대체한다.
    let steps = null;
    const markGrounded = () => {
      if (firstGroundedReported) return;
      firstGroundedReported = true;
      afterVisiblePaint(surfaceStartedAt).then((sample) => reportVisibleTiming(
        start.measurementId, 'first_grounded_content', sample,
      ));
    };
    es.addEventListener('partial_result', (e) => {
      try {
        const { text } = JSON.parse(e.data);
        if (!text) return;
        if (!steps) {
          steps = document.createElement('div');
          steps.className = 'msg steps';
          trace.parentNode.insertBefore(steps, trace);
        }
        const line = document.createElement('div');
        line.textContent = text;          // OS 가 만든 문장 — 마크다운으로 해석하지 않는다
        steps.appendChild(line);
        markGrounded();                   // 확인된 사실이 화면에 닿은 순간이 첫 유용한 내용이다
        scrollToBottom();
      } catch {}
    });
    // **되돌린 답은 앞의 것을 지우고 다시 쓴다**(F-8). 이어붙이면 서로 어긋난 두 답이
    // 한 답으로 보인다 — 라이브에서 "터미널로 가져올게요" 뒤에 "직접 실행할 수는 없어요"가 붙었다.
    es.addEventListener('answer_reset', () => {
      previewText = '';
      if (preview) renderMarkdownInto(preview, '');
    });
    es.addEventListener('answer_delta', (e) => {
      try {
        const { text: piece } = JSON.parse(e.data);
        if (!piece) return;
        if (!preview) {
          trace.hidden = true;
          // 확인된 중간 결과는 **기다림을 채우는 것**이다. 답이 오기 시작하면 채울 공백이
          // 없으므로 자리를 내준다 — 남겨두면 같은 사실을 두 번 말하는 화면이 된다.
          steps?.remove(); steps = null;
          preview = document.createElement('div');
          // **최종 답과 같은 조**여야 한다(조각 A). `msg` 만 주면 마크다운 간격·말풍선이 안 붙어
          // 완료 순간 같은 글의 높이가 619.8px → 447.4px 로 튄다(실측 -27.8%). 읽던 줄이 달아난다.
          preview.className = 'msg bot';
          trace.parentNode.insertBefore(preview, trace);
        }
        previewText += piece;
        renderMarkdownInto(preview, previewText); // 최종 답변과 **같은 렌더러** — 흐르는 동안과 끝난 뒤가 같다
        markGrounded();
        scrollToBottom(); // 흐르는 동안 따라 내려간다(위로 올려 읽는 중이면 그대로 둔다)
      } catch {}
    });
    const completed = () => ({
      recovery,
      reportComplete: async () => reportVisibleTiming(
        start.measurementId, 'turn_complete', await afterVisiblePaint(surfaceStartedAt),
      ),
    });
    // 임시 표면은 **스트림이 끝나면** 걷는다. 완료만 끝이 아니다 — 끊긴 턴에서도 끝난다.
    // 철거를 완료 한 곳에만 걸면, 연결이 끊겼을 때 검증 안 된 미리보기 답과 확인 사실이
    // "연결에 문제가 있었어요" 아래에 그대로 눌러앉는다.
    const 임시표면정리 = () => { preview?.remove(); preview = null; steps?.remove(); steps = null; };
    es.addEventListener('complete', () => { done = true; 임시표면정리(); es.close(); resolve(completed()); });
    es.onerror = () => { 임시표면정리(); es.close(); done ? resolve(completed()) : reject(new Error('stream')); };
  });
}
attach.onclick = () => filepick.click();
filepick.onchange = () => uploadFiles(filepick.files);
const inbox = document.querySelector('.inbox');
for (const event of ['dragenter', 'dragover']) inbox.addEventListener(event, (e) => {
  e.preventDefault(); inbox.classList.add('drag');
});
for (const event of ['dragleave', 'drop']) inbox.addEventListener(event, (e) => {
  e.preventDefault(); inbox.classList.remove('drag');
});
inbox.addEventListener('drop', (e) => uploadFiles(e.dataTransfer?.files ?? []));
send.onclick = submit;
text.addEventListener('input', () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 160) + 'px'; });
text.addEventListener('paste', (event) => {
  const pasted = event.clipboardData?.getData('text/plain') ?? '';
  if (!containsCredentialLikeText(pasted)) return;
  event.preventDefault();
  renderChatSecretBoundary();
});
// Enter는 전송, Shift+Enter는 줄바꿈이다. 한글·일본어·중국어 IME는 마지막 글자를 조합 중인
// 상태로 둔 채 Enter keydown을 보내기도 한다. 그 Enter를 단순히 무시하면 브라우저가 줄바꿈을
// 넣고 사용자는 전송을 위해 Enter를 한 번 더 눌러야 한다. 조합 Enter의 기본 줄바꿈은 막되,
// compositionend 뒤 같은 Enter 의도를 정확히 한 번 전송으로 이어간다.
function installChatEnterBehavior(input, submitMessage) {
  let compositionActive = false;
  let submitAfterComposition = false;
  const finishCompositionSubmit = () => {
    if (!submitAfterComposition) return;
    submitAfterComposition = false;
    queueMicrotask(() => submitMessage());
  };
  input.addEventListener('compositionstart', () => { compositionActive = true; });
  input.addEventListener('compositionend', () => {
    compositionActive = false;
    finishCompositionSubmit();
  });
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' || event.shiftKey) return;
    event.preventDefault();
    if (event.isComposing || event.keyCode === 229 || compositionActive) {
      submitAfterComposition = true;
      return;
    }
    submitAfterComposition = false;
    submitMessage();
  });
  input.addEventListener('keyup', (event) => {
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
    finishCompositionSubmit();
  });
}
installChatEnterBehavior(text, submit);

// ── 첫 실행 온보딩 (P-ONB-2) ── 새 화면을 만들지 않는다. 모델 연결 패널을 펼쳐 두고
//   "무엇을 얻는지" 언어로 한 줄 안내 + 건너뛰기. 서버가 needed 를 판정한다(URL 쿼리 아님).
async function maybeRunOnboarding() {
  const ob = await (await fetch('/onboarding')).json().catch(() => null);
  if (!ob?.needed || !ob.canConnect) return false;
  await openSettings('model');
  const box = document.getElementById('modelConnect');
  if (box && !document.getElementById('obNote')) {
    const note = document.createElement('div');
    note.id = 'obNote';
    note.style.cssText = 'margin:0 0 6px; font-size:12px;';
    note.innerHTML = '<b>먼저 쓸 모델을 연결해요.</b> 하나만 연결하면 바로 대화를 시작할 수 있어요. '
      + '<button id="obSkip" style="font-size:11px; padding:1px 6px;">나중에 할게요</button>';
    box.prepend(note);
    document.getElementById('obSkip').onclick = async () => {
      await fetch('/onboarding/skip', { method: 'POST' });
      note.remove();
      closeSettings();
    };
  }
  return true;
}

// 연결 후 첫 인사 — 문구는 모델이 만든다(하드코딩 아님). 미연결이면 인사를 만들지 않는다.
async function maybeWelcome(sessionId) {
  const ob = await (await fetch('/onboarding')).json().catch(() => null);
  if (!ob || ob.seenWelcome) return;
  const conn = await (await fetch('/model/connection')).json().catch(() => null);
  if (!conn?.connected) return; // 인사를 지어내지 않는다(fail-closed)
  const r = await (await fetch('/welcome', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId }),
  })).json().catch(() => null);
  if (r?.state === 'greeted' && r.text) renderResult({ kind: 'reply', reply: r.text }, {});
}

// 초기화: 세션 목록 → 최근 세션 복원, 없으면 새로 만든다. 첫 실행이면 연결부터 안내한다.
(async () => {
  await refreshInitialModelStatus();
  const saved = savedPageState();
  try {
    const sequence = ++sessionLoadSequence;
    const loadingTimer = scheduleSessionSkeleton(sequence);
    let payload;
    try { payload = await (await fetch('/sessions')).json(); }
    finally { clearTimeout(loadingTimer); }
    const sessions = payload.sessions ?? [];
    const preferred = sessions.find((session) => session.id === saved?.sessionId) ?? sessions[0];
    if (preferred) await selectSession(preferred.id);
    else await newSession();
    await restorePageStateAfterReload(saved);
  } catch { await newSession(); }
  try {
    const directSettings = settingsSectionFromPath(window.location.pathname);
    if (directSettings) { await openSettings(directSettings, { updateHistory: false }); return; }
    const onboarding = await maybeRunOnboarding();
    if (!onboarding && currentSessionId) await maybeWelcome(currentSessionId);
  } catch { /* 온보딩 실패가 채팅을 막지 않는다 */ }
})();
</script>
