<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>월간 운영 현황</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f1e9; color: #17212b; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    main { width: 612px; min-height: 792px; padding: 56px; background: white; }
    h1 { margin: 0 0 28px; font-size: 34px; line-height: 1.25; }
    .grid { display: flex; gap: 18px; }
    .card { flex: 1; padding: 20px; border: 1px solid #ccd4dc; border-radius: 14px; }
    .label { color: #465566; font-size: 15px; }
    strong { display: block; margin-top: 8px; font-size: 28px; }
    p { margin-top: 30px; font-size: 17px; line-height: 1.7; word-break: keep-all; }
  </style>
</head>
<body>
  <main data-vd-artboard>
    <h1 data-vd-block>월간 운영 현황</h1>
    <section class="grid">
      <article class="card" data-vd-block><span class="label">확인한 주문</span><strong>128건</strong></article>
      <article class="card" data-vd-block><span class="label">재고 위험</span><strong>3개</strong></article>
    </section>
    <p data-vd-block>주문과 현재 재고를 실제 자료로 대조했습니다. 발주가 필요한 상품은 근거와 함께 다시 확인할 수 있습니다.</p>
  </main>
</body>
</html>
