<style>
  /* T3 구조적 DNA 계승 + T5 토큰 체계. 조용한 사이드바 · 넓은 채팅 · 하단 입력 · 접힌 고기능.
     CSS/레이아웃 craft는 OpenClaw ui/ 참고(간격 4px 리듬·모션 3단·웜 그림자·WCAG 대비)로 감각만
     흡수하고 T5 자기 토큰으로 재구성했다. 브랜드·토큰명·IA는 복제하지 않는다(UI/UX Seal §1.1). */
  :root {
    color-scheme: light dark;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --fs-xs:11.5px; --fs-sm:13px; --fs-md:13.5px; --fs-base:15px; --lh:1.55;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --dur-fast:110ms; --dur-normal:190ms; --dur-slow:300ms;
    --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    /* 색 — 라이트(웜 페이퍼), 기본. 상태색·강조·정보 위계를 분리한다. */
    --bg:#f4efe6; --surface:#faf6ef; --panel:#efe9dd; --elevated:#fffdf9; --hover:#ece4d6;
    --line:#e4dccb; --line-strong:#d7ccb6;
    --fg:#2b2823; --fg-strong:#191712; --muted:#857c6d; --faint:#b3aa98;
    --accent:#7c6f5b; --accent-ink:#faf6ef; --accent-glow:rgba(124,111,91,0.16); --accent-subtle:rgba(124,111,91,0.13);
    --info:#3f6f7a; --info-subtle:rgba(63,111,122,0.12);
    --me:#e5ebd6; --bot:#fffdf9;
    --warn:#b0692a; --warn-subtle:rgba(176,105,42,0.13);
    --ok:#4f9268; --danger:#a83a26; --danger-subtle:rgba(168,58,38,0.12); --dot:#4f9268;
    --sh-sm:0 1px 2px rgba(60,42,24,0.06); --sh-md:0 4px 14px rgba(60,42,24,0.08);
    --sh-lg:0 14px 34px rgba(60,42,24,0.11);
  }
  /* 색 — 다크(웜 다크). 간격·radius·모션 토큰은 공통. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#17140f; --surface:#1e1a14; --panel:#221d16; --elevated:#26211a; --hover:#2c261d;
      --line:#332c22; --line-strong:#3d3529;
      --fg:#eae3d4; --fg-strong:#f7f1e6; --muted:#9a9080; --faint:#6b6455;
      --accent:#cbb68e; --accent-ink:#17140f; --accent-glow:rgba(203,182,142,0.22); --accent-subtle:rgba(203,182,142,0.15);
      --info:#82b3c2; --info-subtle:rgba(130,179,194,0.15);
      --me:#2c3421; --bot:#1e1a14;
      --warn:#e0a458; --warn-subtle:rgba(224,164,88,0.16);
      --ok:#74c391; --danger:#e58063; --danger-subtle:rgba(229,128,99,0.16); --dot:#74c391;
      --sh-sm:0 1px 2px rgba(0,0,0,0.4); --sh-md:0 4px 16px rgba(0,0,0,0.45); --sh-lg:0 14px 34px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg:#17140f; --surface:#1e1a14; --panel:#221d16; --elevated:#26211a; --hover:#2c261d;
    --line:#332c22; --line-strong:#3d3529;
    --fg:#eae3d4; --fg-strong:#f7f1e6; --muted:#9a9080; --faint:#6b6455;
    --accent:#cbb68e; --accent-ink:#17140f; --accent-glow:rgba(203,182,142,0.22); --accent-subtle:rgba(203,182,142,0.15);
    --info:#82b3c2; --info-subtle:rgba(130,179,194,0.15);
    --me:#2c3421; --bot:#1e1a14;
    --warn:#e0a458; --warn-subtle:rgba(224,164,88,0.16);
    --ok:#74c391; --danger:#e58063; --danger-subtle:rgba(229,128,99,0.16); --dot:#74c391;
    --sh-sm:0 1px 2px rgba(0,0,0,0.4); --sh-md:0 4px 16px rgba(0,0,0,0.45); --sh-lg:0 14px 34px rgba(0,0,0,0.55);
  }
  :root[data-theme="light"] {
    --bg:#f4efe6; --surface:#faf6ef; --panel:#efe9dd; --elevated:#fffdf9; --hover:#ece4d6;
    --line:#e4dccb; --line-strong:#d7ccb6;
    --fg:#2b2823; --fg-strong:#191712; --muted:#857c6d; --faint:#b3aa98;
    --accent:#7c6f5b; --accent-ink:#faf6ef; --accent-glow:rgba(124,111,91,0.16); --accent-subtle:rgba(124,111,91,0.13);
    --info:#3f6f7a; --info-subtle:rgba(63,111,122,0.12);
    --me:#e5ebd6; --bot:#fffdf9;
    --warn:#b0692a; --warn-subtle:rgba(176,105,42,0.13);
    --ok:#4f9268; --danger:#a83a26; --danger-subtle:rgba(168,58,38,0.12); --dot:#4f9268;
    --sh-sm:0 1px 2px rgba(60,42,24,0.06); --sh-md:0 4px 14px rgba(60,42,24,0.08); --sh-lg:0 14px 34px rgba(60,42,24,0.11);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:var(--fs-base)/var(--lh) var(--font); display:flex; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* ── 사이드바 ── */
  #side { width:252px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100dvh; }
  .brand { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-4) var(--sp-4) var(--sp-3); }
  .brand .logo { width:24px; height:24px; border-radius:var(--r-sm); background:#fff;
    display:grid; place-items:center; box-shadow:var(--sh-sm); overflow:hidden; }
  .brand .logo img { width:18px; height:18px; display:block; }
  .brand b { font-weight:650; flex:1; color:var(--fg-strong); letter-spacing:-0.01em; }
  .brand .ic, .sidefoot .ic { color:var(--muted); cursor:pointer; font-size:15px;
    border:0; background:none; padding:2px 4px; font-family:inherit; }
  .nav { padding:var(--sp-1) var(--sp-2); }
  .nav a { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-sm);
    color:var(--muted); text-decoration:none; font-size:var(--fs-md); cursor:pointer;
    transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .nav a:hover { background:var(--hover); color:var(--fg); }
  .nav .em { width:16px; text-align:center; opacity:.75; }
  .newchat { margin:var(--sp-2) var(--sp-2) var(--sp-3); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:transparent; color:var(--fg); cursor:pointer; font:inherit;
    font-size:var(--fs-md); text-align:left; transition:background var(--dur-fast) var(--ease-out); }
  .newchat:hover { background:var(--hover); }
  .seclabel { padding:var(--sp-3) var(--sp-4) var(--sp-1); font-size:var(--fs-xs); color:var(--faint);
    letter-spacing:.04em; text-transform:uppercase; }
  .sessions { flex:1; overflow-y:auto; padding:0 var(--sp-2); }
  .sess { position:relative; display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-sm);
    cursor:pointer; font-size:var(--fs-md); transition:background var(--dur-fast) var(--ease-out); }
  .sess:hover { background:var(--hover); }
  .sess.active { background:var(--elevated); box-shadow:var(--sh-sm); }
  /* HRT-RF-004: 지금 말하고 있는 대화 하나를 조용히 표시한다. 배경 명도 차이만으로는
     밝은 테마나 제목이 많을 때 약해서 사용자가 목록을 다시 훑게 된다.
     신분은 여전히 aria-current 이고 이 선은 **시각 보조**다. 글자·배지를 만들지 않고,
     흐름에서 자리를 차지하지 않아 행 높이와 제목 말줄임 폭이 그대로다. */
  .sess.active::before { content:""; position:absolute; inset-inline-start:2px; top:50%;
    transform:translateY(-50%); width:2px; height:1.05em; border-radius:1px; background:var(--accent); }
  .sess .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg); }
  .sess .age { color:var(--faint); font-size:var(--fs-xs); flex:none; }
  /* P2-4a 목록 정리: 평소엔 조용히 있다가 마우스를 올리면 나타난다(설정판처럼 무겁지 않게) */
  .sess .pin { flex:none; font-size:12px; opacity:.85; }
  .sess .origin { flex:none; font-size:12px; opacity:.9; }
  /* **숨기지 않는다.** opacity:0 으로 감추면 hover 가 없는 터치 기기에서는 메뉴를 열 방법이 아예 없다.
     평소엔 옅게 두고 마우스를 올리거나 초점이 가면 또렷해진다. */
  .sess .more { flex:none; color:var(--faint); cursor:pointer; opacity:.5; padding:0 4px; font-size:14px; line-height:1;
    background:none; border:0; font-family:inherit; min-width:22px; min-height:22px; }
  .sess .more:focus-visible, .sess:focus-visible { opacity:1; outline:2px solid var(--accent, #8a7); outline-offset:1px; }
  .sess:hover .more, .sess.menu-open .more { opacity:1; }
  .sess .more:hover { color:var(--fg); }
  .sessmenu { position:absolute; z-index:40; background:var(--elevated); border:1px solid var(--line);
    border-radius:var(--r-sm); box-shadow:var(--sh-md); padding:4px; min-width:148px; font-size:var(--fs-sm); }
  .sessmenu button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg);
    padding:7px 10px; border-radius:var(--r-sm); cursor:pointer; font:inherit; }
  .sessmenu button:hover { background:var(--hover); }
  .sessmenu button.warn { color:var(--danger, #e5534b); }
  .sessmenu .sep { height:1px; background:var(--line); margin:4px 2px; }
  .listtabs { display:flex; gap:6px; padding:0 var(--sp-4) var(--sp-2); }
  .listtabs button { background:none; border:0; color:var(--faint); font:inherit; font-size:var(--fs-xs);
    cursor:pointer; padding:2px 6px; border-radius:var(--r-sm); }
  .listtabs button.on { color:var(--fg); background:var(--hover); }
  .listtabs .spacer { flex:1; }
  .selbar { display:flex; align-items:center; gap:6px; padding:4px var(--sp-4) var(--sp-2);
    font-size:var(--fs-xs); color:var(--muted); }
  /* class 규칙이 [hidden] 의 기본 display:none 을 이긴다 — 안 적으면 선택 바가 늘 떠 있다. */
  .selbar[hidden] { display:none; }
  .selbar .spacer { flex:1; }
  .selbar button { background:none; border:1px solid var(--line); color:var(--fg); font:inherit; font-size:var(--fs-xs);
    cursor:pointer; padding:3px 8px; border-radius:var(--r-sm); }
  .selbar button:hover { background:var(--hover); }
  .selbar button.warn { color:var(--danger, #e5534b); }
  .sess .chk { flex:none; width:14px; height:14px; margin-right:2px; accent-color:var(--dot, #7a8); }
  .sechead { display:flex; align-items:center; gap:6px; width:100%; background:none; border:0; cursor:pointer;
    color:var(--faint); font:inherit; font-size:var(--fs-xs); letter-spacing:.04em; padding:var(--sp-2) var(--sp-3) 4px; }
  .sechead:hover { color:var(--muted); }
  .sechead .chev { width:10px; }
  .sechead .lbl { flex:1; text-align:left; }
  .sechead .cnt { opacity:.7; }
  .toastbox { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px); z-index:60;
    background:var(--elevated); border:1px solid var(--line); box-shadow:var(--sh-md); color:var(--fg);
    padding:10px 14px; border-radius:var(--r-md); font-size:var(--fs-sm); max-width:min(520px, 92vw);
    opacity:0; pointer-events:none; transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .toastbox.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .sidefoot { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4);
    border-top:1px solid var(--line); color:var(--muted); }
  .sidefoot .dot { width:8px; height:8px; border-radius:var(--r-full); background:var(--dot); box-shadow:0 0 0 3px var(--accent-glow); }
  .sidefoot .ic { cursor:pointer; font-size:15px; transition:color var(--dur-fast) var(--ease-out); }
  .sidefoot .ic:hover { color:var(--fg); }
  .sidefoot .spacer { flex:1; }

  /* ── 본문 ── */
  #main { flex:1; display:flex; flex-direction:column; height:100dvh; min-width:0; background:var(--bg); }
  .crumb { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-3) var(--sp-5);
    border-bottom:1px solid var(--line); font-size:var(--fs-sm); color:var(--muted); }
  .crumb .sep { color:var(--faint); }
  .crumb .hb { display:none; margin-right:var(--sp-1); cursor:pointer; font-size:17px; }
  /* 크럼은 한 줄 — 좁아도 버튼 글자가 단어 중간에서 안 꺾이고(nowrap), 브레드크럼만 말줄임된다. */
  .crumb .bc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #searchbtn, #chip { white-space:nowrap; flex:none; }
  /* P6-18: 기억 찾기 진입 — 조용히(칩 옆). 결과는 "찾은 기억(반영 안 됨)"으로 명시. */
  #searchbtn { margin-left:auto; font:inherit; font-size:var(--fs-xs); color:var(--muted); background:var(--surface);
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:var(--sp-1) var(--sp-3); cursor:pointer;
    transition:border-color var(--dur-fast) var(--ease-out); }
  #searchbtn:hover { border-color:var(--accent); }
  #search { display:none; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--line); background:var(--panel); }
  #search .srow { display:flex; gap:var(--sp-2); }
  #search #q { flex:1; font:inherit; font-size:var(--fs-sm); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--surface); color:var(--fg); }
  #search #qgo { font:inherit; font-size:var(--fs-sm); padding:0 var(--sp-4); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--surface); color:var(--fg); cursor:pointer; }
  #qresults { margin-top:var(--sp-3); display:grid; gap:var(--sp-2); }
  /* 찾은 기억(반영 안 됨)=호박 · 반영됨=초록. 찾음≠반영을 색·문구로 못 박는다. */
  .qhit { border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:var(--r-md);
    padding:var(--sp-2) var(--sp-3); background:var(--surface); }
  .qhit.done { border-left-color:var(--ok); }
  .qhit .qh-tag { font-size:var(--fs-xs); font-weight:600; color:var(--warn); }
  .qhit.done .qh-tag { color:var(--ok); }
  .qhit .qh-src { font-size:var(--fs-xs); color:var(--faint); }
  .qhit .qh-body { font-size:var(--fs-sm); color:var(--fg); margin:2px 0; }
  .qhit .qh-act { font:inherit; font-size:var(--fs-xs); color:var(--accent); background:transparent;
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:0 var(--sp-2); margin-left:var(--sp-2); cursor:pointer; }
  #chip { margin-left:var(--sp-2); display:inline-flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-xs);
    color:var(--muted); cursor:pointer; border:1px solid var(--line-strong); border-radius:var(--r-full);
    padding:var(--sp-1) var(--sp-3); background:var(--surface);
    transition:border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  #chip::before { content:''; width:6px; height:6px; border-radius:var(--r-full); background:var(--ok); flex:none; }
  #chip:hover { border-color:var(--accent); }
  #chip.warn { color:var(--warn); border-color:var(--warn); }
  #chip.warn::before { background:var(--warn); }
  #state { display:none; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--line);
    font-size:var(--fs-sm); color:var(--muted); background:var(--panel); }
  /* P6-18: 조용한 상태 요약(읽기 전용). 각 항목이 "반영/가능"(on)과 "추정/추천/필요"(off)를 나눠 보인다. */
  #state #stateSelf { white-space:pre-wrap; }
  #state .ov { margin-top:var(--sp-3); display:grid; gap:var(--sp-3); grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  #state .ov-h { font-size:var(--fs-xs); color:var(--faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  #state .ov-row { font-size:var(--fs-sm); line-height:1.5; }
  #state .ov-on { color:var(--ok); font-weight:600; }   /* 반영 중 · 활성 · 받을 준비됨 */
  #state .ov-off { color:var(--warn); font-weight:600; } /* 추정됨 · 추천됨 · 연결 필요 · 실패 — 아직 반영/가능 아님 */
  #state .ov-k { color:var(--muted); }
  /* 조용한 액션(재전달·승인·확인). 읽기 전용 항목엔 없다. 누르면 항목이 '아직 아님'→'완료'로 이동. */
  #state .ov-act { font:inherit; font-size:var(--fs-xs); color:var(--accent); background:transparent;
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:0 var(--sp-2); margin-left:var(--sp-1);
    cursor:pointer; transition:background var(--dur-fast) var(--ease-out); }
  #state .ov-act:hover { background:var(--hover); }
  #state .ov-act:disabled { opacity:.5; cursor:default; }

  #log { flex:1; overflow-y:auto; padding:var(--sp-6) var(--sp-5); }
  .wrap { max-width:768px; margin:0 auto; display:flex; flex-direction:column; gap:var(--sp-5); }
  .turn { display:flex; flex-direction:column; gap:var(--sp-2); animation:rise var(--dur-normal) var(--ease-out); }
  @keyframes rise { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .msg { max-width:86%; padding:var(--sp-3) var(--sp-4); border-radius:var(--r-lg); white-space:pre-wrap; line-height:var(--lh); }
  /* 마크다운으로 그린 답변. **말풍선 안**이므로 문서가 아니라 대화처럼 보여야 한다 —
     제목이 커서 화면을 차지하거나 문단 사이가 벌어지면 채팅이 아니라 보고서로 읽힌다.
     블록을 직접 그리므로 pre-wrap 은 끈다(안 그러면 태그 사이 줄바꿈이 빈 줄로 보인다). */
  .msg.bot { white-space:normal; }
  .msg.bot > :first-child { margin-top:0; }
  .msg.bot > :last-child { margin-bottom:0; }
  .msg.bot p { margin:0 0 var(--sp-2); }
  .msg.bot h1, .msg.bot h2, .msg.bot h3,
  .msg.bot h4, .msg.bot h5, .msg.bot h6 { margin:var(--sp-3) 0 var(--sp-2); font-size:1em; font-weight:650; line-height:1.35; }
  .msg.bot h1 { font-size:1.15em; }
  .msg.bot h2 { font-size:1.08em; }
  .msg.bot ul, .msg.bot ol { margin:0 0 var(--sp-2); padding-left:1.35em; }
  .msg.bot li { margin:2px 0; }
  .msg.bot code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.92em;
                  background:rgba(127,127,127,0.16); padding:1px 4px; border-radius:4px; }
  .msg.bot pre { margin:0 0 var(--sp-2); padding:var(--sp-3); border-radius:var(--r-lg);
                 background:rgba(127,127,127,0.14); overflow-x:auto; }
  .msg.bot pre code { background:none; padding:0; font-size:0.88em; line-height:1.5; }
  .msg.bot blockquote { margin:0 0 var(--sp-2); padding-left:var(--sp-3);
                        border-left:3px solid rgba(127,127,127,0.35); opacity:0.9; }
  .msg.bot hr { border:0; border-top:1px solid rgba(127,127,127,0.25); margin:var(--sp-3) 0; }
  /* 표 (F-9) — 넓은 표는 말풍선 안에서 가로로만 민다. 색은 위 코드·인용과 같은 중립 틴트다. */
  .msg.bot table { border-collapse:collapse; margin:0 0 var(--sp-2); font-size:0.94em;
                   display:block; overflow-x:auto; max-width:100%; }
  .msg.bot th, .msg.bot td { border:1px solid rgba(127,127,127,0.3); padding:3px 10px;
                             text-align:left; vertical-align:top; }
  .msg.bot th { font-weight:650; background:rgba(127,127,127,0.12); }
  .msg.bot a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:var(--r-sm); }
  .who { font-size:var(--fs-xs); color:var(--faint); padding:0 var(--sp-1); }
  .who.right { align-self:flex-end; }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line);
    border-bottom-left-radius:var(--r-sm); box-shadow:var(--sh-sm); color:var(--fg); }
  .record { align-self:flex-start; }
  .record .head { display:inline-flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-sm); color:var(--muted);
    cursor:pointer; padding:var(--sp-1) var(--sp-1); border-radius:var(--r-sm); transition:color var(--dur-fast) var(--ease-out); }
  .record .head:hover { color:var(--fg); }
  .record .head .tw { transition:transform var(--dur-fast) var(--ease-out); display:inline-block; }
  .record .head.open .tw { transform:rotate(90deg); }
  .record .body { display:none; margin-top:var(--sp-2); padding:var(--sp-3) var(--sp-4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--panel); font-size:var(--fs-sm); color:var(--muted); white-space:pre-wrap; }
  .card { align-self:flex-start; max-width:86%; border:1px solid var(--line-strong); border-radius:var(--r-lg);
    padding:var(--sp-4) var(--sp-4); background:var(--elevated); box-shadow:var(--sh-md); animation:rise var(--dur-normal) var(--ease-out); }
  .card h4 { margin:0 0 var(--sp-2); font-size:var(--fs-md); color:var(--fg-strong); }
  .card .row { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0; line-height:1.6; }
  .card .row .cancel { color:var(--faint); }
  .card .row.hist { color:var(--faint); font-style:italic; }
  /* 권한 등급 배지 — 상태색으로 위계 분리(A2 승인 vs A3 강한 승인). */
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:var(--r-full); }
  .badge.a2 { background:var(--info-subtle); color:var(--info); }
  .badge.a3 { background:var(--danger-subtle); color:var(--danger); }
  .badge.floor { background:var(--warn-subtle); color:var(--warn); }
  /* P6-15: 조용한 승인 모드 표시 + 승인 이유(사용자 언어). 정책이 아니라 판단을 보여준다. */
  .card .mode { font-size:var(--fs-xs); color:var(--faint); margin-bottom:var(--sp-2); }
  .card .why { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0 var(--sp-1) var(--sp-4); line-height:1.6; }
  /* 적힐 내용은 **줄바꿈 그대로** 보여준다. textContent 로 넣으면 HTML 이 줄을 접어서
     목록 세 줄이 한 줄로 뭉개진다 — 승인 전에 읽을 수 없으면 보여준 게 아니다. */
  .card .why .pre { white-space:pre-wrap; word-break:break-word; }
  .card .why b { color:var(--fg); font-weight:600; }
  /* 기억 제안 — 조용한 info-톤, 대화를 막지 않는다. */
  .suggest { align-self:flex-start; max-width:86%; border:1px solid var(--line); border-left:3px solid var(--info);
    border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); background:var(--surface); animation:rise var(--dur-normal) var(--ease-out); }
  .suggest .sug-t { font-size:var(--fs-sm); color:var(--fg); }
  .suggest .sug-s { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0 var(--sp-2); }
  .suggest .btns { margin-top:var(--sp-2); display:flex; gap:var(--sp-2); }
  /* 확인된 중간 결과. **답변이 아니라 진행 중 사실**이므로 진행 표시(.trace)와 같은 조용한 조를
     쓴다 — 답과 같은 굵기·색이면 사용자는 같은 말을 두 번 들었다고 느낀다. */
  .msg.steps { align-self:flex-start; font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-1) var(--sp-3);
    border-left:2px solid var(--line); display:flex; flex-direction:column; gap:var(--sp-1); }
  .stopbtn { align-self:flex-start; font-size:var(--fs-sm); margin:0 var(--sp-3) var(--sp-1);
    padding:var(--sp-1) var(--sp-3); border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--muted); cursor:pointer; }
  .stopbtn:hover { color:var(--fg); }
  .stopbtn:disabled { opacity:.5; cursor:default; }
  .trace { align-self:flex-start; font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-1) var(--sp-3);
    display:flex; align-items:center; gap:var(--sp-2); opacity:0.9; }
  .trace::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
    animation:tpulse 1.1s var(--ease-out) infinite; }
  @keyframes tpulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  .sug-done { align-self:flex-start; font-size:var(--fs-sm); color:var(--muted); padding:0 var(--sp-1);
    display:flex; flex-direction:column; align-items:flex-start; gap:var(--sp-1); }
  .card .btns { margin-top:var(--sp-3); display:flex; gap:var(--sp-2); }
  button.act { border:1px solid var(--line-strong); color:var(--fg); background:var(--surface);
    border-radius:var(--r-md); padding:var(--sp-2) var(--sp-4); cursor:pointer; font:inherit; font-size:var(--fs-sm);
    transition:transform var(--dur-fast) var(--ease-spring), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
  button.act:active { transform:scale(0.97); }
  button.act.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.act.primary:hover { box-shadow:var(--sh-sm); }
  button.act.no { color:var(--muted); }
  button.act.no:hover { color:var(--fg); }

  /* ── 입력 ── */
  .composer { padding:var(--sp-3) var(--sp-5) var(--sp-4); border-top:1px solid var(--line); }
  .cwrap { max-width:768px; margin:0 auto; }
  .inbox { display:flex; align-items:flex-end; gap:var(--sp-2); border:1px solid var(--line-strong);
    border-radius:var(--r-lg); padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); background:var(--elevated);
    box-shadow:var(--sh-sm); transition:border-color var(--dur-normal) var(--ease-out), box-shadow var(--dur-normal) var(--ease-out); }
  .inbox:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  /* min-width:0 이 없으면 flex textarea 가 placeholder 폭만큼 최소너비를 잡아
     보내기 버튼을 화면 밖으로 밀어낸다(모바일 입력 잘림 회귀 지점). */
  #text { flex:1; min-width:0; resize:none; border:none; outline:none; background:transparent; color:var(--fg);
    font:inherit; max-height:160px; padding:var(--sp-1) 0; }
  #text::placeholder { color:var(--faint); }
  #send { flex:none; border:none; background:var(--accent); color:var(--accent-ink); border-radius:var(--r-md);
    padding:var(--sp-2) var(--sp-4); cursor:pointer; font:inherit; white-space:nowrap;
    transition:transform var(--dur-fast) var(--ease-spring); }
  #send:active { transform:scale(0.97); }
  .statusrow { max-width:768px; margin:var(--sp-2) auto 0; display:flex; align-items:center; gap:var(--sp-3);
    font-size:var(--fs-xs); color:var(--faint); padding:0 var(--sp-1); }
  .statusrow .spacer { flex:1; min-width:8px; }

  /* ── 도구함 (2.0-A) ── */
  #tbov, #setov { position:fixed; inset:0; z-index:30; display:none; background:rgba(0,0,0,0.28); }
  #tbov.open, #setov.open { display:block; }
  #tbpanel, #setpanel { position:absolute; top:0; right:0; height:100%; width:min(440px,100%); background:var(--surface);
    border-left:1px solid var(--line); box-shadow:var(--sh-lg); display:flex; flex-direction:column; }
  .tb-head { padding:var(--sp-5) var(--sp-5) var(--sp-3); border-bottom:1px solid var(--line); }
  .tb-head h2 { font-size:var(--fs-base); color:var(--fg-strong); display:flex; align-items:center; gap:var(--sp-2); }
  .tb-head .tb-x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:18px; background:none; border:none; }
  .tb-head p { font-size:var(--fs-sm); color:var(--muted); margin-top:var(--sp-1); }
  .tb-search { width:100%; margin-top:var(--sp-3); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--elevated); color:var(--fg); font:inherit; font-size:var(--fs-sm); }
  .tb-body { flex:1; overflow-y:auto; padding:var(--sp-3) var(--sp-4) var(--sp-6); }
  .tb-cat { font-size:var(--fs-xs); color:var(--faint); text-transform:none; margin:var(--sp-4) var(--sp-1) var(--sp-2); }
  .tb-card { border:1px solid var(--line); border-radius:var(--r-md); background:var(--elevated); padding:var(--sp-3);
    margin-bottom:var(--sp-2); cursor:pointer; transition:border-color var(--dur-fast) var(--ease-out); }
  .tb-card:hover { border-color:var(--line-strong); }
  .tb-row { display:flex; align-items:center; gap:var(--sp-2); }
  .tb-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .tb-dot.green { background:#6f9c5f; } .tb-dot.yellow { background:#c9a23b; }
  .tb-dot.red { background:#b5654a; } .tb-dot.gray { background:var(--faint); }
  .tb-name { font-size:var(--fs-sm); color:var(--fg-strong); }
  .tb-stat { margin-left:auto; font-size:var(--fs-xs); color:var(--muted); }
  .tb-badges { display:flex; flex-wrap:wrap; gap:var(--sp-1); margin-top:var(--sp-2); }
  .tb-badge { font-size:var(--fs-xs); color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r-full); padding:1px var(--sp-2); }
  .tb-detail { margin-top:var(--sp-2); padding-top:var(--sp-2); border-top:1px dashed var(--line);
    font-size:var(--fs-sm); color:var(--muted); display:none; }
  .tb-card.open .tb-detail { display:block; }
  .tb-detail .tb-axes { display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-2); font-size:var(--fs-xs); }
  .tb-hint { margin-top:var(--sp-2); font-size:var(--fs-xs); color:var(--fg); background:var(--accent-subtle);
    border-radius:var(--r-sm); padding:var(--sp-2); }
  .tb-card.focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
  .tb-empty { font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-4) var(--sp-1); }

  @media (max-width:720px) {
    #side { position:fixed; z-index:20; transform:translateX(-100%);
      transition:transform var(--dur-normal) var(--ease-out); box-shadow:var(--sh-lg); }
    body.nav-open #side { transform:translateX(0); }
    .crumb .hb { display:inline; }
    /* 모바일 크럼 압축: 앱 이름·구분자 숨겨 "Work Chat"만, 검색 버튼은 아이콘만 — 한 줄에 들어간다. */
    .crumb { padding:var(--sp-3) var(--sp-3); }
    .crumb .appn { display:none; }
    #searchbtn .sb-t { display:none; }
    #searchbtn { padding:var(--sp-1) var(--sp-2); }
    .composer { padding:var(--sp-2) var(--sp-3) var(--sp-4); }
    #log { padding:var(--sp-5) var(--sp-3); }
    #state, #search { padding-left:var(--sp-3); padding-right:var(--sp-3); }
    .statusrow .hint { display:none; }
    #tbpanel { width:100%; border-left:none; }
  }
</style>
</head>

<script type="module">
// 모델 답변은 **여기 하나로만** 그린다 — 스트리밍 미리보기와 최종 답변이 같은 경로를 쓴다.
import { renderMarkdownInto } from './markdown.js';
import { approvalIsActive, projectionOptions } from './approval-state.js';
const wrap = document.getElementById('wrap');
const chip = document.getElementById('chip');
const statePanel = document.getElementById('state');
const modelinfo = document.getElementById('modelinfo');
const text = document.getElementById('text');
const send = document.getElementById('send');
const sessionsEl = document.getElementById('sessions');
let currentSessionId = null;

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

document.querySelectorAll('[data-soon]').forEach((n) => {
  n.addEventListener('click', () => sysline(`${n.dataset.soon} 화면은 다음 단계에서 준비됩니다. 지금은 채팅으로 이어가 주세요.`));
});
document.getElementById('hb').onclick = () => document.body.classList.toggle('nav-open');
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
}
document.getElementById('theme').onclick = toggleTheme;
document.getElementById('newchat').onclick = () => newSession();
chip.onclick = async () => {
  const open = statePanel.style.display !== 'block';
  statePanel.style.display = open ? 'block' : 'none';
  // 열 때만 요약을 채운다(안티 대시보드). 모델 연결 **관리**는 설정 허브 한 곳에서만 —
  // 같은 기능을 두 화면에서 따로 관리하지 않는다(Pre-P-OP-7 UX Closure).
  if (open) { await refreshOverview(); renderModelSettingsLink(); }
};
function renderModelSettingsLink() {
  let l = document.getElementById('mcLink');
  if (l) return;
  l = document.createElement('div'); l.id = 'mcLink'; l.className = 'ov';
  l.innerHTML = '모델·메신저·연결·스킬 관리는 <a style="cursor:pointer; text-decoration:underline;">설정</a>에서 해요.';
  l.querySelector('a').onclick = () => { statePanel.style.display = 'none'; openSettings('model'); };
  statePanel.appendChild(l);
}

// ── 모델 연결 (P-RT-4 → P-ONB-2) ── 칩 패널에서 키를 연결한다. 서버가 "확실한 무효만 거절"을
//   보장한다: 확인된 것은 검증됨으로, 도달 못 한 것은 저장하되 "모델 확인 필요"로 표시한다.
//   응답엔 마스킹 키·사용자 언어만 온다(원본 키·원문 진단 없음). 안티 대시보드: 열 때만.
async function renderModelConnect(target) {
  let box = document.getElementById('modelConnect');
  if (!box) {
    box = document.createElement('div'); box.id = 'modelConnect'; box.className = 'ov';
    box.innerHTML = `
      <b>모델 연결</b>
      <div id="mcStatus" style="margin:4px 0;"></div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; margin:4px 0;">
        <select id="mcProvider">
          <option value="beai">BEAI</option>
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Claude</option>
          <option value="openai_compatible">호환 서버(직접 입력)</option>
        </select>
        <input id="mcKey" type="password" placeholder="API 키" autocomplete="off">
        <input id="mcModel" type="text" placeholder="모델(비우면 기본)">
        <input id="mcBase" type="text" placeholder="서버 주소" style="display:none;">
        <button id="mcConnect">연결</button>
        <button id="mcDisconnect">해제</button>
      </div>
      <div style="margin:4px 0;">
        <button id="mcChatgpt">ChatGPT 계정으로 연결</button>
        <span style="opacity:.7; font-size:11px;">공식 지원 방식이 아니에요 — 막히면 연결이 끊길 수 있어요.</span>
      </div>
      <div id="mcList" style="margin:4px 0;"></div>
      <div id="mcResult"></div>`;
    (target ?? statePanel).appendChild(box);
    box.querySelector('#mcProvider').onchange = (e) => {
      box.querySelector('#mcBase').style.display = e.target.value === 'openai_compatible' ? '' : 'none';
    };
    box.querySelector('#mcConnect').onclick = async () => {
      const body = {
        provider: box.querySelector('#mcProvider').value,
        key: box.querySelector('#mcKey').value,
        modelId: box.querySelector('#mcModel').value || undefined,
        baseUrl: box.querySelector('#mcBase').value || undefined,
      };
      box.querySelector('#mcResult').textContent = '확인 중…';
      const r = await (await fetch('/model/connect', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })).json();
      const rep = r.report ?? {};
      box.querySelector('#mcResult').textContent = [rep.userSafeSummary, rep.nextSafeAction].filter(Boolean).join(' ');
      if (r.connected) box.querySelector('#mcKey').value = ''; // 성공한 키는 화면에 남기지 않는다
      await refreshModelConnect();
    };
    box.querySelector('#mcChatgpt').onclick = async () => {
      const r = await (await fetch('/model/chatgpt/login', { method: 'POST' })).json();
      if (r.error) { box.querySelector('#mcResult').textContent = r.error; return; }
      box.querySelector('#mcResult').textContent = r.notice + ' (브라우저에서 승인해 주세요)';
      window.open(r.authorizeUrl, '_blank', 'noopener'); // 로그인은 사용자가 직접 한다
      const done = await (await fetch('/model/chatgpt/await', { method: 'POST' })).json();
      box.querySelector('#mcResult').textContent = [done.userSafeSummary, done.nextSafeAction].filter(Boolean).join(' ');
      await refreshModelConnect();
    };
    box.querySelector('#mcDisconnect').onclick = async () => {
      await fetch('/model/disconnect', { method: 'POST' });
      box.querySelector('#mcResult').textContent = '연결을 해제했어요.';
      await refreshModelConnect();
    };
  }
  if (target && box.parentNode !== target) target.appendChild(box); // 설정 허브로 이동(한 곳 관리)
  await refreshModelConnect();
}

// 보관 중인 연결 목록(P-ONB-1). 라디오=기본으로 쓸 모델, 각 항목에 해제. 여러 개일 때만 보인다.
async function renderConnectionList() {
  const box = document.getElementById('mcList');
  if (!box) return;
  const data = await (await fetch('/model/connections')).json().catch(() => null);
  const list = data?.connections ?? [];
  if (list.length < 2) { box.innerHTML = ''; return; } // 하나뿐이면 상태 줄로 충분(안티 대시보드)
  box.innerHTML = '<div style="opacity:.7; font-size:11px; margin-bottom:2px;">쓸 모델 고르기</div>';
  for (const c of list) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; gap:6px; margin:2px 0;';
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'mcActive'; radio.checked = !!c.active;
    radio.onchange = async () => {
      await fetch('/model/connections/activate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id }) });
      await refreshModelConnect();
    };
    const label = document.createElement('span');
    label.textContent = `${c.label}${c.keyMasked ? ` · ${c.keyMasked}` : ''}${c.unofficial ? ' · 공식 지원 아님' : ''}`;
    const del = document.createElement('button');
    del.textContent = '해제'; del.style.cssText = 'font-size:11px; padding:1px 6px;';
    del.onclick = async () => {
      await fetch('/model/connections/remove', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id }) });
      await refreshModelConnect();
    };
    row.append(radio, label, del);
    box.appendChild(row);
  }
}

async function refreshModelConnect() {
  const st = await (await fetch('/model/connection')).json().catch(() => null);
  await renderConnectionList();
  const el = document.getElementById('mcStatus');
  if (!el) return;
  if (!st || !st.connected) { el.textContent = '연결된 모델 없음 — 내장 안내 모드로 동작 중'; return; }
  const src = { user: '화면에서 연결', saved: '저장된 연결', env: '환경 설정', chatgpt_oauth: 'ChatGPT 계정' }[st.source] ?? st.source;
  el.textContent = `${st.provider} · ${st.modelId}${st.keyMasked ? ` · ${st.keyMasked}` : ''} (${src})`
    + (st.unofficial ? ' · 공식 지원 아님' : '');
}

// 첫 모델 응답을 기다리는 동안에도 저장된 연결 사실은 바로 보인다. 정적 stub 를 "준비됨"으로
// 그리면 실제 OAuth 모델이 연결된 제품이 몇 초 동안 데모처럼 보인다. 여기서는 연결만 말하고,
// usable/health 기반의 "준비됨" 판정은 기존 renderSelfState 가 첫 실제 턴 뒤에 맡는다.
async function refreshInitialModelStatus() {
  const st = await (await fetch('/model/connection')).json().catch(() => null);
  if (!st?.connected) {
    modelinfo.textContent = '연결된 모델 없음';
    chip.textContent = '연결 필요';
    chip.classList.add('warn');
    return;
  }
  modelinfo.textContent = `${st.modelId} · 연결됨`;
  chip.textContent = '연결됨';
  chip.classList.remove('warn');
}

// ── 기억 찾기 (P6-18) ── 과거 대화 검색. **결과는 "찾은 기억(반영 안 됨)".** 반영은 명시 admit(§6.16)만 —
//   찾았다고 답변 근거가 되지 않는다. 반영해야 이후 관련 대화에 좁게 쓰인다.
const searchPanel = document.getElementById('search');
const qInput = document.getElementById('q');
const qResults = document.getElementById('qresults');
const sbText = document.querySelector('#searchbtn .sb-t');
function toggleSearch(force) {
  const open = force ?? (searchPanel.style.display !== 'block');
  searchPanel.style.display = open ? 'block' : 'none';
  if (sbText) sbText.textContent = open ? ' 닫기' : ' 대화 찾기';
  document.getElementById('searchbtn').title = open ? '닫기' : '지난 대화 찾기';
  if (open) qInput.focus();
}
document.getElementById('searchbtn').onclick = () => toggleSearch();
document.getElementById('brandSearch').onclick = () => { document.body.classList.remove('nav-open'); toggleSearch(true); };
async function doSearch() {
  const query = qInput.value.trim();
  if (!query) return;
  qResults.textContent = '찾는 중…';
  try {
    const r = await (await fetch('/search', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query }) })).json();
    renderQResults(r.results || []);
  } catch { qResults.textContent = '검색에 실패했어요.'; }
}
document.getElementById('qgo').onclick = doSearch;
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

function renderQResults(results) {
  qResults.innerHTML = '';
  if (!results.length) { qResults.textContent = '찾은 대화가 없어요. 다른 말로 다시 찾아볼까요?'; return; }
  for (const r of results) {
    const card = el('qhit');
    const tag = el('qh-tag');
    const src = r.source || {};
    card.appendChild(tag);
    const srcEl = src.title ? el('qh-src', `대화: ${src.title}${src.role ? ` · ${src.role === 'user' ? '내 말' : 'T5'}` : ''}`) : null;
    if (srcEl) card.appendChild(srcEl);
    const bodyEl = el('qh-body', r.statement);
    card.appendChild(bodyEl);
    // 이동은 반영과 다른 행동이다 — 제목·본문 클릭은 그 대화로 가고, 반영·되돌리기는 버튼만 한다.
    const 이동 = async () => {
      if (!src.sessionId) { toast('이 결과의 원본 대화 정보가 없어요 — 내용은 "반영하기"로 지금 대화에 쓸 수 있어요.'); return; }
      const ok = await fetch('/sessions/' + src.sessionId).then((x) => x.ok).catch(() => false);
      if (!ok) { toast('그 대화가 지워졌거나 열 수 없어요 — 내용은 "반영하기"로 지금 대화에 쓸 수 있어요.'); return; }
      await selectSession(src.sessionId);
      toggleSearch(false);
    };
    for (const n of [srcEl, bodyEl]) if (n) { n.style.cursor = 'pointer'; n.title = '이 대화로 이동'; n.onclick = 이동; }
    const btn = document.createElement('button'); btn.className = 'qh-act';
    card.appendChild(btn);
    let admittedId = null;
    // 찾음(반영 안 됨) ↔ 반영됨 토글 — 반영하기가 있으면 되돌리기도 같은 수준.
    function setFound() {
      card.classList.remove('done'); tag.textContent = '찾은 대화 · 현재 대화에 반영 안 됨'; btn.textContent = '반영하기'; btn.disabled = false;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const a = await memAction('/search/admit', { statement: r.statement, source: src });
          // 되돌리기 id(candidateId)가 있을 때만 "반영됨"으로 — id 없이 반영됨으로 보이면 못 되돌린다(대칭 보장).
          if (a.admitted && a.candidateId) { admittedId = a.candidateId; setReflected(); } else btn.disabled = false;
        } catch { btn.disabled = false; }
      };
    }
    function setReflected() {
      card.classList.add('done'); tag.textContent = '반영됨 · 이제 관련 대화에 쓰여요'; btn.textContent = '되돌리기'; btn.disabled = false;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const g = await memAction('/memory/rollback', { candidateId: admittedId });
          if (g.rolledBack) setFound(); else btn.disabled = false; // 되돌리면 다시 "반영 안 됨"으로
        } catch { btn.disabled = false; }
      };
    }
    setFound();
    qResults.appendChild(card);
  }
}

  },

      for (const sk of skills ?? []) {

        if (sk.state === 'candidate' || sk.state === 'replay_required') {

    try {

        ? items.map((it) => `${esc(it[key])} ${pairs.map(([act, label]) => `<button class="ov-act" data-act="${esc(act)}" data-id="${esc(it.id)}">${esc(label)}</button>`).join('')}`).join('<br>')
        : '없음';
      rows.className = 'ov';

setov.onclick = (e) => { if (e.target === setov) closeSettings(); };

// P-OP-6 · **무효가 된 선언도 "없음"이 아니다.** 붙일 수 없게 된 사용자 선언을 이유와 함께
// 보여주고, 정리할 길을 준다(사용자가 만든 것은 사용자가 거둔다). 진실은 /connectors/truth 가 낸다.
async function renderInvalidDeclared() {
  let t;
  try { t = await (await fetch('/connectors/truth')).json(); } catch { return; }
  const 무효 = t.invalidDeclared ?? [];
  if (!무효.length) return;
  const box = mk('div', 'tb-card');
  box.appendChild(mk('div', 'tb-name', '지금은 붙일 수 없는 서비스'));
  for (const d of 무효) {
    const row = mk('div', 'tb-hint', `${d.label} — ${d.userSafe ?? '지금은 붙일 수 없어요'}`);
    const btn = document.createElement('button');
    btn.className = 'tb-test'; btn.textContent = '정리';
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const out = await (await fetch('/connectors/declared/remove', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: d.id }),
        })).json();
        if (out.ok) { toast(`${d.label} 선언을 정리했어요.`); box.remove(); await renderInvalidDeclared(); }
        else btn.disabled = false;
      } catch { btn.disabled = false; }
    };
    row.appendChild(btn);
    box.appendChild(row);
  }
  tbBody.appendChild(box);
}

// P5-1: 모르는 사람이 메신저로 말을 걸면 **여기서 허용**한다. 이게 없으면 처음 연결한 사용자가
// 자기 id 를 알아낼 방법이 없어 허용목록을 만들 수 없다(닭과 달걀). 내용은 저장하지 않는다 —
// 누가 언제 몇 번 말을 걸었는지만.
async function renderPendingSenders(target = tbBody) {
  let data;
  try { data = await (await fetch('/channels/allowlist?channel=telegram')).json(); } catch { return; }
  const pending = data.pending ?? [];
  const allowed = data.allowed ?? [];
  if (!pending.length && !allowed.length) return;
  const box = mk('div', 'tb-card');
  box.appendChild(mk('div', 'tb-name', '텔레그램에서 말을 건 사람'));
  if (pending.length) {
    for (const p of pending) {
      const row = mk('div', 'tb-hint', `${p.username ? '@' + p.username : 'id ' + p.userId} · ${p.count}번 시도 — 아직 받지 않았어요`);
      const btn = document.createElement('button');
      btn.className = 'tb-test'; btn.textContent = '이 사람 허용';
      btn.onclick = async () => {
        const out = await (await fetch('/channels/allowlist', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ channel: 'telegram', userId: p.userId, username: p.username }),
        })).json();
        if (out.userSafeSummary) toast(out.userSafeSummary);
        await renderPendingSenders(target);
      };
      row.appendChild(btn);
      box.appendChild(row);
    }
  }
  for (const a of allowed) {
    const row = mk('div', 'tb-hint', `${a.label ? a.label + ' · ' : ''}${a.username ? '@' + a.username : 'id ' + a.userId} — 받는 중`);
    const btn = document.createElement('button');

    btn.onclick = async () => {

    box.appendChild(row);
  }
  const old = document.getElementById('pendingSenders');
  if (old) old.remove();

}

function renderToolbox(q, focusId) {

    || (t.badges || []).some((b) => b.toLowerCase().includes(query)) || (t.category || '').toLowerCase().includes(query));
  tbBody.replaceChildren();
  if (!list.length) { tbBody.appendChild(mk('div', 'tb-empty', '조건에 맞는 도구가 없어요.')); return; }

  if (t.personal && t.testState !== 'passed') {

    const tb = document.createElement('button'); tb.className = 'act primary'; tb.textContent = '설정 확인';
    tb.style.marginTop = 'var(--sp-2)';

      else { d.appendChild(mk('div', 'tb-hint', `${r.reason ?? '테스트 실패'} ${r.nextSafeAction ?? ''}`.trim())); openToolbox(t.id); }

function el(cls, txt) { const d = document.createElement('div'); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; }
// 짧은 알림 — 무엇이 일어났고 되돌릴 수 있는지 한 줄로. 대화창을 알림 콘솔로 만들지 않는다.
let toastTimer;
function toast(text) {
  let box = document.getElementById('toast');
  if (!box) { box = el('toastbox'); box.id = 'toast'; document.body.appendChild(box); }
  box.textContent = text; box.classList.add('on');
  clearTimeout(toastTimer);

// 실제로 스크롤되는 건 #log 다(#wrap 은 안쪽 div — overflow 없음). 빈 상자에 scrollIntoView 를
// 걸면 내용이 붙기 전 위치로 가서 아무 일도 안 일어난다(오너 실사용에서 "머무른다"의 원인).
const logEl = document.getElementById('log');
/** 이미 아래쪽을 보고 있을 때만 따라간다 — 위로 올려 읽는 중이면 낚아채지 않는다. */
function nearBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120; }
function scrollToBottom(force = false) { if (force || nearBottom()) logEl.scrollTop = logEl.scrollHeight; }

/**
 * 대화를 **통째로 갈아끼울 때** 보던 자리를 지킨다.
 *
 * 실측(2026-08-03, 팀원): 답이 하나 끝날 때마다 화면이 맨 위 대화로 튀었다. `대화투영` 이
 * `wrap.innerHTML = ''` 로 전부 새로 그리면 스크롤이 0 이 되는데, 그 뒤에 부르는
 * `scrollToBottom()` 은 **새 DOM 을 재서** "사용자가 위쪽을 보고 있다"고 판정해 버린다.
 * 그래서 아무 것도 안 하고, 사용자는 맨 위에 남는다.
 *
 * 그러니 "따라 보고 있었는가"는 **갈아끼우기 전에** 재야 한다. 위로 올려 읽던 중이었다면
 * 그 자리를 되돌려 준다 — 읽던 곳을 잃는 것도 맨 위로 튀는 것만큼 나쁘다.
 */
async function 자리지키며(그리기) {
  const 따라보고있었다 = nearBottom();
  const 보던자리 = logEl.scrollTop;
  const r = await 그리기();
  if (따라보고있었다) logEl.scrollTop = logEl.scrollHeight;
  else logEl.scrollTop = Math.min(보던자리, logEl.scrollHeight);
  return r;
}
function add(node) { wrap.appendChild(node); scrollToBottom(); return node; }
function turnBox() { const t = el('turn'); add(t); return t; }

function relAge(ts) {
  if (!Number.isFinite(ts)) return '';   // 방어: 세션 아닌 파일이 섞여도 NaN 표시 안 함
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '지금'; if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}시간`;
  return `${Math.floor(h / 24)}일`;
}
// P2-4a: 목록 보기(대화 / 보관함 / 휴지통). 기본은 지운 것·숨긴 것이 빠진 목록이다.

  : listView === 'deleted' ? '/sessions?deleted=1' : '/sessions');

async function sessionAction(path, body) {

  const out = await r.json();
  if (out.userSafeSummary) toast(out.userSafeSummary);
  return out;
}

function closeSessMenu() {
  document.querySelectorAll('.sessmenu').forEach((m) => m.remove());
  document.querySelectorAll('.sess.menu-open').forEach((x) => x.classList.remove('menu-open'));
}

function openSessMenu(item, s, anchor) {
  closeSessMenu();
  item.classList.add('menu-open');
  const menu = el('sessmenu');
  menu.setAttribute('role', 'menu');
  const add = (label, fn, cls) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = async (ev) => { ev.stopPropagation(); closeSessMenu(); await fn(); await loadSessions(); };
    menu.appendChild(b);
  };
  if (s.deletedAt) {
    add('되돌리기', () => sessionAction('/sessions/restore', { sessionId: s.id }));
  } else {
    add('이름 바꾸기', async () => {
      const next = prompt('대화 이름', s.title || '');
      if (next === null) return;
      await sessionAction('/sessions/meta', { sessionId: s.id, title: next });
    });
    add(s.pinned ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기', () => sessionAction('/sessions/meta', { sessionId: s.id, pinned: !s.pinned }));
    add(s.archivedAt ? '목록으로 되돌리기' : '숨기기', () => sessionAction('/sessions/archive', { sessionId: s.id, archived: !s.archivedAt }));
    menu.appendChild(el('sep'));
    // 지우기는 휴지통으로 간다 — 무엇이 사라지고 무엇이 복구되는지는 서버 문구가 말한다(P2-3 계약).
    add('지우기', async () => {
      const out = await sessionAction('/sessions/delete', { sessionId: s.id });
      // 지금 열려 있는 대화를 지웠으면 빈 화면에 갇히지 않게 옮긴다. **곧바로 새 대화를 만들지
      // 않는다** — 지운 자리에 빈 대화가 생기면 "내용만 지워지고 목록엔 그대로"로 보인다.
      if (s.id === currentSessionId) {
        if (out.nextSessionId) await selectSession(out.nextSessionId);
        else await newSession();
      }
    }, 'warn');
  }
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${Math.min(r.bottom + 4, window.innerHeight - menu.offsetHeight - 8)}px`;
  menu.style.left = `${Math.max(8, r.right - menu.offsetWidth)}px`;
  setTimeout(() => document.addEventListener('click', closeSessMenu, { once: true }), 0);
}

// P2-4b 여러 개 정리. 선택은 화면 상태일 뿐 — 실제 판단·기록은 서버가 한다.
let selectMode = false;
const selected = new Set();
const selbar = document.getElementById('selbar');

function syncSelBar() {
  selbar.hidden = !selectMode;
  document.getElementById('selcount').textContent = `${selected.size}개 선택`;
}
function setSelectMode(on) {
  selectMode = on;
  if (!on) selected.clear();
  syncSelBar();
  loadSessions();
}
async function bulk(action) {
  if (!selected.size) { toast('먼저 정리할 대화를 골라 주세요.'); return; }
  const ids = [...selected];
  const out = await sessionAction('/sessions/bulk', { ids, action });
  // 지금 열려 있던 대화가 정리 대상이었으면 갈 곳으로 옮긴다(빈 화면에 갇히지 않게).
  if (ids.includes(currentSessionId)) {
    if (out.nextSessionId) await selectSession(out.nextSessionId);
    else await newSession();
  }
  setSelectMode(false);
}
document.getElementById('selectMode').onclick = () => setSelectMode(!selectMode);
document.getElementById('selCancel').onclick = () => setSelectMode(false);
document.getElementById('selArchive').onclick = () => bulk('archive');

// 정리 메뉴 — "전체 삭제"를 바로 노출하지 않는다. 무엇이 몇 개 정리되는지 먼저 말한다.
document.getElementById('tidyMenu').onclick = async (ev) => {
  ev.stopPropagation();
  closeSessMenu();
  const { sessions } = await (await fetch('/sessions')).json();
  const empty = sessions.filter((s) => (s.turns ?? 0) === 0 && s.id !== currentSessionId);
  const old = sessions.filter((s) => !s.pinned && Date.now() - s.updatedAt > 30 * 24 * 3600 * 1000);
  const menu = el('sessmenu'); menu.setAttribute('role', 'menu');
  const add = (label, fn) => {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = async (e) => { e.stopPropagation(); closeSessMenu(); await fn(); await loadSessions(); };
    menu.appendChild(b);
  };
  if (empty.length) add(`빈 대화 ${empty.length}개 지우기`, () => sessionAction('/sessions/bulk', { ids: empty.map((s) => s.id), action: 'delete' }));
  if (old.length) add(`30일 넘게 안 쓴 대화 ${old.length}개 숨기기`, () => sessionAction('/sessions/bulk', { ids: old.map((s) => s.id), action: 'archive' }));
  if (!empty.length && !old.length) add('정리할 게 없어요', async () => {});
  document.body.appendChild(menu);
  const r = ev.target.getBoundingClientRect();
  menu.style.top = `${r.bottom + 4}px`;
  menu.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 8))}px`;
  setTimeout(() => document.addEventListener('click', closeSessMenu, { once: true }), 0);

// 어느 메신저에서 온 대화인지 한눈에. 채널이 늘면 여기 한 줄씩(사례 전용 분기 금지).
const CHANNEL_ICON = { telegram: '✈️', 'slack.channel': '💼', slack: '💼', mail: '✉️' };

// 구역 접기 상태는 화면만의 일이라 브라우저에 남긴다(서버 왕복 없음).
const foldKey = (name) => `gpao-t5.fold.${name}`;
const isFolded = (name) => localStorage.getItem(foldKey(name)) === '1';
function sectionHeader(name, label, count, onToggle) {
  const h = document.createElement('button');
  h.className = 'sechead';
  h.setAttribute('aria-expanded', String(!isFolded(name)));
  h.innerHTML = '';
  h.appendChild(el('chev', isFolded(name) ? '▸' : '▾'));
  h.appendChild(el('lbl', label));
  h.appendChild(el('cnt', String(count)));
  h.onclick = () => {
    localStorage.setItem(foldKey(name), isFolded(name) ? '0' : '1');
    onToggle();
  };
  return h;
}

function sessionRow(s) {
  {
    const item = el('sess'); if (s.id === currentSessionId) item.classList.add('active');
    // 목록 항목은 실제로 누를 수 있는 것이다 — 키보드·보조기기에서도 그렇게 보여야 한다.
    item.setAttribute('role', 'button'); item.tabIndex = 0;
    item.setAttribute('aria-current', s.id === currentSessionId ? 'true' : 'false');
    if (selectMode) {
      const chk = document.createElement('input');
      chk.type = 'checkbox'; chk.className = 'chk'; chk.checked = selected.has(s.id);
      chk.setAttribute('aria-label', `${s.title || '새 대화'} 선택`);
      chk.onclick = (ev) => {
        ev.stopPropagation();
        if (chk.checked) selected.add(s.id); else selected.delete(s.id);
        syncSelBar();
      };
      item.appendChild(chk);
    }
    if (s.pinned) item.appendChild(el('pin', '📌'));
    // 메신저에서 시작된 대화는 화면에서 구분되어야 한다 — 어디서 온 말인지 모르면 헷갈린다(오너 지적).
    if (s.origin?.channel) {
      const mark = el('origin', CHANNEL_ICON[s.origin.channel] ?? '💬');
      mark.title = `${s.origin.channel}에서 온 대화`;
      item.appendChild(mark);
    }
    const t = el('t', s.title || '새 대화'); const age = el('age', relAge(s.updatedAt));
    const more = document.createElement('button');
    more.className = 'more'; more.textContent = '⋯';
    more.setAttribute('aria-label', `${s.title || '새 대화'} 관리`);
    more.onclick = (ev) => { ev.stopPropagation(); openSessMenu(item, s, more); };
    item.appendChild(t); item.appendChild(age); item.appendChild(more);
    item.onkeydown = (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); item.click(); }
    };
    // 선택 모드에서는 행을 눌러도 대화가 열리지 않는다 — 고르는 중이다.
    item.onclick = () => {
      if (selectMode) {
        const chk = item.querySelector('.chk');
        chk.checked = !chk.checked;
        if (chk.checked) selected.add(s.id); else selected.delete(s.id);
        syncSelBar();
        return;
      }
      // 지운 대화는 열 수 없다(서버도 404). 되돌린 뒤에 열린다.
      if (s.deletedAt) { toast('되돌린 뒤에 열 수 있어요.'); return; }
      selectSession(s.id);
    };
    return item;
  }
}

async function loadSessions() {
  const { sessions } = await (await fetch(listQuery())).json();
  sessionsEl.innerHTML = '';
  if (!sessions.length) {
    sessionsEl.appendChild(el('seclabel', listView === 'archived' ? '숨긴 대화가 없어요'
      : listView === 'deleted' ? '휴지통이 비어 있어요' : '대화가 없어요'));
    return;
  }
  // 즐겨찾기는 **같은 개념(pinned)의 구역 표현**이다 — "위에 두기"를 두 개 만들지 않는다.
  // 보관함·휴지통은 정리용 보기라 구역을 나누지 않는다(그 안에서 또 접으면 되레 헷갈린다).
  const fav = listView === 'active' ? sessions.filter((s) => s.pinned) : [];
  const rest = listView === 'active' ? sessions.filter((s) => !s.pinned) : sessions;

  if (fav.length) {
    sessionsEl.appendChild(sectionHeader('fav', '즐겨찾기', fav.length, loadSessions));
    if (!isFolded('fav')) for (const s of fav) sessionsEl.appendChild(sessionRow(s));
  }
  if (rest.length) {
    // 즐겨찾기가 없으면 굳이 "대화" 머리글로 한 줄 더 쓰지 않는다(빈 구역·군더더기 금지).
    if (fav.length) sessionsEl.appendChild(sectionHeader('rest', '대화', rest.length, loadSessions));
    if (!fav.length || !isFolded('rest')) for (const s of rest) sessionsEl.appendChild(sessionRow(s));
  }
}

document.getElementById('listtabs').onclick = async (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  listView = b.dataset.view;
  document.querySelectorAll('#listtabs button').forEach((x) => x.classList.toggle('on', x === b));
  await loadSessions();
