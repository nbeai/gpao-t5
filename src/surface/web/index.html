<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPAO-T5 · Work Chat</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb;
    --me:#e8f0fe; --bot:#f6f7f9; --accent:#2563eb; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --line:#262a30;
      --me:#1b2b4d; --bot:#171a1f; --accent:#5b9dff; --warn:#e0a458; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    display:flex; flex-direction:column; height:100dvh; }
  /* 안티 대시보드: 화면은 채팅이 전부. 상태는 작은 칩으로 접혀 있다. */
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header b { font-weight:600; }
  #chip { margin-left:auto; font-size:12px; color:var(--muted); cursor:pointer;
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:transparent; }
  #chip.warn { color:var(--warn); border-color:var(--warn); }
  #state { display:none; padding:8px 16px; border-bottom:1px solid var(--line);
    font-size:12px; color:var(--muted); white-space:pre-wrap; }
  #log { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(680px,92%); padding:10px 13px; border-radius:14px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .card { align-self:flex-start; max-width:min(680px,92%); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; background:var(--bot); }
  .card h4 { margin:0 0 6px; font-size:13px; }
  .card .row { font-size:13px; color:var(--muted); margin:2px 0; }
  .card .btns { margin-top:10px; display:flex; gap:8px; }
  button.act { border:1px solid var(--accent); color:var(--accent); background:transparent;
    border-radius:10px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button.act.no { border-color:var(--line); color:var(--muted); }
  .evi { font-size:12px; color:var(--muted); margin-top:4px; cursor:pointer; }
  .evi pre { margin:6px 0 0; padding:8px; background:var(--bot); border:1px solid var(--line);
    border-radius:8px; white-space:pre-wrap; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #text { flex:1; resize:none; border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font:inherit; background:transparent; color:var(--fg); }
  #send { border:none; background:var(--accent); color:#fff; border-radius:12px; padding:0 18px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <b>GPAO-T5</b>
    <span style="color:var(--muted);font-size:13px">Work Chat</span>
    <button id="chip" title="현재 상태 보기">준비됨</button>
  </header>
  <div id="state"></div>
  <div id="log"></div>
  <form id="f">
    <textarea id="text" rows="1" placeholder="말하면 일이 이어집니다…" autofocus></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
<script type="module">
const log = document.getElementById('log');
const chip = document.getElementById('chip');
const statePanel = document.getElementById('state');
const form = document.getElementById('f');
const text = document.getElementById('text');
let lastRunningTask = null;

chip.onclick = () => {
  statePanel.style.display = statePanel.style.display === 'block' ? 'none' : 'block';
};
function el(cls, txt) { const d = document.createElement('div'); d.className = cls; if (txt!=null) d.textContent = txt; return d; }
function add(node) { log.appendChild(node); log.scrollTop = log.scrollHeight; return node; }

function renderSelfState(s) {
  if (!s) return;
  const warn = s.modelAuthState !== 'usable' || (s.limits && s.limits.length);
  chip.textContent = s.modelAuthState === 'usable' ? '준비됨' : s.modelAuthState;
  chip.classList.toggle('warn', !!warn);
  const lines = [
    `모델: ${s.model} (${s.modelAuthState})`,
    `바로 쓰는 연결: ${s.ready.length ? s.ready.join(', ') : '없음'}`,
    s.limits && s.limits.length ? `막힌 것: ${s.limits.join(' · ')}` : null,
    s.nextSafeAction ? `다음: ${s.nextSafeAction}` : null,
  ].filter(Boolean);
  statePanel.textContent = lines.join('\n');
}

function renderLedger(node, ledger) {
  if (!ledger) return;
  const total = ledger.confirmed.length + ledger.unconfirmed.length + ledger.estimated.length;
  if (!total) return;
  const evi = el('evi', `근거 보기 (확인 ${ledger.confirmed.length} · 미확인 ${ledger.unconfirmed.length})`);
  const pre = document.createElement('pre'); pre.style.display = 'none';
  pre.textContent = [
    ledger.confirmed.length ? '확인: ' + ledger.confirmed.join('; ') : '',
    ledger.unconfirmed.length ? '미확인: ' + ledger.unconfirmed.join('; ') : '',
    ledger.estimated.length ? '추정: ' + ledger.estimated.join('; ') : '',
  ].filter(Boolean).join('\n');
  evi.onclick = () => { pre.style.display = pre.style.display === 'none' ? 'block' : 'none'; };
  evi.appendChild(pre); node.appendChild(evi);
}

async function turn(payload) {
  const res = await fetch('/turn', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(payload) });
  return res.json();
}

function renderResult(r) {
  renderSelfState(r.selfStateSummary);
  if (r.followUp) add(el('bot', r.followUp.userNotice));

  if (r.kind === 'clarify') { add(el('bot', r.question)); return; }
  if (r.kind === 'approval') {
    const card = el('card');
    card.appendChild(el('h4', '실행 전 승인이 필요해요'));
    for (const p of r.pending) {
      card.appendChild(el('row', `· ${p.label ?? p.action} [${p.tier}] — ${p.preview?.impact ?? ''} (${p.preview?.cancel ?? ''})`));
    }
    const btns = el('btns');
    const yes = el(''); yes.innerHTML = '<button class="act">승인</button>';
    const no = el(''); no.innerHTML = '<button class="act no">보내지 마</button>';
    yes.firstChild.onclick = async () => {
      card.remove();
      const done = await turn({ text: r.plan.understoodTask, approvedActions: r.pending.map(p=>p.action) });
      renderResult(done);
    };
    no.firstChild.onclick = () => { card.remove(); add(el('bot', '보내지 않았어요. 초안은 그대로 있어요.')); };
    btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
    add(card); return;
  }
  // reply
  const bot = add(el('bot', r.reply));
  if (r.nextSafeAction) bot.textContent += `\n\n다음: ${r.nextSafeAction}`;
  renderLedger(bot, r.ledger);
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const t = text.value.trim(); if (!t) return;
  add(el('msg me', t)); text.value = '';
  try { renderResult(await turn({ text: t, runningTask: lastRunningTask ?? undefined })); }
  catch { add(el('bot', '연결에 문제가 있었어요. 잠시 후 다시 시도해 주세요.')); }
};
text.addEventListener('keydown', (e) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
</script>
</body>
</html>
