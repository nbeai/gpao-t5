<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPAO-T5 · Work Chat</title>
<style>
  /* T3 구조적 DNA 계승 + T5 토큰 체계. 조용한 사이드바 · 넓은 채팅 · 하단 입력 · 접힌 고기능.
     CSS/레이아웃 craft는 OpenClaw ui/ 참고(간격 4px 리듬·모션 3단·웜 그림자·WCAG 대비)로 감각만
     흡수하고 T5 자기 토큰으로 재구성했다. 브랜드·토큰명·IA는 복제하지 않는다(UI/UX Seal §1.1). */
  :root {
    color-scheme: light dark;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --fs-xs:11.5px; --fs-sm:13px; --fs-md:13.5px; --fs-base:15px; --lh:1.55;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --dur-fast:110ms; --dur-normal:190ms; --dur-slow:300ms;
    --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    /* 색 — 라이트(웜 페이퍼), 기본. 상태색·강조·정보 위계를 분리한다. */
    --bg:#f4efe6; --surface:#faf6ef; --panel:#efe9dd; --elevated:#fffdf9; --hover:#ece4d6;
    --line:#e4dccb; --line-strong:#d7ccb6;
    --fg:#2b2823; --fg-strong:#191712; --muted:#857c6d; --faint:#b3aa98;
    --accent:#7c6f5b; --accent-ink:#faf6ef; --accent-glow:rgba(124,111,91,0.16); --accent-subtle:rgba(124,111,91,0.13);
    --info:#3f6f7a; --info-subtle:rgba(63,111,122,0.12);
    --me:#e5ebd6; --bot:#fffdf9;
    --warn:#b0692a; --warn-subtle:rgba(176,105,42,0.13);
    --ok:#4f9268; --danger:#a83a26; --danger-subtle:rgba(168,58,38,0.12); --dot:#4f9268;
    --sh-sm:0 1px 2px rgba(60,42,24,0.06); --sh-md:0 4px 14px rgba(60,42,24,0.08);
    --sh-lg:0 14px 34px rgba(60,42,24,0.11);
  }
  /* 색 — 다크(웜 다크). 간격·radius·모션 토큰은 공통. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#17140f; --surface:#1e1a14; --panel:#221d16; --elevated:#26211a; --hover:#2c261d;
      --line:#332c22; --line-strong:#3d3529;
      --fg:#eae3d4; --fg-strong:#f7f1e6; --muted:#9a9080; --faint:#6b6455;
      --accent:#cbb68e; --accent-ink:#17140f; --accent-glow:rgba(203,182,142,0.22); --accent-subtle:rgba(203,182,142,0.15);
      --info:#82b3c2; --info-subtle:rgba(130,179,194,0.15);
      --me:#2c3421; --bot:#1e1a14;
      --warn:#e0a458; --warn-subtle:rgba(224,164,88,0.16);
      --ok:#74c391; --danger:#e58063; --danger-subtle:rgba(229,128,99,0.16); --dot:#74c391;
      --sh-sm:0 1px 2px rgba(0,0,0,0.4); --sh-md:0 4px 16px rgba(0,0,0,0.45); --sh-lg:0 14px 34px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg:#17140f; --surface:#1e1a14; --panel:#221d16; --elevated:#26211a; --hover:#2c261d;
    --line:#332c22; --line-strong:#3d3529;
    --fg:#eae3d4; --fg-strong:#f7f1e6; --muted:#9a9080; --faint:#6b6455;
    --accent:#cbb68e; --accent-ink:#17140f; --accent-glow:rgba(203,182,142,0.22); --accent-subtle:rgba(203,182,142,0.15);
    --info:#82b3c2; --info-subtle:rgba(130,179,194,0.15);
    --me:#2c3421; --bot:#1e1a14;
    --warn:#e0a458; --warn-subtle:rgba(224,164,88,0.16);
    --ok:#74c391; --danger:#e58063; --danger-subtle:rgba(229,128,99,0.16); --dot:#74c391;
    --sh-sm:0 1px 2px rgba(0,0,0,0.4); --sh-md:0 4px 16px rgba(0,0,0,0.45); --sh-lg:0 14px 34px rgba(0,0,0,0.55);
  }
  :root[data-theme="light"] {
    --bg:#f4efe6; --surface:#faf6ef; --panel:#efe9dd; --elevated:#fffdf9; --hover:#ece4d6;
    --line:#e4dccb; --line-strong:#d7ccb6;
    --fg:#2b2823; --fg-strong:#191712; --muted:#857c6d; --faint:#b3aa98;
    --accent:#7c6f5b; --accent-ink:#faf6ef; --accent-glow:rgba(124,111,91,0.16); --accent-subtle:rgba(124,111,91,0.13);
    --info:#3f6f7a; --info-subtle:rgba(63,111,122,0.12);
    --me:#e5ebd6; --bot:#fffdf9;
    --warn:#b0692a; --warn-subtle:rgba(176,105,42,0.13);
    --ok:#4f9268; --danger:#a83a26; --danger-subtle:rgba(168,58,38,0.12); --dot:#4f9268;
    --sh-sm:0 1px 2px rgba(60,42,24,0.06); --sh-md:0 4px 14px rgba(60,42,24,0.08); --sh-lg:0 14px 34px rgba(60,42,24,0.11);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:var(--fs-base)/var(--lh) var(--font); display:flex; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* ── 사이드바 ── */
  #side { width:252px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100dvh; }
  .brand { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-4) var(--sp-4) var(--sp-3); }
  .brand .logo { width:24px; height:24px; border-radius:var(--r-sm); background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-size:12px; font-weight:700; box-shadow:var(--sh-sm); }
  .brand b { font-weight:650; flex:1; color:var(--fg-strong); letter-spacing:-0.01em; }
  .brand .ic { color:var(--muted); cursor:pointer; font-size:15px; }
  .nav { padding:var(--sp-1) var(--sp-2); }
  .nav a { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-sm);
    color:var(--muted); text-decoration:none; font-size:var(--fs-md); cursor:pointer;
    transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .nav a:hover { background:var(--hover); color:var(--fg); }
  .nav .em { width:16px; text-align:center; opacity:.75; }
  .newchat { margin:var(--sp-2) var(--sp-2) var(--sp-3); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:transparent; color:var(--fg); cursor:pointer; font:inherit;
    font-size:var(--fs-md); text-align:left; transition:background var(--dur-fast) var(--ease-out); }
  .newchat:hover { background:var(--hover); }
  .seclabel { padding:var(--sp-3) var(--sp-4) var(--sp-1); font-size:var(--fs-xs); color:var(--faint);
    letter-spacing:.04em; text-transform:uppercase; }
  .sessions { flex:1; overflow-y:auto; padding:0 var(--sp-2); }
  .sess { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-sm);
    cursor:pointer; font-size:var(--fs-md); transition:background var(--dur-fast) var(--ease-out); }
  .sess:hover { background:var(--hover); }
  .sess.active { background:var(--elevated); box-shadow:var(--sh-sm); }
  .sess .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg); }
  .sess .age { color:var(--faint); font-size:var(--fs-xs); flex:none; }
  .sidefoot { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4);
    border-top:1px solid var(--line); color:var(--muted); }
  .sidefoot .dot { width:8px; height:8px; border-radius:var(--r-full); background:var(--dot); box-shadow:0 0 0 3px var(--accent-glow); }
  .sidefoot .ic { cursor:pointer; font-size:15px; transition:color var(--dur-fast) var(--ease-out); }
  .sidefoot .ic:hover { color:var(--fg); }
  .sidefoot .spacer { flex:1; }

  /* ── 본문 ── */
  #main { flex:1; display:flex; flex-direction:column; height:100dvh; min-width:0; background:var(--bg); }
  .crumb { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-3) var(--sp-5);
    border-bottom:1px solid var(--line); font-size:var(--fs-sm); color:var(--muted); }
  .crumb .sep { color:var(--faint); }
  .crumb .hb { display:none; margin-right:var(--sp-1); cursor:pointer; font-size:17px; }
  /* 크럼은 한 줄 — 좁아도 버튼 글자가 단어 중간에서 안 꺾이고(nowrap), 브레드크럼만 말줄임된다. */
  .crumb .bc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #searchbtn, #chip { white-space:nowrap; flex:none; }
  /* P6-18: 기억 찾기 진입 — 조용히(칩 옆). 결과는 "찾은 기억(반영 안 됨)"으로 명시. */
  #searchbtn { margin-left:auto; font:inherit; font-size:var(--fs-xs); color:var(--muted); background:var(--surface);
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:var(--sp-1) var(--sp-3); cursor:pointer;
    transition:border-color var(--dur-fast) var(--ease-out); }
  #searchbtn:hover { border-color:var(--accent); }
  #search { display:none; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--line); background:var(--panel); }
  #search .srow { display:flex; gap:var(--sp-2); }
  #search #q { flex:1; font:inherit; font-size:var(--fs-sm); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--surface); color:var(--fg); }
  #search #qgo { font:inherit; font-size:var(--fs-sm); padding:0 var(--sp-4); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--surface); color:var(--fg); cursor:pointer; }
  #qresults { margin-top:var(--sp-3); display:grid; gap:var(--sp-2); }
  /* 찾은 기억(반영 안 됨)=호박 · 반영됨=초록. 찾음≠반영을 색·문구로 못 박는다. */
  .qhit { border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:var(--r-md);
    padding:var(--sp-2) var(--sp-3); background:var(--surface); }
  .qhit.done { border-left-color:var(--ok); }
  .qhit .qh-tag { font-size:var(--fs-xs); font-weight:600; color:var(--warn); }
  .qhit.done .qh-tag { color:var(--ok); }
  .qhit .qh-src { font-size:var(--fs-xs); color:var(--faint); }
  .qhit .qh-body { font-size:var(--fs-sm); color:var(--fg); margin:2px 0; }
  .qhit .qh-act { font:inherit; font-size:var(--fs-xs); color:var(--accent); background:transparent;
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:0 var(--sp-2); margin-left:var(--sp-2); cursor:pointer; }
  #chip { margin-left:var(--sp-2); display:inline-flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-xs);
    color:var(--muted); cursor:pointer; border:1px solid var(--line-strong); border-radius:var(--r-full);
    padding:var(--sp-1) var(--sp-3); background:var(--surface);
    transition:border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  #chip::before { content:''; width:6px; height:6px; border-radius:var(--r-full); background:var(--ok); flex:none; }
  #chip:hover { border-color:var(--accent); }
  #chip.warn { color:var(--warn); border-color:var(--warn); }
  #chip.warn::before { background:var(--warn); }
  #state { display:none; padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--line);
    font-size:var(--fs-sm); color:var(--muted); background:var(--panel); }
  /* P6-18: 조용한 상태 요약(읽기 전용). 각 항목이 "반영/가능"(on)과 "추정/추천/필요"(off)를 나눠 보인다. */
  #state #stateSelf { white-space:pre-wrap; }
  #state .ov { margin-top:var(--sp-3); display:grid; gap:var(--sp-3); grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  #state .ov-h { font-size:var(--fs-xs); color:var(--faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  #state .ov-row { font-size:var(--fs-sm); line-height:1.5; }
  #state .ov-on { color:var(--ok); font-weight:600; }   /* 반영 중 · 활성 · 받을 준비됨 */
  #state .ov-off { color:var(--warn); font-weight:600; } /* 추정됨 · 추천됨 · 연결 필요 · 실패 — 아직 반영/가능 아님 */
  #state .ov-k { color:var(--muted); }
  /* 조용한 액션(재전달·승인·확인). 읽기 전용 항목엔 없다. 누르면 항목이 '아직 아님'→'완료'로 이동. */
  #state .ov-act { font:inherit; font-size:var(--fs-xs); color:var(--accent); background:transparent;
    border:1px solid var(--line-strong); border-radius:var(--r-full); padding:0 var(--sp-2); margin-left:var(--sp-1);
    cursor:pointer; transition:background var(--dur-fast) var(--ease-out); }
  #state .ov-act:hover { background:var(--hover); }
  #state .ov-act:disabled { opacity:.5; cursor:default; }

  #log { flex:1; overflow-y:auto; padding:var(--sp-6) var(--sp-5); }
  .wrap { max-width:768px; margin:0 auto; display:flex; flex-direction:column; gap:var(--sp-5); }
  .turn { display:flex; flex-direction:column; gap:var(--sp-2); animation:rise var(--dur-normal) var(--ease-out); }
  @keyframes rise { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .msg { max-width:86%; padding:var(--sp-3) var(--sp-4); border-radius:var(--r-lg); white-space:pre-wrap; line-height:var(--lh); }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:var(--r-sm); }
  .who { font-size:var(--fs-xs); color:var(--faint); padding:0 var(--sp-1); }
  .who.right { align-self:flex-end; }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line);
    border-bottom-left-radius:var(--r-sm); box-shadow:var(--sh-sm); color:var(--fg); }
  .record { align-self:flex-start; }
  .record .head { display:inline-flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-sm); color:var(--muted);
    cursor:pointer; padding:var(--sp-1) var(--sp-1); border-radius:var(--r-sm); transition:color var(--dur-fast) var(--ease-out); }
  .record .head:hover { color:var(--fg); }
  .record .head .tw { transition:transform var(--dur-fast) var(--ease-out); display:inline-block; }
  .record .head.open .tw { transform:rotate(90deg); }
  .record .body { display:none; margin-top:var(--sp-2); padding:var(--sp-3) var(--sp-4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--panel); font-size:var(--fs-sm); color:var(--muted); white-space:pre-wrap; }
  .card { align-self:flex-start; max-width:86%; border:1px solid var(--line-strong); border-radius:var(--r-lg);
    padding:var(--sp-4) var(--sp-4); background:var(--elevated); box-shadow:var(--sh-md); animation:rise var(--dur-normal) var(--ease-out); }
  .card h4 { margin:0 0 var(--sp-2); font-size:var(--fs-md); color:var(--fg-strong); }
  .card .row { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0; line-height:1.6; }
  .card .row .cancel { color:var(--faint); }
  .card .row.hist { color:var(--faint); font-style:italic; }
  /* 권한 등급 배지 — 상태색으로 위계 분리(A2 승인 vs A3 강한 승인). */
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:var(--r-full); }
  .badge.a2 { background:var(--info-subtle); color:var(--info); }
  .badge.a3 { background:var(--danger-subtle); color:var(--danger); }
  .badge.floor { background:var(--warn-subtle); color:var(--warn); }
  /* P6-15: 조용한 승인 모드 표시 + 승인 이유(사용자 언어). 정책이 아니라 판단을 보여준다. */
  .card .mode { font-size:var(--fs-xs); color:var(--faint); margin-bottom:var(--sp-2); }
  .card .why { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0 var(--sp-1) var(--sp-4); line-height:1.6; }
  .card .why b { color:var(--fg); font-weight:600; }
  /* 기억 제안 — 조용한 info-톤, 대화를 막지 않는다. */
  .suggest { align-self:flex-start; max-width:86%; border:1px solid var(--line); border-left:3px solid var(--info);
    border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); background:var(--surface); animation:rise var(--dur-normal) var(--ease-out); }
  .suggest .sug-t { font-size:var(--fs-sm); color:var(--fg); }
  .suggest .sug-s { font-size:var(--fs-sm); color:var(--muted); margin:var(--sp-1) 0 var(--sp-2); }
  .suggest .btns { margin-top:var(--sp-2); display:flex; gap:var(--sp-2); }
  .trace { align-self:flex-start; font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-1) var(--sp-3);
    display:flex; align-items:center; gap:var(--sp-2); opacity:0.9; }
  .trace::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
    animation:tpulse 1.1s var(--ease-out) infinite; }
  @keyframes tpulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  .sug-done { align-self:flex-start; font-size:var(--fs-sm); color:var(--muted); padding:0 var(--sp-1);
    display:flex; flex-direction:column; align-items:flex-start; gap:var(--sp-1); }
  .card .btns { margin-top:var(--sp-3); display:flex; gap:var(--sp-2); }
  button.act { border:1px solid var(--line-strong); color:var(--fg); background:var(--surface);
    border-radius:var(--r-md); padding:var(--sp-2) var(--sp-4); cursor:pointer; font:inherit; font-size:var(--fs-sm);
    transition:transform var(--dur-fast) var(--ease-spring), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
  button.act:active { transform:scale(0.97); }
  button.act.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.act.primary:hover { box-shadow:var(--sh-sm); }
  button.act.no { color:var(--muted); }
  button.act.no:hover { color:var(--fg); }

  /* ── 입력 ── */
  .composer { padding:var(--sp-3) var(--sp-5) var(--sp-4); border-top:1px solid var(--line); }
  .cwrap { max-width:768px; margin:0 auto; }
  .inbox { display:flex; align-items:flex-end; gap:var(--sp-2); border:1px solid var(--line-strong);
    border-radius:var(--r-lg); padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); background:var(--elevated);
    box-shadow:var(--sh-sm); transition:border-color var(--dur-normal) var(--ease-out), box-shadow var(--dur-normal) var(--ease-out); }
  .inbox:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  .inbox .plus { color:var(--muted); font-size:18px; padding-bottom:2px; }
  /* min-width:0 이 없으면 flex textarea 가 placeholder 폭만큼 최소너비를 잡아
     보내기 버튼을 화면 밖으로 밀어낸다(모바일 입력 잘림 회귀 지점). */
  #text { flex:1; min-width:0; resize:none; border:none; outline:none; background:transparent; color:var(--fg);
    font:inherit; max-height:160px; padding:var(--sp-1) 0; }
  #text::placeholder { color:var(--faint); }
  #send { flex:none; border:none; background:var(--accent); color:var(--accent-ink); border-radius:var(--r-md);
    padding:var(--sp-2) var(--sp-4); cursor:pointer; font:inherit; white-space:nowrap;
    transition:transform var(--dur-fast) var(--ease-spring); }
  #send:active { transform:scale(0.97); }
  .statusrow { max-width:768px; margin:var(--sp-2) auto 0; display:flex; align-items:center; gap:var(--sp-3);
    font-size:var(--fs-xs); color:var(--faint); padding:0 var(--sp-1); }
  .statusrow .spacer { flex:1; min-width:8px; }

  /* ── 도구함 (2.0-A) ── */
  #tbov { position:fixed; inset:0; z-index:30; display:none; background:rgba(0,0,0,0.28); }
  #tbov.open { display:block; }
  #tbpanel { position:absolute; top:0; right:0; height:100%; width:min(440px,100%); background:var(--surface);
    border-left:1px solid var(--line); box-shadow:var(--sh-lg); display:flex; flex-direction:column; }
  .tb-head { padding:var(--sp-5) var(--sp-5) var(--sp-3); border-bottom:1px solid var(--line); }
  .tb-head h2 { font-size:var(--fs-base); color:var(--fg-strong); display:flex; align-items:center; gap:var(--sp-2); }
  .tb-head .tb-x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:18px; background:none; border:none; }
  .tb-head p { font-size:var(--fs-sm); color:var(--muted); margin-top:var(--sp-1); }
  .tb-search { width:100%; margin-top:var(--sp-3); padding:var(--sp-2) var(--sp-3); border:1px solid var(--line-strong);
    border-radius:var(--r-md); background:var(--elevated); color:var(--fg); font:inherit; font-size:var(--fs-sm); }
  .tb-body { flex:1; overflow-y:auto; padding:var(--sp-3) var(--sp-4) var(--sp-6); }
  .tb-cat { font-size:var(--fs-xs); color:var(--faint); text-transform:none; margin:var(--sp-4) var(--sp-1) var(--sp-2); }
  .tb-card { border:1px solid var(--line); border-radius:var(--r-md); background:var(--elevated); padding:var(--sp-3);
    margin-bottom:var(--sp-2); cursor:pointer; transition:border-color var(--dur-fast) var(--ease-out); }
  .tb-card:hover { border-color:var(--line-strong); }
  .tb-row { display:flex; align-items:center; gap:var(--sp-2); }
  .tb-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .tb-dot.green { background:#6f9c5f; } .tb-dot.yellow { background:#c9a23b; }
  .tb-dot.red { background:#b5654a; } .tb-dot.gray { background:var(--faint); }
  .tb-name { font-size:var(--fs-sm); color:var(--fg-strong); }
  .tb-stat { margin-left:auto; font-size:var(--fs-xs); color:var(--muted); }
  .tb-badges { display:flex; flex-wrap:wrap; gap:var(--sp-1); margin-top:var(--sp-2); }
  .tb-badge { font-size:var(--fs-xs); color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r-full); padding:1px var(--sp-2); }
  .tb-detail { margin-top:var(--sp-2); padding-top:var(--sp-2); border-top:1px dashed var(--line);
    font-size:var(--fs-sm); color:var(--muted); display:none; }
  .tb-card.open .tb-detail { display:block; }
  .tb-detail .tb-axes { display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-2); font-size:var(--fs-xs); }
  .tb-hint { margin-top:var(--sp-2); font-size:var(--fs-xs); color:var(--fg); background:var(--accent-subtle);
    border-radius:var(--r-sm); padding:var(--sp-2); }
  .tb-card.focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
  .tb-empty { font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-4) var(--sp-1); }

  @media (max-width:720px) {
    #side { position:fixed; z-index:20; transform:translateX(-100%);
      transition:transform var(--dur-normal) var(--ease-out); box-shadow:var(--sh-lg); }
    body.nav-open #side { transform:translateX(0); }
    .crumb .hb { display:inline; }
    /* 모바일 크럼 압축: 앱 이름·구분자 숨겨 "Work Chat"만, 검색 버튼은 아이콘만 — 한 줄에 들어간다. */
    .crumb { padding:var(--sp-3) var(--sp-3); }
    .crumb .appn { display:none; }
    #searchbtn .sb-t { display:none; }
    #searchbtn { padding:var(--sp-1) var(--sp-2); }
    .composer { padding:var(--sp-2) var(--sp-3) var(--sp-4); }
    #log { padding:var(--sp-5) var(--sp-3); }
    #state, #search { padding-left:var(--sp-3); padding-right:var(--sp-3); }
    .statusrow .hint { display:none; }
    #tbpanel { width:100%; border-left:none; }
  }
</style>
</head>
<body>
  <aside id="side">
    <div class="brand">
      <span class="logo">T5</span><b>GPAO-T5</b>
      <span class="ic" title="검색">⌕</span>
    </div>
    <div class="nav">
      <a data-soon="더 보기"><span class="em">▾</span>더 보기</a>
      <a data-soon="스킬"><span class="em">✦</span>스킬</a>
      <a data-soon="배운 작업"><span class="em">✎</span>배운 작업</a>
      <a id="nav-toolbox"><span class="em">🜁</span>연결</a>
      <a data-soon="자동화"><span class="em">◷</span>자동화</a>
    </div>
    <button class="newchat" id="newchat">＋ 새 대화</button>
    <div class="seclabel">세션</div>
    <div class="sessions" id="sessions"></div>
    <div class="sidefoot">
      <span class="dot" title="연결됨"></span>
      <span class="spacer"></span>
      <span class="ic" title="설정" data-soon="설정">⚙</span>
      <span class="ic" id="theme" title="테마">◐</span>
    </div>
  </aside>

  <main id="main">
    <div class="crumb">
      <span class="hb" id="hb">☰</span>
      <span class="bc"><span class="appn">GPAO-T5 <span class="sep">›</span> </span>Work Chat</span>
      <button id="searchbtn" title="과거 대화에서 기억 찾기">🔍<span class="sb-t"> 기억 찾기</span></button>
      <button id="chip" title="현재 상태 보기">준비됨</button>
    </div>
    <div id="state"></div>
    <div id="search">
      <div class="srow">
        <input id="q" placeholder="과거 대화에서 찾기 (예: 부오상회 견적)" />
        <button id="qgo">찾기</button>
      </div>
      <div id="qresults"></div>
    </div>
    <div id="log"><div class="wrap" id="wrap"></div></div>
    <div class="composer">
      <div class="cwrap">
        <div class="inbox">
          <span class="plus">＋</span>
          <textarea id="text" rows="1" placeholder="GPAO-T5에게 메시지 입력" autofocus></textarea>
          <button id="send">보내기</button>
        </div>
        <div class="statusrow">
          <span id="modelinfo">beai5-stub · 준비됨</span>
          <span class="spacer"></span>
          <span class="hint">말하면 일이 이어집니다</span>
        </div>
      </div>
    </div>
  </main>

  <div id="tbov">
    <div id="tbpanel">
      <div class="tb-head">
        <h2>🜁 도구함 <button class="tb-x" id="tb-x" title="닫기">✕</button></h2>
        <p>T5가 작업에 사용할 도구예요. 연결 상태는 실제 실행 상태와 같아요.</p>
        <input class="tb-search" id="tb-search" placeholder="도구 검색" />
      </div>
      <div class="tb-body" id="tb-body"></div>
    </div>
  </div>

<script type="module">
const wrap = document.getElementById('wrap');
const chip = document.getElementById('chip');
const statePanel = document.getElementById('state');
const modelinfo = document.getElementById('modelinfo');
const text = document.getElementById('text');
const send = document.getElementById('send');
const sessionsEl = document.getElementById('sessions');
let currentSessionId = null;

const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

document.querySelectorAll('[data-soon]').forEach((n) => {
  n.addEventListener('click', () => sysline(`${n.dataset.soon} 화면은 다음 단계에서 준비됩니다. 지금은 채팅으로 이어가 주세요.`));
});
document.getElementById('hb').onclick = () => document.body.classList.toggle('nav-open');
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
};
document.getElementById('newchat').onclick = () => newSession();
chip.onclick = async () => {
  const open = statePanel.style.display !== 'block';
  statePanel.style.display = open ? 'block' : 'none';
  // 열 때만 요약을 채운다(안티 대시보드 — 상시 폴링 없음).
  if (open) { await refreshOverview(); await renderModelConnect(); }
};

// ── 모델 연결 (P-RT-4 → P-ONB-2) ── 칩 패널에서 키를 연결한다. 서버가 "확실한 무효만 거절"을
//   보장한다: 확인된 것은 검증됨으로, 도달 못 한 것은 저장하되 "모델 확인 필요"로 표시한다.
//   응답엔 마스킹 키·사용자 언어만 온다(원본 키·원문 진단 없음). 안티 대시보드: 열 때만.
async function renderModelConnect() {
  let box = document.getElementById('modelConnect');
  if (!box) {
    box = document.createElement('div'); box.id = 'modelConnect'; box.className = 'ov';
    box.innerHTML = `
      <b>모델 연결</b>
      <div id="mcStatus" style="margin:4px 0;"></div>
      <div style="display:flex; flex-wrap:wrap; gap:4px; margin:4px 0;">
        <select id="mcProvider">
          <option value="beai">BEAI</option>
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Claude</option>
          <option value="openai_compatible">호환 서버(직접 입력)</option>
        </select>
        <input id="mcKey" type="password" placeholder="API 키" autocomplete="off">
        <input id="mcModel" type="text" placeholder="모델(비우면 기본)">
        <input id="mcBase" type="text" placeholder="서버 주소" style="display:none;">
        <button id="mcConnect">연결</button>
        <button id="mcDisconnect">해제</button>
      </div>
      <div style="margin:4px 0;">
        <button id="mcChatgpt">ChatGPT 계정으로 연결</button>
        <span style="opacity:.7; font-size:11px;">공식 지원 방식이 아니에요 — 막히면 연결이 끊길 수 있어요.</span>
      </div>
      <div id="mcList" style="margin:4px 0;"></div>
      <div id="mcResult"></div>`;
    statePanel.appendChild(box);
    box.querySelector('#mcProvider').onchange = (e) => {
      box.querySelector('#mcBase').style.display = e.target.value === 'openai_compatible' ? '' : 'none';
    };
    box.querySelector('#mcConnect').onclick = async () => {
      const body = {
        provider: box.querySelector('#mcProvider').value,
        key: box.querySelector('#mcKey').value,
        modelId: box.querySelector('#mcModel').value || undefined,
        baseUrl: box.querySelector('#mcBase').value || undefined,
      };
      box.querySelector('#mcResult').textContent = '확인 중…';
      const r = await (await fetch('/model/connect', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })).json();
      const rep = r.report ?? {};
      box.querySelector('#mcResult').textContent = [rep.userSafeSummary, rep.nextSafeAction].filter(Boolean).join(' ');
      if (r.connected) box.querySelector('#mcKey').value = ''; // 성공한 키는 화면에 남기지 않는다
      await refreshModelConnect();
    };
    box.querySelector('#mcChatgpt').onclick = async () => {
      const r = await (await fetch('/model/chatgpt/login', { method: 'POST' })).json();
      if (r.error) { box.querySelector('#mcResult').textContent = r.error; return; }
      box.querySelector('#mcResult').textContent = r.notice + ' (브라우저에서 승인해 주세요)';
      window.open(r.authorizeUrl, '_blank', 'noopener'); // 로그인은 사용자가 직접 한다
      const done = await (await fetch('/model/chatgpt/await', { method: 'POST' })).json();
      box.querySelector('#mcResult').textContent = [done.userSafeSummary, done.nextSafeAction].filter(Boolean).join(' ');
      await refreshModelConnect();
    };
    box.querySelector('#mcDisconnect').onclick = async () => {
      await fetch('/model/disconnect', { method: 'POST' });
      box.querySelector('#mcResult').textContent = '연결을 해제했어요.';
      await refreshModelConnect();
    };
  }
  await refreshModelConnect();
}

// 보관 중인 연결 목록(P-ONB-1). 라디오=기본으로 쓸 모델, 각 항목에 해제. 여러 개일 때만 보인다.
async function renderConnectionList() {
  const box = document.getElementById('mcList');
  if (!box) return;
  const data = await (await fetch('/model/connections')).json().catch(() => null);
  const list = data?.connections ?? [];
  if (list.length < 2) { box.innerHTML = ''; return; } // 하나뿐이면 상태 줄로 충분(안티 대시보드)
  box.innerHTML = '<div style="opacity:.7; font-size:11px; margin-bottom:2px;">쓸 모델 고르기</div>';
  for (const c of list) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; gap:6px; margin:2px 0;';
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'mcActive'; radio.checked = !!c.active;
    radio.onchange = async () => {
      await fetch('/model/connections/activate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id }) });
      await refreshModelConnect();
    };
    const label = document.createElement('span');
    label.textContent = `${c.label}${c.keyMasked ? ` · ${c.keyMasked}` : ''}${c.unofficial ? ' · 공식 지원 아님' : ''}`;
    const del = document.createElement('button');
    del.textContent = '해제'; del.style.cssText = 'font-size:11px; padding:1px 6px;';
    del.onclick = async () => {
      await fetch('/model/connections/remove', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id }) });
      await refreshModelConnect();
    };
    row.append(radio, label, del);
    box.appendChild(row);
  }
}

async function refreshModelConnect() {
  const st = await (await fetch('/model/connection')).json().catch(() => null);
  await renderConnectionList();
  const el = document.getElementById('mcStatus');
  if (!el) return;
  if (!st || !st.connected) { el.textContent = '연결된 모델 없음 — 내장 안내 모드로 동작 중'; return; }
  const src = { user: '화면에서 연결', saved: '저장된 연결', env: '환경 설정', chatgpt_oauth: 'ChatGPT 계정' }[st.source] ?? st.source;
  el.textContent = `${st.provider} · ${st.modelId}${st.keyMasked ? ` · ${st.keyMasked}` : ''} (${src})`
    + (st.unofficial ? ' · 공식 지원 아님' : '');
}

// ── 기억 찾기 (P6-18) ── 과거 대화 검색. **결과는 "찾은 기억(반영 안 됨)".** 반영은 명시 admit(§6.16)만 —
//   찾았다고 답변 근거가 되지 않는다. 반영해야 이후 관련 대화에 좁게 쓰인다.
const searchPanel = document.getElementById('search');
const qInput = document.getElementById('q');
const qResults = document.getElementById('qresults');
document.getElementById('searchbtn').onclick = () => {
  const open = searchPanel.style.display !== 'block';
  searchPanel.style.display = open ? 'block' : 'none';
  if (open) qInput.focus();
};
async function doSearch() {
  const query = qInput.value.trim();
  if (!query) return;
  qResults.textContent = '찾는 중…';
  try {
    const r = await (await fetch('/search', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ query }) })).json();
    renderQResults(r.results || []);
  } catch { qResults.textContent = '검색에 실패했어요.'; }
}
document.getElementById('qgo').onclick = doSearch;
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

function renderQResults(results) {
  qResults.innerHTML = '';
  if (!results.length) { qResults.textContent = '찾은 기억이 없어요.'; return; }
  for (const r of results) {
    const card = el('qhit');
    const tag = el('qh-tag');
    const src = r.source || {};
    card.appendChild(tag);
    if (src.title) card.appendChild(el('qh-src', `대화: ${src.title}${src.role ? ` · ${src.role === 'user' ? '내 말' : 'T5'}` : ''}`));
    card.appendChild(el('qh-body', r.statement));
    const btn = document.createElement('button'); btn.className = 'qh-act';
    card.appendChild(btn);
    let admittedId = null;
    // 찾음(반영 안 됨) ↔ 반영됨 토글 — 반영하기가 있으면 되돌리기도 같은 수준.
    function setFound() {
      card.classList.remove('done'); tag.textContent = '찾은 기억 · 반영 안 됨'; btn.textContent = '반영하기'; btn.disabled = false;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const a = await (await fetch('/search/admit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ statement: r.statement, source: src }) })).json();
          // 되돌리기 id(candidateId)가 있을 때만 "반영됨"으로 — id 없이 반영됨으로 보이면 못 되돌린다(대칭 보장).
          if (a.admitted && a.candidateId) { admittedId = a.candidateId; setReflected(); } else btn.disabled = false;
        } catch { btn.disabled = false; }
      };
    }
    function setReflected() {
      card.classList.add('done'); tag.textContent = '반영됨 · 이제 관련 대화에 쓰여요'; btn.textContent = '되돌리기'; btn.disabled = false;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const g = await (await fetch('/memory/rollback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ candidateId: admittedId }) })).json();
          if (g.rolledBack) setFound(); else btn.disabled = false; // 되돌리면 다시 "반영 안 됨"으로
        } catch { btn.disabled = false; }
      };
    }
    setFound();
    qResults.appendChild(card);
  }
}

// ── 도구함 (2.0-A) — 실제 /toolbox 상태만 보여준다(없는 도구 안 만듦, 죽은 버튼 없음). ──
const tbov = document.getElementById('tbov');
const tbBody = document.getElementById('tb-body');
const tbSearch = document.getElementById('tb-search');
let tbTools = [];
const mk = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

async function openToolbox(focusId) {
  tbov.classList.add('open');
  document.body.classList.remove('nav-open');
  tbBody.replaceChildren(mk('div', 'tb-empty', '불러오는 중…'));
  try {
    const r = await (await fetch('/toolbox')).json();
    tbTools = r.tools || [];
    renderToolbox('', focusId);
    if (!focusId) tbSearch.focus();
  } catch { tbBody.replaceChildren(mk('div', 'tb-empty', '도구 목록을 불러오지 못했어요.')); }
}
function closeToolbox() { tbov.classList.remove('open'); }

function renderToolbox(q, focusId) {
  const query = (q || '').trim().toLowerCase();
  const list = tbTools.filter((t) => !query || t.label.toLowerCase().includes(query)
    || (t.badges || []).some((b) => b.toLowerCase().includes(query)) || (t.category || '').toLowerCase().includes(query));
  tbBody.replaceChildren();
  if (!list.length) { tbBody.appendChild(mk('div', 'tb-empty', '조건에 맞는 도구가 없어요.')); return; }
  let focusCard = null;
  for (const cat of [...new Set(list.map((t) => t.category))]) {
    tbBody.appendChild(mk('div', 'tb-cat', cat));
    for (const t of list.filter((x) => x.category === cat)) {
      const card = toolCard(t);
      if (t.id === focusId) { card.classList.add('open', 'focus'); focusCard = card; }
      tbBody.appendChild(card);
    }
  }
  if (focusCard) requestAnimationFrame(() => focusCard.scrollIntoView({ block: 'center' }));
}
function toolCard(t) {
  const card = mk('div', 'tb-card');
  const row = mk('div', 'tb-row');
  row.appendChild(mk('span', 'tb-dot ' + t.statusDot));
  row.appendChild(mk('span', 'tb-name', t.label));
  row.appendChild(mk('span', 'tb-stat', t.userStatus));
  card.appendChild(row);
  const badges = mk('div', 'tb-badges');
  for (const b of t.badges || []) badges.appendChild(mk('span', 'tb-badge', b));
  card.appendChild(badges);
  const d = mk('div', 'tb-detail');
  d.appendChild(mk('div', null, t.blurb));
  const axes = mk('div', 'tb-axes');
  axes.appendChild(mk('div', null, '연결: ' + (t.connected ? '연결됨' : '연결 안 됨')));
  axes.appendChild(mk('div', null, '실행: ' + (t.executable ? '실행 가능' : '실행 준비 안 됨')));
  if (t.needsApproval) axes.appendChild(mk('div', null, '보내기·실행 전에 확인받아요'));
  if (t.sourceLedgerRequired) axes.appendChild(mk('div', null, '출처를 남겨요'));
  d.appendChild(axes);
  if (t.connectHint) d.appendChild(mk('div', 'tb-hint', t.connectHint)); // 2.0-B 연결 준비 안내(죽은 버튼 아님)
  // 2.0-C: 개인 도구가 아직 테스트 통과 전이면 설정 확인 버튼(실제 동작, 죽은 버튼 아님). 통과해야 사용 가능.
  if (t.personal && t.testState !== 'passed') {
    // 이 슬라이스의 확인은 실제 실행이 아니라 필수 설정 완비 점검이다 → "설정 확인"(오해 방지). 진짜 실행 테스트는 후속.
    const tb = document.createElement('button'); tb.className = 'act primary'; tb.textContent = '설정 확인';
    tb.style.marginTop = 'var(--sp-2)';
    tb.onclick = async (e) => {
      e.stopPropagation();
      const r = await (await fetch(`/personal-tools/${t.id}/test`, { method: 'POST' })).json();
      if (r.ok) { openToolbox(t.id); } // 통과 → 상태 새로고침(사용 가능으로)
      else { d.appendChild(mk('div', 'tb-hint', `${r.reason ?? '테스트 실패'} ${r.nextSafeAction ?? ''}`.trim())); openToolbox(t.id); }
    };
    d.appendChild(tb);
  }
  card.appendChild(d);
  card.onclick = () => card.classList.toggle('open');
  return card;
}
document.getElementById('nav-toolbox').onclick = openToolbox;
document.getElementById('tb-x').onclick = closeToolbox;
tbov.onclick = (e) => { if (e.target === tbov) closeToolbox(); };
tbSearch.oninput = () => renderToolbox(tbSearch.value);

function el(cls, txt) { const d = document.createElement('div'); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; }
function add(node) { wrap.appendChild(node); node.scrollIntoView({ block: 'end' }); return node; }
function turnBox() { const t = el('turn'); add(t); return t; }
function sysline(t) { const b = turnBox(); b.appendChild(el('who', 'GPAO-T5')); b.appendChild(el('msg bot', t)); }

// ── 세션 ──
function relAge(ts) {
  if (!Number.isFinite(ts)) return '';   // 방어: 세션 아닌 파일이 섞여도 NaN 표시 안 함
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '지금'; if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}시간`;
  return `${Math.floor(h / 24)}일`;
}
async function loadSessions() {
  const { sessions } = await (await fetch('/sessions')).json();
  sessionsEl.innerHTML = '';
  for (const s of sessions) {
    const item = el('sess'); if (s.id === currentSessionId) item.classList.add('active');
    const t = el('t', s.title || '새 대화'); const age = el('age', relAge(s.updatedAt));
    item.appendChild(t); item.appendChild(age);
    item.onclick = () => selectSession(s.id);
    sessionsEl.appendChild(item);
  }
}
async function newSession() {
  const s = await (await fetch('/sessions', { method: 'POST' })).json();
  currentSessionId = s.id; wrap.innerHTML = ''; await loadSessions();
  document.body.classList.remove('nav-open'); text.focus();
}
async function selectSession(id) {
  currentSessionId = id;
  const s = await (await fetch('/sessions/' + id)).json();
  const active = s.activePendingIds || [];
  wrap.innerHTML = '';
  for (const e of s.transcript || []) {
    if (e.role === 'user') { const box = turnBox(); box.appendChild(el('who right', '사용자')); box.appendChild(el('msg me', e.text)); }
    else if (e.role === 'assistant') { renderResult(e.result, { historical: true, activePendingIds: active }); }
  }
  await loadSessions();
  document.body.classList.remove('nav-open');
}

function renderSelfState(s) {
  if (!s) return;
  // P-RT-2 감사 B1: 자격이 usable 이어도 doctor 가 model_missing/unreachable 을 보고했으면
  // "준비됨"이라 말하지 않는다(보이는 것=되는 것).
  const healthIssue = s.modelHealthState === 'model_missing' || s.modelHealthState === 'unreachable';
  const label = s.modelAuthState !== 'usable' ? s.modelAuthState : (healthIssue ? '모델 확인 필요' : '준비됨');
  const warn = s.modelAuthState !== 'usable' || healthIssue || (s.limits && s.limits.length);
  chip.textContent = label;
  chip.classList.toggle('warn', !!warn);
  modelinfo.textContent = `${s.model} · ${label}`;
  let self = document.getElementById('stateSelf');
  if (!self) { self = document.createElement('div'); self.id = 'stateSelf'; statePanel.prepend(self); }
  self.textContent = [
    `모델: ${s.model} (${s.modelAuthState})`,
    `바로 쓰는 연결: ${s.ready.length ? s.ready.join(', ') : '없음'}`,   // 라벨만(내부 id 비노출)
    s.limits && s.limits.length ? `막힌 것: ${s.limits.join(' · ')}` : null,
    s.nextSafeAction ? `다음: ${s.nextSafeAction}` : null,
  ].filter(Boolean).join('\n');
}

// P6-18: 조용한 상태 요약. **누적된 "반드시 구분"을 라벨로 못 박는다** — 추정≠반영, 추천≠활성, 연결≠가능,
//   실패≠완료. 읽기 전용(실행/승격 버튼 없음). 안티 대시보드: 칩을 열 때만 채운다.
function renderOverview(o) {
  let el = document.getElementById('stateOv');
  if (!el) {
    el = document.createElement('div'); el.id = 'stateOv'; el.className = 'ov'; statePanel.appendChild(el);
    el.addEventListener('click', onOverviewAction); // 액션은 위임(재렌더돼도 유지)
  }
  const list = (items, fmt) => items && items.length ? esc(items.map(fmt).join(', ')) : '없음';
  // 액션 달린 항목 — 누르면 '아직 아님'에서 '완료'로 이동(구분 유지: 누르기 전엔 계속 아직 아님).
  const acts = (items, act, fmt, label) => items && items.length
    ? items.map((it) => `${esc(fmt(it))} <button class="ov-act" data-act="${esc(act)}" data-id="${esc(it.id)}">${esc(label)}</button>`).join(' · ')
    : '없음';
  const row = (cls, label, body) => `<div class="ov-row"><span class="${cls}">${esc(label)}</span> <span class="ov-k">${body}</span></div>`;
  const sec = (title, rows) => `<div class="ov-sec"><div class="ov-h">${esc(title)}</div>${rows}</div>`;
  el.innerHTML = [
    sec('연결', row('ov-on', '받을 준비됨', list(o.connections.ready, (c) => c.label)) + row('ov-off', '연결/로그인 필요', list(o.connections.notReady, (c) => c.label))),
    sec('스킬', row('ov-on', '활성화됨', list(o.skills.active, (s) => s.label)) + row('ov-off', '추천됨(아직 아님)', acts(o.skills.recommended, 'approve-skill', (s) => s.label, '승인'))),
    sec('선호', row('ov-on', '반영 중', acts(o.preferences.reflected, 'rollback-memory', (x) => x.statement, '되돌리기')) // 반영하기와 같은 수준의 되돌리기
      + row('ov-off', '확인 대기', acts(o.preferences.pending, 'confirm-pref', (x) => x.statement, '확인(반영)'))
      + row('ov-off', '추정됨(반영 안 함)', list(o.preferences.inferred, (x) => x.statement))), // 추정은 액션 없음(읽기 전용)
    sec('전달', row('ov-on', `보냄 ${o.deliveries.deliveredCount}건`, '') + row('ov-off', '전달 실패(다시 보낼 수 있어요)', acts(o.deliveries.failed, 'retry-delivery', (d) => d.target || d.label, '다시 보내기'))),
    // 검색으로 반영한 기억도 같은 자리서 되돌린다(선호 되돌리기와 같은 수준).
    sec('기억', row('ov-on', '반영 중', acts(o.memories.reflected, 'rollback-memory', (m) => m.statement, '되돌리기'))),
  ].join('');
}

async function refreshOverview() {
  try {
    const o = await (await fetch(`/overview?sessionId=${encodeURIComponent(currentSessionId || '')}`)).json();
    renderOverview(o);
  } catch { /* 요약 실패해도 자기상태 텍스트는 남는다 */ }
}

// 요약의 조용한 액션 — 이미 만든(게이트 있는) 엔드포인트를 그대로 부른다(우회 없음). 후 재조회로 이동을 보여준다.
async function onOverviewAction(e) {
  const btn = e.target.closest('.ov-act'); if (!btn) return;
  const { act, id } = btn.dataset;
  btn.disabled = true;
  try {
    if (act === 'retry-delivery') await fetch(`/deliveries/${id}/retry`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId }) });
    else if (act === 'approve-skill') await fetch(`/skills/${id}/approve`, { method: 'POST' });
    else if (act === 'confirm-pref') await fetch(`/user-model/preferences/${id}/confirm`, { method: 'POST' });
    else if (act === 'rollback-memory') await fetch('/memory/rollback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ candidateId: id }) });
    await refreshOverview();
  } catch { btn.disabled = false; }
}

function renderRecord(box, ledger) {
  const n = (ledger?.confirmed.length || 0) + (ledger?.unconfirmed.length || 0) + (ledger?.estimated.length || 0);
  if (!n) return;
  const rec = el('record');
  const head = el('head'); head.innerHTML = `<span class="tw">▸</span> 작업 기록 · 도구 ${n}개`;
  const body = el('body');
  body.textContent = [
    ledger.confirmed.length ? '확인: ' + ledger.confirmed.join('; ') : '',
    ledger.unconfirmed.length ? '미확인: ' + ledger.unconfirmed.join('; ') : '',
    ledger.estimated.length ? '추정: ' + ledger.estimated.join('; ') : '',
  ].filter(Boolean).join('\n');
  head.onclick = () => { const o = body.style.display === 'block'; body.style.display = o ? 'none' : 'block'; head.classList.toggle('open', !o); };
  rec.appendChild(head); rec.appendChild(body); box.appendChild(rec);
}

async function turn(payload) {
  const res = await fetch('/turn', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...payload, sessionId: currentSessionId }) });
  return res.json();
}

function renderResult(r, opts = {}) {
  const { historical, activePendingIds } = opts;
  renderSelfState(r.selfStateSummary);
  if (r.followUp) sysline(r.followUp.userNotice);
  if (r.kind === 'clarify') { sysline(r.question); return; }
  if (r.kind === 'gated') { return; }   // 조용히 무시된 외부 이벤트 — 사용자 화면에 남기지 않음

  if (r.kind === 'approval') {
    const box = turnBox();
    const card = el('card');
    card.appendChild(el('h4', '실행 전 승인이 필요해요'));
    // P6-15: 현재 승인 모드를 조용히 표시(정책 아님, 판단을 보여줄 뿐). smart는 기본이라 굳이 강조 안 함.
    const modeLabel = { manual: '수동', smart: '스마트', strict: '엄격' }[r.approvalMode];
    if (modeLabel) card.appendChild(el('mode', `승인 모드: ${modeLabel} · 위험한 일만 멈춰서 확인해요`));
    for (const p of r.pending) {
      const row = el('row');
      const cls = p.tier === 'A3' ? 'a3' : 'a2';
      // 내부 계약어(safetyFloor)는 화면에 그대로 노출하지 않는다 — 사용자 언어로 "꼭 확인"(감사 blocker).
      const floor = p.safetyFloor ? ' <span class="badge floor">꼭 확인</span>' : '';
      row.innerHTML = `· ${esc(p.label ?? p.action)} <span class="badge ${cls}">${esc(p.tier)}</span>${floor} — ${esc(p.preview?.impact ?? '')}`;
      card.appendChild(row);
      // P6-15: 왜 확인하는지 사용자 언어로. 개발자식 설명 금지.
      if (p.reason?.why) {
        const w = el('why'); w.innerHTML = `<b>왜 확인하나요</b> ${esc(p.reason.why)}`; card.appendChild(w);
      }
      // P6-7: send류는 어디에/무엇을을 사용자 언어로 분명히 보여준다(문장 전체가 아니라 분리된 내용).
      if (p.preview?.what != null || p.preview?.where != null) {
        const d = el('why');
        if (p.preview.where != null) d.appendChild(el(null, `어디에: ${p.preview.where}`));
        if (p.preview.what != null) d.appendChild(el(null, `무엇을: ${p.preview.what}`));
        card.appendChild(d);
      } else if (p.reason?.whatChanges) {
        const c = el('why'); c.innerHTML = `<b>무엇이 바뀌나요</b> ${esc(p.reason.whatChanges)}`; card.appendChild(c);
      }
      // 되돌릴 수 있는지 — reason 우선, 없으면 preview.cancel.
      const rev = p.reason?.reversible ?? p.preview?.cancel;
      if (rev) { const rv = el('why'); rv.innerHTML = `<b>되돌리기</b> ${esc(rev)}`; card.appendChild(rv); }
    }
    // 재접속(historical)이라도 그 승인이 아직 유효하면(activePendingIds) 다시 눌러 이어실행할 수 있다.
    // 만료·해소돼 목록에 없으면 정직하게 지난 요청으로만 표시(죽은 버튼 금지).
    const stillActive = historical ? (activePendingIds || []).includes(r.pendingId) : true;
    if (!stillActive) { card.appendChild(el('row hist', '지난 승인 요청')); box.appendChild(card); return; }
    const btns = el('btns');
    const yes = document.createElement('button'); yes.className = 'act primary'; yes.textContent = '승인';
    const no = document.createElement('button'); no.className = 'act no'; no.textContent = '보내지 마';
    yes.onclick = async () => { card.remove(); renderResult(await turn({ approve: r.pendingId })); await loadSessions(); };
    no.onclick = async () => { card.remove(); renderResult(await turn({ reject: r.pendingId })); await loadSessions(); };
    btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
    box.appendChild(card); return;
  }

  const box = turnBox();
  box.appendChild(el('who', 'GPAO-T5'));
  const bot = el('msg bot', r.reply);
  if (r.nextSafeAction) bot.textContent += `\n\n다음: ${r.nextSafeAction}`;
  box.appendChild(bot);
  renderRecord(box, r.ledger);
  // 기억 승격 후보 — 대화를 막지 않고 조용히 제안(자동 승격 아님, 헌법 §3-5). 재접속 시엔 다시 안 띄운다.
  if (!historical && r.memorySuggestion) renderSuggestion(box, r.memorySuggestion);
  // 자동화 제안 — 반복 신호를 조용히 제안(P6-3). 후보는 실행이 아니다: 승인 전엔 아무것도 실행 안 함.
  if (!historical && r.automationSuggestion?.candidateId) renderAutomationSuggestion(box, r.automationSuggestion);
  // 능력 부족 통합 안내(2.0-C-0) — 커넥터(연결)·도구(준비)를 하나의 카드로. 제안과 달리 "작업 복귀 경로"라
  // 재접속/새로고침(historical)에도 남긴다. 버튼은 실제 다음 행동만 수행(죽은 버튼 아님). 승인/대상확인은
  // 각각 approval·clarify 흐름이 담당(패킷은 그 분류도 담지만 렌더는 여기서 연결/도구만).
  if (r.capabilityResolution && ['connector', 'tool'].includes(r.capabilityResolution.capabilityType)) {
    renderCapabilityResolution(box, r.capabilityResolution);
  }
  // 작업 방식 학습 후보(P6-11) — "다음부터 이 대상으로?" 제안(자동 아님). 승인+replay 통과해야 영향.
  if (!historical && r.patternCandidate?.patternId) renderPatternCandidate(box, r.patternCandidate);
  // 전달 실패(P6-14) — 만든 결과가 전달 안 됨. 처음부터가 아니라 "다시 보내기"로 복구(작업 복귀 경로 → historical).
  if (r.deliveryFailed?.deliveryId) renderDeliveryFailed(box, r.deliveryFailed);
}

// 전달 실패 복구 카드 — 산출물은 남았으니 재전달만. 완료는 실제 전달 이후에만.
function renderDeliveryFailed(box, df) {
  const card = el('suggest');
  card.appendChild(el('sug-t', '결과는 만들었는데 전달이 막혔어요'));
  card.appendChild(el('sug-line', `${df.userSafeSummary || '전달에 실패했어요.'} ${df.needsFix ? '연결/권한을 확인한 뒤' : ''} 다시 보낼까요? (처음부터 다시 안 해요)`));
  const btns = el('btns');
  const retry = document.createElement('button'); retry.className = 'act primary'; retry.textContent = '다시 보내기';
  retry.onclick = async () => {
    const r = await (await fetch(`/deliveries/${df.deliveryId}/retry`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId }) })).json();
    card.remove();
    box.appendChild(el('sug-done', r.ok ? '다시 보냈어요. 전달됐어요.' : `아직 전달이 안 됐어요. ${r.userSafeSummary || ''}`));
  };
  const no = document.createElement('button'); no.className = 'act no'; no.textContent = '나중에';
  no.onclick = () => card.remove();
  btns.appendChild(retry); btns.appendChild(no); card.appendChild(btns);
  box.appendChild(card);
}

// 학습 후보 카드 — 승격하면 다음부터 대상 확인 질문이 준다. 승인(A2)은 계속. 되돌릴 수 있다(멋대로 아님).
function renderPatternCandidate(box, pc) {
  const card = el('suggest');
  card.appendChild(el('sug-t', '이 도구의 기본 대상으로 기억할까요?'));
  card.appendChild(el('sug-s', `${pc.target}`));
  // 숨은 전역 영향 금지 — 범위를 사용자 언어로 정직하게(이 슬라이스는 모든 대화 공통).
  card.appendChild(el('sug-line', '모든 대화에서 이 도구의 기본 대상으로 기억해요. 다음엔 "어디로?"를 묻지 않아요. 보낼 때 승인은 계속 받고, 되돌릴 수 있어요.'));
  const btns = el('btns');
  const yes = document.createElement('button'); yes.className = 'act primary'; yes.textContent = '기본으로 설정';
  yes.onclick = async () => {
    const r = await (await fetch('/patterns/confirm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ patternId: pc.patternId }) })).json();
    card.remove();
    if (!r.ok) { box.appendChild(el('sug-done', r.userSafeReason ? `설정하지 않았어요. ${r.userSafeReason}` : '설정하지 않았어요.')); return; }
    const done = el('sug-done');
    done.appendChild(el('sug-line', `모든 대화에서 이 도구는 ${r.target}로 보내요(기본 대상, 승인은 계속 받아요).`));
    const undo = document.createElement('button'); undo.className = 'act no'; undo.textContent = '되돌리기'; undo.style.marginTop = 'var(--sp-2)';
    undo.onclick = async () => {
      await fetch('/patterns/rollback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tool: r.tool }) });
      done.replaceChildren(el('sug-line', '되돌렸어요. 다음엔 다시 어디로 보낼지 확인해요.'));
    };
    done.appendChild(undo);
    box.appendChild(done);
  };
  const no = document.createElement('button'); no.className = 'act no'; no.textContent = '아니요';
  no.onclick = () => card.remove();
  btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
  box.appendChild(card);
}

// 통합 능력 부족 카드 — 무엇이 부족한지 / 왜 / 다음 행동을 사용자 언어로. 원래 작업 복귀 맥락 유지.
function renderCapabilityResolution(box, cr) {
  const card = el('suggest');
  const isTool = cr.capabilityType === 'tool';
  const name = cr.missingCapability || '이 도구';
  card.appendChild(el('sug-t', isTool ? `"${name}" 준비가 필요해요` : `${name} 연결이 필요해요`));
  card.appendChild(el('sug-line', `${cr.reason} 준비되면 이어서 진행할게요.`));
  const btns = el('btns');
  const yes = document.createElement('button'); yes.className = 'act primary';
  yes.textContent = isTool ? '개인 도구 준비' : '연결 화면 열기';
  yes.onclick = async () => {
    if (isTool) {
      const r = await (await fetch('/personal-tools', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: cr.ref?.label, kind: cr.ref?.kind }) })).json();
      card.remove();
      if (!r.ok) { box.appendChild(el('sug-done', '개인 도구를 준비하지 못했어요.')); return; }
      const done = el('sug-done');
      done.appendChild(el('sug-line', '개인 도구를 준비했어요(확인 전). 설정 확인을 통과하면 쓸 수 있어요.'));
      box.appendChild(done);
      openToolbox(r.id);
    } else {
      openToolbox(cr.ref?.toolId); // 도구함의 그 도구로 focus(실제 연결 실행은 후속)
    }
  };
  const no = document.createElement('button'); no.className = 'act no'; no.textContent = '나중에';
  no.onclick = () => card.remove();
  btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
  box.appendChild(card);
}

// 자동화 후보를 조용히 제안. 승인해도 범위·만료·취소·원장이 있다. 승인 전 영향 0.
function renderAutomationSuggestion(box, sug) {
  const card = el('suggest');
  card.appendChild(el('sug-t', '이 작업을 자동으로 반복할까요?'));
  card.appendChild(el('sug-s', `"${sug.statement}"`));
  card.appendChild(el('sug-line', '승인 전엔 아무것도 실행하지 않아요. 켜도 범위·만료(기본 30일)·취소가 있고 실행은 원장에 남아요.'));
  const btns = el('btns');
  const yes = document.createElement('button'); yes.className = 'act primary'; yes.textContent = '자동화 승인';
  const no = document.createElement('button'); no.className = 'act no'; no.textContent = '아니요';
  yes.onclick = async () => {
    const expiresAt = Date.now() + 30 * 24 * 3600 * 1000; // 기본 30일 범위 — 만료·재승인 보장(무기한 금지)
    const r = await (await fetch('/automation/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ candidateId: sug.candidateId, expiresAt }) })).json();
    card.remove();
    if (!r.ok) { box.appendChild(el('sug-done', '자동화를 켜지 못했어요.')); return; }
    const done = el('sug-done');
    done.appendChild(el('sug-line', `자동화를 예약했어요${r.external ? ' (외부 전송 — 승인 범위 유지)' : ''}. 30일 후 만료돼요.`));
    const cancel = document.createElement('button'); cancel.className = 'act no'; cancel.textContent = '취소'; cancel.style.marginTop = 'var(--sp-2)';
    cancel.onclick = async () => {
      await fetch('/automation/cancel', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jobId: r.jobId }) });
      done.replaceChildren(el('sug-line', '자동화를 취소했어요. 앞으로 실행하지 않아요.'));
    };
    done.appendChild(cancel);
    box.appendChild(done);
  };
  no.onclick = () => card.remove();
  btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
  box.appendChild(card);
}

// 기억 후보를 조용히 제안. preference=바로 기억, operating_principle=검토(replay) 후 적용.
function renderSuggestion(box, sug) {
  const isPrin = sug.kind === 'operating_principle';
  const card = el('suggest');
  card.appendChild(el('sug-t', isPrin ? '운영 원칙으로 기억할까요? (검토 후 적용)' : '이걸 기본으로 기억할까요?'));
  card.appendChild(el('sug-s', `"${sug.statement}"`));
  const btns = el('btns');
  const yes = document.createElement('button'); yes.className = 'act primary'; yes.textContent = isPrin ? '검토 후 적용' : '기억하기';
  const no = document.createElement('button'); no.className = 'act no'; no.textContent = '아니요';
  yes.onclick = async () => {
    const r = await (await fetch('/memory/confirm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ candidateId: sug.candidateId }) })).json();
    card.remove();
    if (!r.ok) {
      box.appendChild(el('sug-done', r.reason === 'replay_failed' ? '과거와 충돌해 적용하지 않았어요.' : '적용하지 않았어요.'));
      return;
    }
    // 권한 표면(감사 보정): 무엇을·어디에 반영·되돌리기. 운영원리는 "기본 검토"로 정직하게.
    const done = el('sug-done');
    const head = isPrin ? '원칙으로 기억했어요 (기본 검토).' : '기억했어요.';
    done.appendChild(el('sug-line', `${head} 앞으로 ${r.influenceScope ?? '관련된 이후 대화'}에 반영해요.`));
    const undo = document.createElement('button'); undo.className = 'act no'; undo.textContent = '되돌리기';
    undo.style.marginTop = 'var(--sp-2)';
    undo.onclick = async () => {
      await fetch('/memory/rollback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ candidateId: r.candidateId }) });
      done.replaceChildren(el('sug-line', '되돌렸어요. 앞으로 반영하지 않아요.'));
    };
    done.appendChild(undo);
    box.appendChild(done);
  };
  no.onclick = () => card.remove();
  btns.appendChild(yes); btns.appendChild(no); card.appendChild(btns);
  box.appendChild(card);
}

async function submit() {
  const t = text.value.trim(); if (!t) return;
  if (!currentSessionId) await newSession();
  const box = turnBox(); box.appendChild(el('who right', '사용자')); box.appendChild(el('msg me', t));
  text.value = ''; text.style.height = 'auto'; document.body.classList.remove('nav-open');
  // P6-12: 스트림으로 조용한 작업 흐름을 보여주고, complete 시 지속된 결과를 렌더한다(끊겨도 진실은 세션에 남음).
  const trace = el('trace', '요청을 이해하고 있어요…'); box.appendChild(trace);
  try {
    const recovery = await streamTurn(t, trace);
    trace.remove();
    if (recovery) {
      renderRecovery(box, recovery);
      return;
    }
    const sess = await (await fetch(`/sessions/${currentSessionId}`)).json();
    const last = (sess.transcript || []).filter((e) => e.role === 'assistant').at(-1);
    if (last) renderResult(last.result); // 스트림이 실행·지속한 그 결과(중복 실행 없음)
    await loadSessions();
  } catch {
    trace.remove();
    sysline('연결에 문제가 있었어요. 잠시 후 다시 시도해 주세요.');
  }
}

function renderRecovery(box, r) {
  box.appendChild(el('who', 'GPAO-T5'));
  const bot = el('msg bot', r.text || '처리 중 잠시 멈췄어요.');
  if (r.nextSafeAction) bot.textContent += `\n\n다음: ${r.nextSafeAction}`;
  box.appendChild(bot);
}

// 진행 상태를 조용히 표시. 모델 사고 원문이 아니라 trace_status/tool_progress 등 사용자 언어 상태만.
// 사용자 원문은 POST 본문으로만 보내고(URL 노출 금지), streamId로만 구독한다(프라이버시).
async function streamTurn(t, trace) {
  const start = await (await fetch('/turn/stream-start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId, text: t }) })).json();
  if (!start.streamId) throw new Error('stream-start');
  return new Promise((resolve, reject) => {
    const url = `/turn/stream?sessionId=${encodeURIComponent(currentSessionId)}&streamId=${encodeURIComponent(start.streamId)}`;
    const es = new EventSource(url);
    let done = false;
    let recovery = null;
    const show = (e) => { try { trace.textContent = (JSON.parse(e.data).text || '작업 중') + '…'; } catch {} };
    es.addEventListener('trace_status', show);
    es.addEventListener('tool_progress', show);
    es.addEventListener('evidence_added', () => { trace.textContent = '근거를 정리하고 있어요…'; });
    es.addEventListener('approval_required', () => { trace.textContent = '승인이 필요해요…'; });
    es.addEventListener('capability_needed', () => { trace.textContent = '연결/준비가 필요해요…'; });
    es.addEventListener('recoverable_error', (e) => {
      try {
        recovery = JSON.parse(e.data);
        trace.textContent = recovery.text || '처리 중 잠시 멈췄어요…';
      } catch {
        recovery = { text: '처리 중 잠시 멈췄어요.', nextSafeAction: '잠시 후 다시 시도할까요?' };
      }
    });
    es.addEventListener('complete', () => { done = true; es.close(); resolve(recovery); });
    es.onerror = () => { es.close(); done ? resolve() : reject(new Error('stream')); };
  });
}
send.onclick = submit;
text.addEventListener('input', () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 160) + 'px'; });
text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });

// ── 첫 실행 온보딩 (P-ONB-2) ── 새 화면을 만들지 않는다. 모델 연결 패널을 펼쳐 두고
//   "무엇을 얻는지" 언어로 한 줄 안내 + 건너뛰기. 서버가 needed 를 판정한다(URL 쿼리 아님).
async function maybeRunOnboarding() {
  const ob = await (await fetch('/onboarding')).json().catch(() => null);
  if (!ob?.needed || !ob.canConnect) return false;
  statePanel.style.display = 'block';
  await refreshOverview();
  await renderModelConnect();
  const box = document.getElementById('modelConnect');
  if (box && !document.getElementById('obNote')) {
    const note = document.createElement('div');
    note.id = 'obNote';
    note.style.cssText = 'margin:0 0 6px; font-size:12px;';
    note.innerHTML = '<b>먼저 쓸 모델을 연결해요.</b> 하나만 연결하면 바로 대화를 시작할 수 있어요. '
      + '<button id="obSkip" style="font-size:11px; padding:1px 6px;">나중에 할게요</button>';
    box.prepend(note);
    document.getElementById('obSkip').onclick = async () => {
      await fetch('/onboarding/skip', { method: 'POST' });
      note.remove();
      statePanel.style.display = 'none';
    };
  }
  return true;
}

// 연결 후 첫 인사 — 문구는 모델이 만든다(하드코딩 아님). 미연결이면 인사를 만들지 않는다.
async function maybeWelcome(sessionId) {
  const ob = await (await fetch('/onboarding')).json().catch(() => null);
  if (!ob || ob.seenWelcome) return;
  const conn = await (await fetch('/model/connection')).json().catch(() => null);
  if (!conn?.connected) return; // 인사를 지어내지 않는다(fail-closed)
  const r = await (await fetch('/welcome', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId }),
  })).json().catch(() => null);
  if (r?.state === 'greeted' && r.text) renderResult({ kind: 'reply', reply: r.text }, {});
}

// 초기화: 세션 목록 → 최근 세션 복원, 없으면 새로 만든다. 첫 실행이면 연결부터 안내한다.
(async () => {
  try {
    const { sessions } = await (await fetch('/sessions')).json();
    if (sessions.length) await selectSession(sessions[0].id);
    else await newSession();
  } catch { await newSession(); }
  try {
    const onboarding = await maybeRunOnboarding();
    if (!onboarding && currentSessionId) await maybeWelcome(currentSessionId);
  } catch { /* 온보딩 실패가 채팅을 막지 않는다 */ }
})();
</script>
