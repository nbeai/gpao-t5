name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-product:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned refoundation runtime dependencies
        run: npm ci --prefix refoundation
      - name: Verify macOS Core
        run: |
          npm run refoundation:doctor
          npm run refoundation:boundary
          node --test --test-concurrency=1 --test-force-exit refoundation/test/*.test.js
      - name: Verify macOS product integrations
        run: npm run refoundation:integration
      - name: Verify macOS mutation smoke
        run: npm run refoundation:mutation
      - name: Guard committed build artifacts
        run: |
          if git ls-files | grep -E '(^|/)(dist|build|out|node_modules)/'; then
            echo "committed build artifacts found" >&2; exit 1
          fi

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Terminal runtime dependencies
        run: npm ci --prefix refoundation
      - name: Build Windows Job Object host
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual C++ toolchain not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          $outDir = Join-Path $env:GITHUB_WORKSPACE ".ci\windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE "refoundation\native\windows\t5-windows-job-host.c"
          $output = Join-Path $outDir "t5-windows-job-host.exe"
          $compile = "`"$vcvars`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /Fe:`"$output`" `"$source`""
          & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw "Windows Job Object host build failed" }
          $vcvarsArm64 = Join-Path $install "VC\Auxiliary\Build\vcvarsamd64_arm64.bat"
          $arm64 = Join-Path $outDir "t5-windows-job-host-arm64.exe"
          $compileArm64 = "`"$vcvarsArm64`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /Fe:`"$arm64`" `"$source`""
          & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compileArm64
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $arm64)) { throw "Windows ARM64 Job Object host build failed" }
          $nativeSources = @(
            "t5-windows-folder-picker",
            "t5-windows-file-activity",
            "t5-windows-coarse-app-activity",
            "t5-windows-launcher"
          )
          foreach ($name in $nativeSources) {
            $nativeSource = Join-Path $env:GITHUB_WORKSPACE ("refoundation\native\windows\" + $name + ".c")
            $nativeOutput = Join-Path $outDir ($name + ".exe")
            $nativeArm64 = Join-Path $outDir ($name + "-arm64.exe")
            $linker = if ($name -eq "t5-windows-launcher") { " /link /SUBSYSTEM:WINDOWS" } elseif ($name -eq "t5-windows-coarse-app-activity") { " /link user32.lib" } else { "" }
            $compileNative = "`"$vcvars`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /Fe:`"$nativeOutput`" `"$nativeSource`"$linker"
            & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compileNative
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nativeOutput)) { throw "$name x64 build failed" }
            $compileNativeArm64 = "`"$vcvarsArm64`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /Fe:`"$nativeArm64`" `"$nativeSource`"$linker"
            & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compileNativeArm64
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $nativeArm64)) { throw "$name ARM64 build failed" }
          }
          $ocrSource = Join-Path $env:GITHUB_WORKSPACE "refoundation\native\windows\t5-windows-image-ocr.cpp"
          $ocrOutput = Join-Path $outDir "t5-windows-image-ocr.exe"
          $ocrArm64 = Join-Path $outDir "t5-windows-image-ocr-arm64.exe"
          $compileOcr = "`"$vcvars`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /EHsc /std:c++17 /Fe:`"$ocrOutput`" `"$ocrSource`" /link windowsapp.lib"
          & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compileOcr
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ocrOutput)) { throw "Windows OCR helper x64 build failed" }
          $compileOcrArm64 = "`"$vcvarsArm64`" && cl.exe /nologo /W4 /WX /O2 /utf-8 /EHsc /std:c++17 /Fe:`"$ocrArm64`" `"$ocrSource`" /link windowsapp.lib"
          & "$env:SystemRoot\System32\cmd.exe" /d /s /c $compileOcrArm64
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ocrArm64)) { throw "Windows OCR helper ARM64 build failed" }
          "T5_WINDOWS_JOB_HOST=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Qualify Windows Job Object source and argv contract
        shell: pwsh
        run: node --test --test-timeout=20000 refoundation/test/windows-process-boundary.test.js
      - name: Qualify Windows CurrentUser DPAPI
        shell: pwsh
        run: node --test --test-timeout=20000 refoundation/test/windows-dpapi-secret-store.test.js
      - name: Qualify Windows PowerShell Job Object and ConPTY journey
        shell: pwsh
        run: node --test --test-timeout=30000 --test-force-exit refoundation/test/terminal-windows.integration.js
      - name: Qualify Windows memory projection and Explorer boundary
        shell: pwsh
        run: node --test --test-timeout=20000 refoundation/test/windows-memory-platform.integration.js
      - name: Verify Windows packaged layout and fail-closed bootstrap contracts
        shell: pwsh
        run: node --test --test-timeout=20000 refoundation/test/windows-product-environment.test.js refoundation/test/windows-package-contract.test.js refoundation/test/windows-native-helper-contract.test.js refoundation/test/windows-product-entry-wiring.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: t5-windows-terminal-hosts
          path: .ci/windows/*.exe
