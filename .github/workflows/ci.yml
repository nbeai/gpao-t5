name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 의존성 0 — 설치 단계 없음. 전체 계약·시나리오 테스트를 실행한다(환경헌장: CI는 전체).
      - name: Run tests
        run: node --test
      # **산출물 검증 게이트**(P-DIST-1, T3 제1원칙): 개발 트리가 아니라 npm pack 으로 만든
      # tarball 을 펼쳐 실제 실행하고 health·온보딩 도달까지 확인한다. 배포 단계에서만 터지는
      # 사고(치환이 가드를 먹음·설치가 제품 코드를 지움)는 이 게이트가 아니면 못 잡는다.
      - name: Verify package artifact
        run: npm run verify:package

      # 산출물이 저장소에 섞여 커밋되지 않았는지 확인(빌드 아티팩트는 out-of-tree).
      - name: Guard committed build artifacts
        run: |
          if git ls-files | grep -E '(^|/)(dist|build|out|node_modules)/'; then
            echo "committed build artifacts found" >&2; exit 1
          fi
